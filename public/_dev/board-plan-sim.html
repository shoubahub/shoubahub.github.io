<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · اللوحة بشريط الخطة (عينة — أداة تطوير)</title>
<meta name="theme-color" content="#1B5183" />
<style>
  html,body{margin:0;padding:0;height:100%;background:#EFE6D6}
  iframe{border:0;width:100%;height:100%;display:block}
  .bar{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:10px;
    background:rgba(36,33,28,.86);color:#F4F1EA;border-radius:999px;padding:6px 12px;
    font:600 11.5px 'IBM Plex Sans Arabic',sans-serif;white-space:nowrap}
  .bar button{border:0;background:rgba(244,241,234,.16);color:#F4F1EA;border-radius:999px;width:26px;height:26px;font:700 14px sans-serif;cursor:pointer}
</style>
</head>
<body>
  <div class="bar"><button id="prev">›</button><span id="lbl">عينة شريط الخطة في اللوحة</span><button id="next">‹</button><a id="setBtn" style="color:#F2C879;text-decoration:underline">—</a></div>
  <iframe id="f"></iframe>
<script>
  /* اللوحة الحقيقية (board.html كما هي) وقسم «خطة المنهج» فيها يرسمه plan-strip.js بعد رسمها — عينة للاعتماد
     قبل البناء (2026-09-13). ⚠ الصفحة تكتب في الاطار فعناوين ملفاتها النسبية تحل من ‎/_dev/‎ — فيحقن <base href="/">.
     وعلى الجهاز المحلي وحده، وراية الجلسة (shouba.sim) يقبلها حارس الجلسة هنا وحده */
  (function(){ var h = location.hostname;
    if (!(h === 'localhost' || h === '127.0.0.1')) { document.body.textContent = 'أداة تطوير — تعمل على الجهاز المحلي وحده.'; throw new Error('dev only'); }
    try { sessionStorage.setItem('shouba.sim', '1'); } catch (e) {} })();
  var f = document.getElementById('f'), AR = new URLSearchParams(location.search).get('set') === 'ar';
  var sb = document.getElementById('setBtn'); sb.textContent = AR ? 'نموذج الرياضيات' : 'نموذج لكل حصة درس'; sb.href = AR ? '?' : '?set=ar';
  fetch('/board.html?x=' + Date.now()).then(function(r){ return r.text(); }).then(function(html){
    /* نموذجان للتوزيع: ?set=ar لغتي العربية (لكل حصة درس) · والاصل الرياضيات (درس يمتد حصصا) */
    var inject = '<scr' + 'ipt src="/_dev/plan-strip-data.js"></scr' + 'ipt>'
      + '<scr' + 'ipt src="/_dev/plan-strip-data-ar.js"></scr' + 'ipt>'
      + '<scr' + 'ipt src="/_dev/plan-strip.js"></scr' + 'ipt>'
      + '<scr' + 'ipt>window.__strip = PlanStrip.mount(document.querySelector(\'section[data-rail="plan"]\'),'
      + ' { plans: ' + (AR ? 'window.PLAN_SAMPLE_AR' : 'window.PLAN_SAMPLE')
      /* المختصرة في اللوحة، والصف ورابط «الخطة كاملة» يفتحان المطولة (plan-record-sim.html) */
      + ', compact: true, detail: function (p, w) { return "/_dev/plan-record-sim.html?' + (AR ? 'set=ar&' : '') + 'w=" + w + (p ? "&plan=" + p.id : ""); } });</scr' + 'ipt>';
    var doc = f.contentDocument;
    doc.open(); doc.write(html.replace('<head>', '<head><base href="/">').replace('</body>', inject + '</body>')); doc.close();
  });
  function step(d){ var s = f.contentWindow && f.contentWindow.__strip; if (!s) return;
    s.setWeek(s.week() + d); document.getElementById('lbl').textContent = 'بيانات مثال · الأسبوع ' + s.week(); }
  document.getElementById('prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('next').addEventListener('click', function(){ step(1); });
</script>
</body>
</html>
