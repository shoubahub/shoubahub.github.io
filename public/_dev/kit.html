<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · معرض المكوّنات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/identity/tokens.css" />
<link rel="stylesheet" href="/frame.css" />
<link rel="stylesheet" href="/components.css" />
<style>
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-ar);color:var(--shouba-ink)}
  .screen{width:100%;max-width:430px;min-height:100vh;background:var(--shouba-canvas);display:flex;flex-direction:column;gap:26px;padding:26px 22px 60px}
  .kh{display:flex;flex-direction:column;gap:4px}
  .kh h1{font-size:23px;font-weight:700}
  .kh p{font-size:13px;color:var(--shouba-label)}
  .block{display:flex;flex-direction:column;gap:12px}
  .block > .t{font-size:12px;font-weight:700;color:var(--shouba-amber-deep);letter-spacing:.2px}
  .sep{height:1px;background:var(--shouba-line)}
  .row{display:flex;gap:12px}
</style>
</head>
<body class="framed">
 <div class="device"><div class="viewport">
  <div class="screen">

    <div class="kh">
      <h1>معرض المكوّنات</h1>
      <p>كل لبنة مرّة واحدة — نعتمدها، ثم تُبنى منها كل الشاشات.</p>
    </div>

    <!-- شريط التقدّم + رجوع -->
    <div class="block">
      <div class="t">① شريط التقدّم + رجوع</div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px">
        <div class="prog">
          <div class="lbl">إعداد الشعبة · <b>خطوة <span style="font-family:var(--font-num)">٢</span> من <span style="font-family:var(--font-num)">٤</span></b></div>
          <div class="dots"><i class="on"></i><i class="on"></i><i></i><i></i></div>
        </div>
        <div class="back"><svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M8 4 L14 10 L8 16" stroke="#5F5648" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
    </div>
    <div class="sep"></div>

    <!-- القائمة المنسدلة (لوحة سفلية) -->
    <div class="block">
      <div class="t">② القائمة المنسدلة · لوحة سفلية</div>
      <div class="field">
        <label>المنطقة التعليمية</label>
        <div class="sdrop" data-label="المنطقة التعليمية">
          <button type="button" class="trigger">
            <span class="val ph">اختر المنطقة</span>
            <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M5 8 L10 13 L15 8" stroke="#8A7F6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <select>
            <option value="" disabled selected hidden>اختر المنطقة</option>
            <option>العاصمة</option><option>حولي</option><option>الفروانية</option>
            <option>الأحمدي</option><option>الجهراء</option><option>مبارك الكبير</option>
            <option>التعليم الخاص</option><option>التعليم الديني</option><option>التربية الخاصة</option>
          </select>
        </div>
      </div>
    </div>
    <div class="sep"></div>

    <!-- الأزرار المقطعية -->
    <div class="block">
      <div class="t">③ الأزرار المقطعية · اختيار واحد</div>
      <div class="field">
        <label>نوع المدرسة</label>
        <div class="segs" id="segsDemo">
          <button type="button" class="seg on" data-val="بنين"><span class="tick"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6.4 L4.6 9 L10 3" stroke="#F4F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>بنين</button>
          <button type="button" class="seg" data-val="بنات"><span class="tick"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6.4 L4.6 9 L10 3" stroke="#F4F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>بنات</button>
        </div>
      </div>
    </div>
    <div class="sep"></div>

    <!-- حقل نصّي -->
    <div class="block">
      <div class="t">④ حقل نصّي</div>
      <div class="field">
        <label>اسم المدرسة</label>
        <div class="paper"><input type="text" placeholder="اكتب اسم المدرسة" /></div>
      </div>
    </div>
    <div class="sep"></div>

    <!-- بطاقة اختيار -->
    <div class="block">
      <div class="t">⑤ بطاقة اختيار</div>
      <div class="pick on">
        <div class="mark"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.4 L4.6 9 L10 3" stroke="#F4F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="tx"><b>علم النفس والفلسفة</b><small><span dir="ltr">6</span> معلّمين · <span dir="ltr">34</span> حصة</small></div>
      </div>
      <div class="pick">
        <div class="mark"></div>
        <div class="tx"><b>الاجتماعيات</b><small>إشراف مؤقّت</small></div>
      </div>
    </div>
    <div class="sep"></div>

    <!-- الأزرار -->
    <div class="block">
      <div class="t">⑥ الأزرار</div>
      <button class="cta">زرّ العمل (مفعّل)</button>
      <button class="cta" disabled>زرّ العمل (معطّل)</button>
      <button class="btn-ghost">زرّ ثانوي</button>
    </div>

  </div>
 </div></div>

<script src="/components.js"></script>
<script>
  // عرض تفاعل الأزرار المقطعية داخل المعرض
  var segs = document.getElementById('segsDemo');
  [].forEach.call(segs.children, function (b) {
    b.addEventListener('click', function () {
      [].forEach.call(segs.children, function (x) { x.classList.toggle('on', x === b); });
    });
  });
</script>
</body>
</html>
