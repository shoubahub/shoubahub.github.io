<!DOCTYPE html>
<html lang="ar" dir="rtl" data-public>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · معاينة المنصة ببيانات مثال</title>
<meta name="theme-color" content="#1B5183" />
<style>
  html,body{margin:0;padding:0;height:100%;background:#EFE6D6}
  iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
  <iframe id="f" title="المنصة"></iframe>
<script src="admin-plans-sample.js"></script>
<script>
  /* معاينة المنصة ببيانات مثال بلا دخول (2026-09-12) — على الجهاز المحلي وحده.
     ?p=<الشاشة بعنوانها> (records.html افتراضا) · &seed — يعيد وثيقة المثال ولو امتلأ المخزن
     · &seed=prev — مثال فيه خطة الفصل السابق وحدها (لمعاينة «انسخ خطة الفصل السابق»).
     تفتح الشاشة الحقيقية في اطار ويتنقل منها الى غيرها كما في المنصة: راية جلسة (shouba.sim) يقبلها
     حارس الجلسة على localhost وحده (components.js). والبيانات في مخزن هذا المتصفح لا في حساب.
     (كانت تكتب الصفحة في الاطار كتابة، فاي انتقال منه ذهب الى الدخول — فلا تعاين الا شاشة واحدة) */
  (function () {
    var h = location.hostname;
    if (!(h === 'localhost' || h === '127.0.0.1')) {
      document.body.textContent = 'أداة تطوير — تعمل على الجهاز المحلي وحده.';
      throw new Error('dev only');
    }
  })();
  var Q = new URLSearchParams(location.search), P = Q.get('p') || 'records.html', PREV = Q.get('seed') === 'prev';
  var T = ['ناصر العجمي', 'عبدالله الرشيدي', 'خالد العنزي', 'فهد المطيري'];

  /* محاضر الاجتماعات: اجتماعان هذا الفصل بقرارات (فتظهر متابعتها)، وواحد من العام الماضي موقع */
  function M(id, no, date, topic, decide, carry, x){
    x = x || {};
    return { id: id, tpl: 'meetings', v: 1, year: x.year || '٢٠٢٦/٢٠٢٧', term: x.term || 'الفصل الأول', status: x.status || 'draft', signed: x.signed,
      created: date + 'T08:00:00.000Z', updated: date + 'T09:00:00.000Z',
      values: { meta: { no: no, date: date, topic: topic }, body: { carry: carry || {}, axes: [], decide: decide },
                attach: x.attach || { items: [] }, att: { roster: T.slice(), absent: [], guests: [] } } };
  }

  /* الخطة التشغيلية: ثلاثة محاور باجراءات موزعة على اشهر الفصل وحالات متابعة مختلفة —
     ومنها ما حان شهره ولم يؤشر، فيظهر في «بحاجة الى اجراء» باللوحة */
  function plan(id, year, term, mm, created, done){
    function act(k, what, who, m, all, note, st, fnote){
      return { id: 'w' + id + k, what: what, who: who, when: { m: m, all: !!all, note: note || '' },
               follow: st ? { st: st, note: fnote || '', at: created, ev: [] } : {} };
    }
    return { id: id, tpl: 'opplan', v: 1, year: year, term: term, status: done ? 'printed' : 'draft',
      created: created, updated: created,
      values: { meta: { name: 'الخطة التشغيلية لشعبة الرياضيات', year: year, term: term }, cover: {},
        axes: [
          { id: 'x' + id + '1', axis: { name: 'الأنشطة والفعاليات' }, goals: { g: 'تنمية مواهب الطلبة وربط الرياضيات بالحياة اليومية' }, acts: [
            act('a', 'إذاعة مدرسية عن يوم المعلم', ['@all'], [mm[1]], false, 'حسب جدول الإذاعة المدرسية', done && 'done'),
            act('b', 'مسابقة الرياضيات الشهرية', [T[1]], [mm[0], mm[1], mm[2], mm[3]], false, '', done ? 'done' : 'doing', done ? '' : 'الجولة الأولى تمت'),
            act('c', 'تكريم المتفوقين في نهاية الفصل', ['@admin', T[0]], [mm[4]], false, '', done && 'done'),
            act('d', 'رحلة علمية إلى المركز العلمي', [T[2]], [mm[2]], false, 'بعد موافقة الإدارة', done && 'no') ] },
          { id: 'x' + id + '2', axis: { name: 'التنمية المهنية' }, goals: { g: 'رفع كفاءة معلمي الشعبة في استراتيجيات التدريس الحديثة' }, acts: [
            act('e', 'ورشة استراتيجيات التعلم النشط', [T[0]], [mm[0]], false, '', 'done', 'حضرها معلمو الشعبة'),
            act('f', 'زيارات تبادلية بين معلمي الشعبة', ['@all'], [], true, '', done && 'done'),
            act('g', 'حضور دورة التقويم الحديث', [T[3]], [mm[1]], false, '', done && 'later') ] },
          { id: 'x' + id + '3', axis: { name: 'متابعة التحصيل' }, goals: { g: 'رفع نسب النجاح ومعالجة الضعف مبكرا' }, acts: [
            act('h', 'اختبار قصير موحد للصف العاشر', [T[1]], [mm[0]], false, '', done && 'done'),
            act('i', 'تحليل نتائج الاختبارات القصيرة', [T[0], T[2]], [mm[1]], false, '', done && 'done'),
            act('j', 'خطة علاجية للطلبة المتعثرين', ['@all'], [], true, 'متابعة أسبوعية', 'later') ] }
        ] } };
  }

  var recs = [
    M('rC', 7, '2026-05-10', 'الاستعداد للاختبارات النهائية', [], null, { year: '٢٠٢٥/٢٠٢٦', term: 'الفصل الثاني', status: 'signed',
      signed: { file: 'f0000000000000000000000a', mime: 'image/jpeg', size: 412345, at: '2026-05-12T10:00:00.000Z' } }),
    M('rA', 1, '2026-09-01', 'الاستعداد لانطلاق العام', [
      { id: 'dA', text: 'تسليم التوزيع الزمني للمنهج', owner: 'جميع المعلمين', due: '2026-09-06' },
      { id: 'dB', text: 'تجهيز بنك أسئلة الوحدة الأولى', owner: 'فهد المطيري', due: '2026-09-24' } ], null,
      { attach: { items: [ { file: 'f00000000000000000000001', mime: 'application/pdf', size: 845000, name: 'نشرة الاختبارات القصيرة', at: '2026-09-01T09:00:00.000Z' } ] } }),
    M('rB', 2, '2026-09-08', 'متابعة الأسبوع الأول', [
      { id: 'dC', text: 'إعداد اختبار قصير موحد للصف العاشر', owner: 'خالد العنزي', due: '2026-10-01' } ], { dA: 'done' })
  ];
  /* خطة الفصل السابق دائما (للمقارنة والنسخ)، وخطة الفصل الحالي الا في &seed=prev */
  recs.push(plan('P0', '٢٠٢٥/٢٠٢٦', 'الفصل الثاني', [2, 3, 4, 5, 6], '2026-02-08T08:00:00.000Z', true));
  if (!PREV) recs.push(plan('P1', '٢٠٢٦/٢٠٢٧', 'الفصل الأول', [9, 10, 11, 12, 1], '2026-09-05T08:00:00.000Z', false));

  /* شبكتا المتابعة: سجل اعداد لخالد العنزي بثلاث متابعات، وكشف اعمال تحريرية لفهد المطيري بخمسة متعلمين */
  function grid(id, tpl, who, rows, created, v){
    return { id: id, tpl: tpl, v: v || 1, year: '٢٠٢٦/٢٠٢٧', term: 'الفصل الأول', status: 'draft', who: who, created: created, updated: created,
      values: { meta: { who: who, term: 'الفصل الأول', year: '٢٠٢٦/٢٠٢٧' }, rows: rows } };
  }
  var PK = ['hook','ivary','innov','ilink','gcover','gphrase','glevels','gdomains','aclear','alinks','askills','ageneral','aproblem',
            'nvary','ngoals','ndiff','ncoop','emeasure','evary','ecover','xvary','xlevels','xlink'];
  recs.push(grid('G1', 'prep', 'خالد العنزي', ['2026-09-06', '2026-09-13', '2026-09-20'].map(function(dt, i){
    var r = { id: 'wg1' + i, date: dt, sign: '' };
    PK.forEach(function(k, j){ r[k] = (j + i) % 4 !== 0; });
    return r;
  }), '2026-09-06T08:00:00.000Z'));
  var WK = ['cvary','cread','cmaps','csheets','cneat','cfix','cpraise','ovary','omaps','oresearch','oneat','opraise','ofix'];
  recs.push(grid('G2', 'written', 'فهد المطيري', ['عبدالعزيز سعد','محمد فيصل','يوسف أحمد','سالم ناصر','راشد خالد'].map(function(nm, i){
    var r = { id: 'wg2' + i, name: nm, cls: ['10/2', '10/4', '11/1'][i % 3], date: '2026-09-10', note: i === 2 ? 'يحتاج متابعة في الخرائط' : '' };
    WK.forEach(function(k, j){ r[k] = (j + i) % 3 !== 0; });
    return r;
  }), '2026-09-10T08:00:00.000Z', 2));   /* الاصدار ٢: بعمود الفصل */

  /* قائمة سجلاتك بلا الخطة — فيظهر سطر «جديد — أضفه» كما عند من اعد شعبته قبلها */
  var SAMPLE = { stage: 'ثانوي', department: 'الرياضيات', refDataVersion: 3, schoolName: 'ثانوية الأمل', schoolType: 'بنين',
    year: '٢٠٢٦/٢٠٢٧', term: 'الفصل الأول', teachers: T, setupDone: true, principal: 'عبدالعزيز الفلاح', supervisor: 'يوسف الكندري',
    records: ['سجل اجتماعات الشعبة', 'متابعة سجلات الإعداد', 'متابعة الأعمال التحريرية', 'سجل الزيارات الصفية'], recs: recs,
    /* جدولا فهد المطيري (رياضيات العاشر الى الثاني عشر) وخالد العنزي (الإحصاء) — فتظهر فصولهما رقاقات في كشفيهما
       وازواجهما في شريط الخطة؛ ويكتب غيرهما الفصل بيده (لا جدول له) */
    schedules: { 'فهد المطيري': {
      'الأحد':    ['10/2 · الرياضيات', '', '11/1 · الرياضيات'],
      'الاثنين':  ['', '10/4 · الرياضيات', '12/3 · الرياضيات'],
      'الثلاثاء': ['10/2 · الرياضيات', '10/4 · الرياضيات'],
      'الأربعاء': ['', '', '11/1 · الرياضيات', '12/3 · الرياضيات'],
      'الخميس':   ['10/4 · الرياضيات'] },
      'خالد العنزي': { 'الأحد': ['11/3 · الإحصاء'], 'الثلاثاء': ['', '12/1 · الإحصاء'] } } };

  try {
    if (Q.has('seed') || !localStorage.getItem('shouba.setup')) localStorage.setItem('shouba.setup', JSON.stringify(SAMPLE));
    if (!localStorage.getItem('shouba.user')) localStorage.setItem('shouba.user', JSON.stringify({ name: 'محمد البراك' }));
    /* خطط التوزيع المعتمدة (2026-09-13): بلا دخول لا يعطيها الخادم — فتبذر نسخة المخزن (shouba.plans) من خطط المختبر:
       سليمة الثانوي معتمدة الا «الإحصاء · الثاني عشر»، مثالا لـ«يجب رفع الخطة» */
    if ((Q.has('seed') || !localStorage.getItem('shouba.plans')) && window.ADMIN_PLANS_SAMPLE) {
      var AP = window.ADMIN_PLANS_SAMPLE;
      localStorage.setItem('shouba.plans', JSON.stringify({ stage: 'ثانوي', v: 'sim', set: AP.set, calendar: AP.calendar,
        plans: AP.plans.filter(function (p) { return p.stageId === '17' && p.status === 'ok' && !(p.subject === 'الإحصاء' && p.grade === 'الثاني عشر'); })
          .map(function (p) { return { key: p.key, grade: p.grade, subject: p.subject, source: p.source, stated: p.stated, periods: p.periods, weeks: p.weeks }; }) }));
    }
    sessionStorage.setItem('shouba.sim', '1');
  } catch (e) {}
  document.getElementById('f').src = '/' + P;
</script>
</body>
</html>
