<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · عينة شريط الخطة (أداة تطوير)</title>
<meta name="theme-color" content="#1B5183" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../identity/tokens.css" />
<link rel="stylesheet" href="../shell.css" />
<link rel="stylesheet" href="../components.css" />
<link rel="stylesheet" href="../frame.css" />
<style>
  /* القسم وحده — والرسم من plan-strip.js (مشترك مع board-plan-sim.html). وما سواه من اللوحة نفسها */
  .board{display:flex;flex-direction:column;gap:20px;padding-top:14px}
  .planline{padding:0 var(--gap-side);font-size:12px;color:var(--shouba-text-muted);font-weight:600}
  .planline b{color:var(--shouba-navy)}
  /* شريط اداة التطوير — ليس من التصميم */
  .devbar{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:10px;
    background:rgba(36,33,28,.86);color:#F4F1EA;border-radius:999px;padding:6px 12px;font:600 11.5px 'IBM Plex Sans Arabic',sans-serif;white-space:nowrap}
  .devbar button{border:0;background:rgba(244,241,234,.16);color:#F4F1EA;border-radius:999px;width:26px;height:26px;font:700 14px sans-serif;cursor:pointer}
</style>
</head>
<body class="framed">
 <div class="device"><div class="viewport">
    <div class="topbar">
      <div class="tbcrest"><img src="../identity/assets/logo-vec-dark.svg" alt="شعبة" style="object-fit:contain;padding:5px" /></div>
      <div class="tt"><b>شعبة الرياضيات</b><span id="dateLine">—</span></div>
    </div>
  <div class="screen has-topbar has-tabbar">
    <div class="content">
      <div class="board">
        <section data-rail="plan" id="plan">
          <div class="sect"><div class="h">خطة المنهج</div><div class="a">—</div></div>
          <div class="slices"></div>
          <div class="planline"></div>
        </section>
      </div>
    </div>
  </div>
  <div class="tabbar">
    <button class="tab on">اللوحة</button>
    <button class="tab">المعلمون</button>
    <button class="tab-add" aria-label="إضافة"><svg width="19" height="19" viewBox="0 0 20 20" fill="none"><path d="M10 4 V16 M4 10 H16" stroke="#241D06" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    <button class="tab">سجلاتك</button>
    <button class="tab">الجدول</button>
  </div>
 </div></div>

 <div class="devbar"><button id="prev">›</button><span id="devLbl">—</span><button id="next">‹</button><a id="setBtn" style="color:#F2C879;text-decoration:underline">—</a></div>

<script>
  /* اداة تطوير: على الجهاز المحلي وحده، وراية الجلسة يقبلها حارس الجلسة هنا وحده (components.js) */
  (function(){ var h = location.hostname;
    if (!(h === 'localhost' || h === '127.0.0.1')) { document.body.textContent = 'أداة تطوير — تعمل على الجهاز المحلي وحده.'; throw new Error('dev only'); }
    try { sessionStorage.setItem('shouba.sim', '1'); } catch (e) {} })();
</script>
<script src="plan-strip-data.js"></script>
<script src="plan-strip-data-ar.js"></script>
<script src="plan-strip.js"></script>
<script src="../build.js"></script>
<script src="../refdata.js"></script>
<script src="../derive.js"></script>
<script src="../icons.js"></script>
<script src="../components.js"></script>
<script>
  /* نموذجان للتوزيع: ?set=ar لغتي العربية (لكل حصة درس) · والاصل الرياضيات (درس يمتد حصصا) */
  var AR = new URLSearchParams(location.search).get('set') === 'ar';
  document.querySelector('.topbar .tt b').textContent = AR ? 'شعبة اللغة العربية' : 'شعبة الرياضيات';
  var sb = document.getElementById('setBtn'); sb.textContent = AR ? 'نموذج الرياضيات' : 'نموذج لكل حصة درس'; sb.href = AR ? '?' : '?set=ar';
  var strip = PlanStrip.mount(document.getElementById('plan'), {
    plans: AR ? window.PLAN_SAMPLE_AR : window.PLAN_SAMPLE,
    onWeek: function (w, range, ord) {
      document.getElementById('dateLine').textContent = 'الأسبوع ' + ord + ' · ' + range;
      document.getElementById('devLbl').textContent = 'بيانات مثال · الأسبوع ' + w;
    }
  });
  document.getElementById('prev').addEventListener('click', function(){ strip.setWeek(strip.week() - 1); });
  document.getElementById('next').addEventListener('click', function(){ strip.setWeek(strip.week() + 1); });
</script>
</body>
</html>
