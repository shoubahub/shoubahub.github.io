<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · [اسم الشاشة]</title>
<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#16456E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="identity/assets/app-icon-approved.png" />
<!-- الأساس المشترك — لا تعد كتابة أي هيكل هنا -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="identity/tokens.css?v=54" />
<link rel="stylesheet" href="shell.css?v=54" />
<link rel="stylesheet" href="components.css?v=54" />
<link rel="stylesheet" href="frame.css?v=54" />
<style>
  /* أنماط خاصة بهذه الشاشة فقط — لا body ولا .screen ولا هوامش عامة (كلها في shell.css) */
  .head{ padding:30px var(--gap-side) 0; display:flex; flex-direction:column; gap:8px }
  .head .h{ font-size:25px; font-weight:700 }
  .head .s{ font-size:13.5px; color:var(--shouba-label); line-height:1.7 }
  .fields{ padding:26px var(--gap-side) 0; display:flex; flex-direction:column; gap:22px }
</style>
</head>
<!--
  اختر نمط الشاشة (احذف ما لا يلزم):
   • ترحيب/دخول  → منطقة الإجراء <div class="actions">…</div>  (متدفقة)
   • معالج/إدخال → أضف class="has-foot" على .screen + <div class="foot">…</div> (مثبت)
   • تبويب رئيسي → <div class="tabbar">…</div> (شريط تبويبات)
-->
<body class="framed">
 <div class="device"><div class="viewport">
  <div class="screen">
    <!-- لا شريط حالة وهمي ولا زخرفة صفحة (قاعدة 2026-08-15):
         الجهاز يعرض شريطه الحقيقي، ولغة الهوية عبر الشعار + توقيع الصدى على الأسطح. -->

    <!-- علامة المنصة — حضور دائم بكل شاشة (قاعدة معتمدة):
         في نمط المعالج تندمج في شريط التنقل بجانب نقاط المراحل: -->
    <div class="navrow">
      <div class="brand">
        <img src="identity/assets/logo-vec-color.svg" alt="شعبة" />
        <span class="vsep"></span>
        <div class="prog">
          <div class="lbl">إعداد الشعبة · <b>خطوة <span class="num">١</span> من <span class="num">٤</span></b></div>
          <div class="dots"><i class="on"></i><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="back" onclick="history.back()">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M8 4 L14 10 L8 16" stroke="#5F5648" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <!-- العنوان — يبقى **خارج** .content دائما كي يثبت موضعه في كل الشاشات.
         (وضعه داخل .content center يجعله يتحرك رأسيا بحسب طول المحتوى.) -->
    <div class="head">
      <div class="h">عنوان الشاشة</div>
      <div class="s">وصف قصير.</div>
    </div>

    <!-- المحتوى — هو وحده ما يبتلع الفراغ ويوزع -->
    <div class="content">
      <!-- ضع مكوناتك من components.css هنا -->
    </div>

    <!-- منطقة الإجراء (نمط متدفق افتراضيا) -->
    <div class="actions">
      <button class="cta">إجراء</button>
    </div>
  </div>
 </div></div>

<script src="build.js?v=54"></script>
<script src="components.js?v=54"></script>
<script>
  // منطق الشاشة هنا. الاسم المحفوظ: JSON.parse(localStorage.getItem('shouba.user')||'{}').name
</script>
</body>
</html>
