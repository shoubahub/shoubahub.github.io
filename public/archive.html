<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · الأرشيف</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1B5183" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="identity/assets/app-icon-approved.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="identity/tokens.css?v=55" />
<link rel="stylesheet" href="shell.css?v=55" />
<link rel="stylesheet" href="components.css?v=55" />
<link rel="stylesheet" href="frame.css?v=55" />
<style>
  /* ارشيف السجل (2026-09-12) — شاشة واحدة لكل القوالب: ?tpl=<قالب>.
     مجموعات (الفصل · العام) الاحدث اولا، وبحث في المحتوى وتصفية بالحالة، وبطاقة لكل سجل تفتح لوحة اجراءاته
     (فتح · طباعة · النسخة الموقعة · حذف). لا هيكل هنا — كله موروث من shell.css */
  .wrap{display:flex;flex-direction:column;gap:22px;padding-top:16px}
  .tools{display:flex;flex-direction:column;gap:12px;padding:0 var(--gap-side)}
  .grp{display:flex;flex-direction:column;gap:12px}
  .confirm{display:flex;flex-direction:column;gap:12px}
  .confirm p{margin:0 0 4px;font-size:13.5px;font-weight:600;color:var(--shouba-text-muted);line-height:1.8}
  /* دعوة النسخ من فصل سابق (المرحلة الثانية هـ) — لوح بحد رقيق كبطاقة البند */
  .copyinv{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:18px;background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 1.5px var(--shouba-line)}
  .copyinv p{margin:0;font-size:13.5px;font-weight:600;color:var(--shouba-text-muted);line-height:1.8}
</style>
</head>
<body class="framed">
 <div class="device"><div class="viewport">
  <div class="topbar">
    <div class="tbcrest" id="tbCrest"></div>
    <div class="tt">
      <b id="ttl">الأرشيف</b>
      <span id="sub">—</span>
    </div>
    <div class="iconbtn" data-home title="اللوحة"></div>
  </div>

  <div class="screen has-topbar has-foot">
    <div class="content">
      <div class="wrap">
        <div class="tools" id="tools" hidden>
          <div class="paper"><input id="q" type="search" enterkeyhint="search" autocomplete="off" /></div>
          <div class="segs sm" id="st" hidden></div>
        </div>
        <div id="list" class="wrap"></div>
      </div>
    </div>
  </div>

  <div class="foot">
    <button class="cta" id="new">جديد</button>
  </div>
 </div></div>

<script src="build.js?v=55"></script>
<script src="refdata.js?v=55"></script>
<script src="rec-templates.js?v=55"></script>
<script src="rec-engine.js?v=55"></script>
<script src="derive.js?v=55"></script>
<script src="icons.js?v=55"></script>
<script src="components.js?v=55"></script>
<script src="rec-files.js?v=55"></script>
<script>
  var S = Shouba, d = S.data(), Q = new URLSearchParams(location.search);

  (function paintTopCrest(){
    var el = document.getElementById('tbCrest'), c = d.crest;
    if (c && c.type === 'image') el.innerHTML = '<img src="' + c.data + '" alt="شعار المدرسة" />';
    else if (c && c.type === 'icon' && window.SHOUBA_ICONS) el.innerHTML = SHOUBA_ICONS.svg(c.id, 22);
    else el.innerHTML = '<img src="identity/assets/logo-vec-dark.svg" alt="شعبة" style="object-fit:contain;padding:5px" />';
  })();

  var t = ShoubaRec.latest(Q.get('tpl') || '');
  var listEl = document.getElementById('list'), toolsEl = document.getElementById('tools');
  var qEl = document.getElementById('q'), stEl = document.getElementById('st'), newBtn = document.getElementById('new');
  var state = { q: '', status: '' };
  /* الحالة شارة بلونها: مسودة ترابي · مطبوع عنبري (ينتظر التوقيع) · موقع كحلي */
  var ST = { draft: { t: 'مسودة', c: 'chip muted' }, printed: { t: 'مطبوع', c: 'chip' }, signed: { t: 'موقع', c: 'chip navy' } };
  var DEC = { one: 'قرار', two: 'قراران', few: 'قرارات', many: 'قرارا' };

  function dm(iso){ var p = String(iso || '').slice(0, 10).split('-'); return p.length === 3 ? (+p[2]) + '/' + (+p[1]) : ''; }
  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function past(r){ return !!(r.year && d.year && r.year !== d.year); }

  if (!t) {
    listEl.appendChild(el('div', 'vlist')).appendChild(el('div', 'invite', 'هذا السجل لم يجهز قالبه بعد — افتح سجلاتك لتختار غيره.'));
    newBtn.textContent = 'سجلاتك';
    newBtn.addEventListener('click', function(){ location.href = 'records.html'; });
  } else start();

  function start(){
    var noun = t.noun || { one: 'سجل', two: 'سجلان', few: 'سجلات', many: 'سجلا', zero: 'لا سجلات بعد' };
    /* عدد القرارات المفتوحة على البطاقة — لمن في قالبه قسم قرارات فقط */
    var hasDec = t.blocks.some(function(b){ return (b.sections || []).some(function(s){ return s.kind === 'smart:decisions'; }); });
    /* شبكة يختار رئيس الشعبة عناصرها (table.choose — قرار المستخدم 2026-09-12): اول فتح يسأله الاختيار
       (rec-items.html)، ثم سطر «عناصر النموذج» فوق القائمة ليعدله متى شاء — ويسري على السجلات الجديدة */
    var chooser = t.blocks.filter(function(b){ return b.type === 'table' && b.choose; })[0];
    if (chooser && !S.pickOf(t.id)) { location.replace('rec-items.html?tpl=' + encodeURIComponent(t.id)); return; }
    if (chooser) {
      var picked = ((S.pickOf(t.id) || {})[chooser.id] || []).length;
      var total = chooser.columns.filter(function(c){ return c.kind === 'check'; }).length;
      var pw = el('div', 'vlist'), pl = el('button', 'entry');
      pl.type = 'button';
      pl.appendChild(el('b', null, 'عناصر النموذج'));
      pl.appendChild(el('span', 'val', 'اخترت ' + picked + ' من ' + total));
      pl.appendChild(el('span', 'chev', '‹'));
      pl.addEventListener('click', function(){ location.href = 'rec-items.html?tpl=' + encodeURIComponent(t.id); });
      pw.appendChild(pl);
      toolsEl.parentNode.insertBefore(pw, toolsEl);
    }
    document.getElementById('ttl').textContent = t.title;
    document.title = 'شعبة · ' + t.title;
    qEl.placeholder = 'ابحث في ' + noun.few + 'ك';
    qEl.setAttribute('aria-label', qEl.placeholder);
    newBtn.textContent = noun.one + ' جديد';
    /* سجل المعلم (owner:'teacher' — شبكتا المتابعة): الجديد يسأل لمن، ومن له سجل في هذا الفصل يفتح سجله
       فتضاف اليه المتابعات (سجل واحد لكل معلم في الفصل) */
    newBtn.addEventListener('click', function(){
      if (t.owner !== 'teacher') { location.href = 'record.html?tpl=' + encodeURIComponent(t.id); return; }
      var names = S.teachers(), n = el('div', 'setlist');
      if (!names.length) n.appendChild(el('div', 'soon-note', 'أضف معلمي شعبتك أولا — من تبويب «المعلمون».'));
      names.forEach(function(nm){
        var mine = S.recs(t.id).filter(function(r){ return r.who === nm && isNow(r); })[0], b = el('button', 'setitem');
        b.type = 'button';
        b.appendChild(el('b', null, 'أ. ' + nm));
        var span = t.scope === 'year' ? 'لهذا العام' : 'لهذا الفصل';   /* سجل العام (scope:'year') واحد في العام */
        b.appendChild(el('small', null, mine ? noun.one + 'ه ' + span + ' — افتحه' : noun.one + ' جديد ' + span));
        b.addEventListener('click', function(){
          location.href = mine ? 'record.html?id=' + encodeURIComponent(mine.id) : 'record.html?tpl=' + encodeURIComponent(t.id) + '&who=' + encodeURIComponent(nm);
        });
        n.appendChild(b);
      });
      S.sheet.open(t.title + ' — لأي معلم؟', n);
    });
    qEl.addEventListener('input', function(){ state.q = qEl.value; render(); });

    function titleOf(s){ return s.no !== '' ? noun.one + ' رقم ' + s.no : noun.one; }

    /* لوحة تفتح بعد اغلاق السابقة (حركة الاغلاق) — وتعيد دالة تغلقها او تلغيها ان لم تفتح بعد */
    function sheet(title, node){
      var tm;
      S.sheet.close();
      tm = setTimeout(function(){ tm = 0; S.sheet.open(title, node); }, 320);
      return function(){ if (tm) clearTimeout(tm); else S.sheet.close(); };
    }
    function notice(title, text){ var n = el('div', 'confirm'); n.appendChild(el('p', null, text)); return sheet(title, n); }
    /* تأكيد لما لا يسترجع — المكون المشترك في components.js (ومعه حذف السجل: Shouba.askDeleteRec) */
    var ask = S.ask;

    /* التصفية: «الكل» وما وجد من الحالات فقط — ولا تظهر ان لم تكن الا حالة واحدة (لا عنصر وهمي) */
    function segs(present){
      var opts = [''].concat(present), k = opts.join();
      if (present.indexOf(state.status) < 0) state.status = '';
      stEl.hidden = present.length < 2;
      if (stEl.dataset.k === k) return;
      stEl.dataset.k = k;
      stEl.textContent = '';
      opts.forEach(function(v){
        var b = el('button', 'seg' + (state.status === v ? ' on' : ''), v ? ST[v].t : 'الكل');
        b.type = 'button';
        b.addEventListener('click', function(){
          state.status = v;
          [].forEach.call(stEl.children, function(x, i){ x.classList.toggle('on', opts[i] === v); });
          render();
        });
        stEl.appendChild(b);
      });
    }

    function card(r){
      var s = ShoubaRec.summary(r), st = ST[r.status || 'draft'] || ST.draft, b = el('button', 'entry rcard');
      var r1 = el('div', 'r1'), r2 = el('div', 'r2');
      b.type = 'button';
      /* سجل المعلم باسمه، وسائرها برقمها او اسمها */
      r1.appendChild(el('b', null, (r.who ? 'أ. ' + r.who : s.no !== '' ? 'رقم ' + s.no : noun.one) + (s.title ? ' · ' + s.title : '')));
      r1.appendChild(el('span', st.c, st.t));
      /* سجل بلا خانة تاريخ (الخطة التشغيلية): آخر تعديل عليه بدلها */
      r2.appendChild(el('span', null, s.date ? ShoubaRec.weekday(s.date) + ' ' + dm(s.date)
        : r.updated ? 'آخر تعديل ' + dm(r.updated) : 'بلا تاريخ'));
      /* عدد صفوف الجدول (المتابعات · المتعلمين) لمن في قالبه جدول بصيغ معدود */
      var tb = t.blocks.filter(function(x){ return x.type === 'table' && x.count; })[0], rows = tb && (r.values || {})[tb.id];
      if (tb && Array.isArray(rows) && rows.length) r2.appendChild(el('span', 'open', S.count(rows.length, tb.count)));
      if (hasDec) {
        var n = S.stillOpen(r).length;
        if (n) r2.appendChild(el('span', 'open', 'مفتوح منه ' + S.count(n, DEC)));
      }
      b.appendChild(r1); b.appendChild(r2);
      b.addEventListener('click', function(){ actions(r, s); });
      return b;
    }

    /* ── النسخة الموقعة (الخطوة و) ───────────────────────────────────
       ارفاقها: صورة (تصغر في الجهاز) او PDF ⟵ ترفع لحسابك ⟵ السجل «موقع». واستبدالها يحذف السابقة. */
    function attach(r){
      S.sheet.close();
      ShoubaFiles.pick(function(file){
        var done = notice('النسخة الموقعة', 'يجهز الملف ويرفعه إلى حسابك…');
        ShoubaFiles.prepare(file).then(function(p){ return ShoubaFiles.upload(r.id, p); }).then(function(j){
          var old = ShoubaRec.unsign(r);
          ShoubaRec.markSigned(r, j);
          S.saveRec(r);
          if (old && old !== j.id) ShoubaFiles.remove(old);
          done(); render();
        }).catch(function(e){
          done();
          setTimeout(function(){ notice('تعذر الإرفاق', e && e.user ? e.message : 'تعذر الرفع — أعد المحاولة'); }, 350);
        });
      });
    }
    /* العرض بالعارض المشترك (ShoubaFiles.view) — بعد اغلاق لوحة الاجراءات */
    function view(r, s){
      S.sheet.close();
      setTimeout(function(){ ShoubaFiles.view('النسخة الموقعة · ' + titleOf(s), r.signed); }, 320);
    }

    /* النسخ الى الفصل الحالي (المرحلة الثانية هـ — tpl.copy): سجل جديد بمحتوى المصدر، بعام الفصل الحالي وفصله،
       والمتابعة ممسوحة والملفات لا تنسخ (S.copyRec) — ثم يفتح لتعدله */
    /* الحالي: عام الشعبة وفصلها — وسجل العام (scope:'year') بعامه وحده */
    function isNow(r){ return (r.year || '') === (d.year || '') && (t.scope === 'year' || (r.term || '') === (d.term || '')); }
    function copyToNow(r){ var n = S.copyRec(r); if (n) location.href = 'record.html?id=' + encodeURIComponent(n.id); }

    /* لوحة الاجراءات: فتح وتعديل (او عرض لعام سابق) · المعاينة والطباعة · النسخة الموقعة · حذف بتأكيد */
    function actions(r, s){
      var n = el('div', 'setlist'), id = encodeURIComponent(r.id), old = past(r), title = titleOf(s);
      function row(t1, sub, go){
        var b = el('button', 'setitem');
        b.type = 'button';
        b.appendChild(el('b', null, t1)); b.appendChild(el('small', null, sub));
        b.addEventListener('click', typeof go === 'function' ? go : function(){ location.href = go; });
        n.appendChild(b);
      }
      row(old ? 'اعرضه' : 'افتحه وعدله', old ? 'من عام ' + r.year + ' — للاطلاع والطباعة' : 'يحفظ ما تغيره تلقائيا', 'record.html?id=' + id);
      row('المعاينة والطباعة', (r.status || 'draft') === 'draft' ? 'يصير «مطبوعا» بعد أول طباعة' : 'طبع من قبل', 'record.html?id=' + id + '&pv=1');
      if (r.signed) {
        row('النسخة الموقعة', (r.signed.mime === 'application/pdf' ? 'ملف PDF' : 'صورة') + (r.signed.at ? ' · أرفقت ' + dm(r.signed.at) : '') + ' — مرجعه الرسمي',
            function(){ view(r, s); });
        row('استبدل النسخة الموقعة', 'ترفع غيرها وتحذف هذه', function(){ attach(r); });
        row('أزل النسخة الموقعة', 'يعود «مطبوعا»', function(){
          ask('إزالة النسخة الموقعة', 'تزال النسخة الموقعة من «' + title + '» نهائيا، ويعود «مطبوعا».', 'أزلها', function(){
            var f = ShoubaRec.unsign(r); S.saveRec(r); ShoubaFiles.remove(f); render();
          });
        });
      } else {
        row('أرفق النسخة الموقعة', 'صورة أو PDF — تصير مرجعه الرسمي', function(){ attach(r); });
      }
      if (t.copy && !isNow(r)) row('انسخ إلى ' + (d.term || 'الفصل الحالي'), 'نسخة جديدة بعام الفصل الحالي — وتمسح حالات المتابعة والشواهد',
        function(){ S.sheet.close(); copyToNow(r); });
      var del = el('button', 'btn-danger', 'احذفه');
      del.type = 'button';
      /* الحذف: المصدر المشترك مع شاشة السجل — يحذفه وملفاته ويصرح باثره */
      del.addEventListener('click', function(){ S.askDeleteRec(r, title, render); });
      n.appendChild(del);
      S.sheet.open(title + (s.title ? ' · ' + s.title : ''), n);
    }

    function render(){
      var all = S.recs(t.id);
      var present = ShoubaRec.STATUS.filter(function(v){ return all.some(function(r){ return (r.status || 'draft') === v; }); });
      segs(present);
      var groups = S.archive(t.id, state);
      document.getElementById('sub').textContent = all.length ? 'أرشيف ' + noun.few + 'ك · ' + S.count(all.length, noun) : noun.zero || '—';
      toolsEl.hidden = !all.length;
      listEl.textContent = '';
      /* لا سجل للفصل الحالي وعندك من فصل سابق: النسخ يعرض اولا (المرحلة الثانية هـ) — والبحث والتصفية يخفيانه */
      if (t.copy && !state.q && !state.status && !all.some(isNow)) {
        var prev = S.prevTermRec(t.id);
        if (prev) {
          var ci = el('div', 'copyinv'), cb = el('button', 'btn-ghost', 'انسخ ' + noun.one + ' ' + (prev.term || 'الفصل السابق') + ' وعدلها');
          ci.appendChild(el('p', null, noun.one + ' ' + [d.term, d.year].filter(Boolean).join(' ') + ' لم تكتب بعد. انسخ '
            + noun.one + ' ' + [prev.term, prev.year].filter(Boolean).join(' ') + ' بما فيها، وتمسح حالات متابعتها وشواهدها، ثم عدلها.'));
          cb.type = 'button';
          cb.addEventListener('click', function(){ copyToNow(prev); });
          ci.appendChild(cb);
          listEl.appendChild(el('div', 'vlist')).appendChild(ci);
        }
      }
      if (!all.length || !groups.length) {
        listEl.appendChild(el('div', 'vlist')).appendChild(el('div', 'invite', !all.length
          ? 'لم تكتب ' + noun.few + ' بعد — ابدأ أولها من «' + noun.one + ' جديد» أدناه.'
          : 'لا نتائج — جرب كلمة أخرى، أو اختر «الكل».'));
        return;
      }
      groups.forEach(function(g){
        var grp = el('section', 'grp'), h = el('div', 'sect'), v = el('div', 'vlist');
        h.appendChild(el('div', 'h', [g.term, g.year].filter(Boolean).join(' · ') || 'بلا عام دراسي'));
        grp.appendChild(h);
        g.items.forEach(function(r){ v.appendChild(card(r)); });
        grp.appendChild(v);
        listEl.appendChild(grp);
      });
    }
    render();
  }
</script>
</body>
</html>
