<style>
  /* خاص باللوحة — الرأس والجداول والمصفوفة من components.css */
  .board{display:flex;flex-direction:column;gap:20px;padding-top:14px}
  .card-navy{padding:14px 16px;gap:10px}
  .card-navy .ttl{font-size:15.5px}
  .card-navy .acts .cta{padding:11px 14px;font-size:14px}
  .card-navy .acts .ghost2{padding:11px 15px;font-size:13.5px}
  .planline{padding:0 var(--gap-side);font-size:12px;color:var(--shouba-text-muted);font-weight:600}
  .planline b{color:var(--shouba-navy)}
  .todo{padding:0 var(--gap-side);display:flex;flex-direction:column;gap:7px}
  .more{font-size:11.5px;color:var(--shouba-hint);padding:0 var(--gap-side)}
  .invite{margin:0 var(--gap-side);font-size:12.5px;color:var(--shouba-text-muted);line-height:1.8;
    background:rgba(120,98,66,.06);border-radius:14px;padding:12px 14px}
</style>

<body class="framed">
 <div class="device"><div class="viewport">
    <div class="topbar">
      <div class="tbcrest" id="tbCrest"></div>
      <div class="tt">
        <b id="deptName">شعبتك</b>
        <span id="dateLine">—</span>
      </div>
      <div class="iconbtn" id="settings" title="الإعدادات">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="2.6" stroke="#5F5648" stroke-width="1.8"/>
          <path d="M10 2.6v2M10 15.4v2M17.4 10h-2M4.6 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2L4.8 4.8"
                stroke="#5F5648" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  <div class="screen has-topbar has-tabbar">


    <div class="content">
      <div class="board">

        <!-- ① جدول حصص اليوم (مصفوف بأعمدة — أولوية النظرة الأولى) -->
        <section data-rail="today">
          <div class="sect"><div class="h" id="todayTtl">حصص اليوم</div><div class="a" id="toSchedule">الجدول الكامل ›</div></div>
          <div class="tbl" id="periods"></div>
        </section>

        <!-- ② مصفوفة الأسبوع — تلي الجدول مباشرةً (قرار المستخدم: أعمال الأسبوع أهمّ) -->
        <section data-rail="week">
          <div class="sect"><div class="h">هذا الأسبوع</div><div class="a" id="toWeek">الرزنامة الكاملة ›</div></div>
          <div class="wmx" id="week"></div>
        </section>

        <!-- ③ إنجاز المنهج -->
        <section data-rail="plan">
          <div class="sect"><div class="h">خطة المنهج</div><div class="a" id="planPct">—</div></div>
          <div class="slices" id="slices"></div>
          <div class="planline" id="planLine"></div>
        </section>

        <!-- ④ بحاجة إلى إجراء -->
        <section data-rail="todo">
          <div class="sect"><div class="h">بحاجة إلى إجراء</div><div class="a" id="todoCount">—</div></div>
          <div class="todo" id="todo"></div>
          <div class="more" id="todoMore"></div>
        </section>

        <!-- البطاقة الورقية: ما يجري الآن / ما ينتظر قرارك.
             نزلت إلى الأسفل بقرار المستخدم: «أعمال هذا الأسبوع أهمّ، وتكون بعد الجدول». -->
        <div class="card-soft" id="nowCard"></div>

      </div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab on" data-go="/board.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 8.4 10 3l7 5.4V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      اللوحة
    </button>
    <button class="tab" data-go="/teachers.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M4 17c0-3 2.7-4.6 6-4.6S16 14 16 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      معلّموك
    </button>
    <button class="tab-add" id="add" aria-label="إضافة">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><path d="M10 4 V16 M4 10 H16" stroke="#241D06" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
    <button class="tab soon" data-soon="سجلّاتك">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 3h7l3 3v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 9h6M7 12.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      سجلّاتك
    </button>
    <button class="tab" data-go="/schedule.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="3.5" y="4.5" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 8.5h13M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      جدولك
    </button>
  </div>
 </div></div>

<script src="/build.js?v=202609060012"></script>
<script src="/refdata.js?v=202609060012"></script>
<script src="/derive.js?v=202609060023"></script>
<script src="/icons.js?v=202609060012"></script>
<script src="/components.js?v=202609060012"></script>
<script>
  var KEY='shouba.setup', R=window.SHOUBA_REF;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  var d = load();

  var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var SHORT=['أحد','اثن','ثلا','أرب','خمي'];
  var TYPE_CLASS={ 'اختبار':'t-exam', 'اجتماع':'t-meet', 'فعالية':'t-act' };

  /* ===== الرأس المضغوط ===== */
  var now=new Date(), dayIdx=now.getDay(), isWeekend=dayIdx>4;
  var todayName = isWeekend ? null : R.days[dayIdx];
  var weekNo = Shouba.weekNo();     /* null = لا تاريخ · 0 = تمهيدي */
  document.getElementById('deptName').textContent = d.department || 'شعبتك';

  /* سطر الرأس الثاني (معتمد 2026-08-27): اسم رئيس الشعبة · عدد المعلّمين · الفصل · الأسبوع.
     التاريخ خرج منه بطلب المستخدم — الأسبوع أنفع له يومياً. */
  (function headLine(){
    var head  = (window.Shouba && Shouba.user().name) || '';
    var tcount = (d.teachers || []).length;
    var term  = d.term === 'الفصل الثاني' ? 'ف٢' : d.term === 'الفصل الأول' ? 'ف١' : '';
    var parts = [];
    if(head)   parts.push('أ. ' + Shouba.shortName(head));
    if(tcount) parts.push('<b class="num">' + tcount + '</b> ' + Shouba.unit(tcount, {one:'معلّم',two:'معلّمان',few:'معلّمين',many:'معلّماً'}));
    if(term)   parts.push(term);
    /* الأسبوع لا يُذكر إلّا بسند: بلا تاريخ بداية لا يُعرض شيء، وقبل بدء الطلاب «تمهيدي» */
    if(weekNo === 0)      parts.push('الأسبوع التمهيدي');
    else if(weekNo)       parts.push('الأسبوع <b class="num">' + weekNo + '</b>');
    document.getElementById('dateLine').innerHTML = parts.join(' · ');
  })();

  /* شعار المدرسة أو رمز الشعبة في الرأس — يقرأ ما اختاره المستخدم في ش①.
     بلا اختيار: علامة المنصّة على الكحلي. */
  (function paintTopCrest(){
    var el = document.getElementById('tbCrest'), c = d.crest;
    if(c && c.type === 'image') el.innerHTML = '<img src="' + c.data + '" alt="شعار المدرسة" />';
    else if(c && c.type === 'icon' && window.SHOUBA_ICONS) el.innerHTML = SHOUBA_ICONS.svg(c.id, 22);
    else el.innerHTML = '<img src="/identity/assets/logo-vec-dark.svg" alt="شعبة" style="object-fit:contain;padding:5px" />';
  })();

  /* ===== الحصص ===== */
  var times = R.periodTimes[d.stage] || R.periodTimes['ثانوي'];
  function toMin(t){ var p=t.split(':'); return (+p[0])*60 + (+p[1]); }
  var m = now.getHours()*60 + now.getMinutes(), currentIdx=-1, nextIdx=-1;
  times.forEach(function(t,i){
    if(m >= toMin(t.from) && m < toMin(t.to)) currentIdx=i;
    if(nextIdx===-1 && m < toMin(t.from)) nextIdx=i;
  });
  if(isWeekend){ currentIdx=-1; nextIdx=-1; }

  /* الحقائق من طبقة الاشتقاق (derive.js) — اللوحة تسأل ولا تحسب */
  var teachers=Shouba.scheduled(), hasSchedules=teachers.length>0;
  var viewDay = isWeekend ? R.days[0] : todayName;              // في العطلة نعرض جدول الأحد
  function slotOf(t,p){ return Shouba.slot(t, viewDay, p); }
  function busyAt(p){ return Shouba.busyAt(viewDay, p); }
  var firstName = Shouba.firstNameOf;

  /* ===== ① جدول حصص اليوم — شارة بسطرين لكل معلّم (معتمد 2026-09-01) =====
     الاسم الأخير · تحته المادة والصف · والحصة الجارية مظلَّلة بكاملها مع الوقت المتبقّي.
     يقبل صفوف الفرص: أي عنصر في periodTimes يحمل break:true يُعرض صفَّ فرصة. */
  /* عنوان الجدول: «جدول حصص اليوم الأحد · ٦/٩» — اليوم وتاريخه بلا سنة (قرار المستخدم) */
  /* التاريخ يرافق العنوان دائماً — وفي العطلة تاريخ الأحد القادم لا تاريخ اليوم */
  var viewDate = new Date(now);
  if(isWeekend) viewDate.setDate(now.getDate() + (7 - dayIdx));
  var dateTxt = viewDate.getDate() + '/' + (viewDate.getMonth()+1);
  document.getElementById('todayTtl').textContent = isWeekend
    ? 'جدول حصص الأحد · ' + dateTxt
    : 'جدول حصص اليوم ' + todayName + ' · ' + dateTxt;
  var tbl = document.getElementById('periods');

  var ORD = ['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة'];
  var lastName  = Shouba.lastName;
  /* لون ثابت لكل معلّم بحسب ترتيبه في الشعبة — لا يتبدّل بين الحصص ولا بين الأيام */
  var ROSTER = Shouba.roster();
  function toneOf(name){ var i = ROSTER.indexOf(name); return ' t' + ((i < 0 ? 0 : i) % 8); }
  var splitSlot = Shouba.splitSlot;   /* «١١/٢ · الفلسفة» ← { cls, subject } */
  /* الوقت المتبقّي في الحصة/الفرصة الجارية */
  function leftIn(t){
    var n = new Date(), sec = toMin(t.to)*60 - (n.getHours()*3600 + n.getMinutes()*60 + n.getSeconds());
    if(sec < 0) sec = 0;
    var mm = Math.floor(sec/60), ss = sec % 60;
    return 'باقي ' + mm + ':' + (ss < 10 ? '0' : '') + ss;
  }

  var expandAll = false;      /* حالة زرّ «افرد الجدول» */
  function paintTable(){
    if(!hasSchedules){
      tbl.innerHTML = '<div class="empty">جداول معلّميك لم تُدخل بعد — وبها يُعرف مَن يدرّس في كل حصة ومَن متفرّغ.</div>';
      return;
    }
    var html = '', pIdx = -1;                       // pIdx: ترقيم الحصص وحدها (الفرص لا تُرقَّم)
    /* ما الذي **يُعرض** أصلاً؟ (قرار المستخدم 2026-09-05: الجدول لا يأكل مساحة
       اللوحة، فتظهر بقيّة أقسامها.) أثناء الدوام: الجارية مفتوحةً والتالية مطويّةً
       بتوقيتها وحده · قبل الدوام: التاليتان مطويّتان · بعده: سطرٌ واحد.
       وما عداها لا يُرسَم إطلاقاً حتى يُضغط «افرد الجدول كاملاً». */
    var dayRunning = !isWeekend && currentIdx > -1;
    var dayEnded   = !isWeekend && currentIdx === -1 && nextIdx === -1;
    var upcoming   = isWeekend ? 0 : nextIdx;          // في العطلة نعرض بداية جدول الأحد
    var shown      = {};
    if(dayRunning){ shown[currentIdx] = 1; if(nextIdx > -1) shown[nextIdx] = 1; }
    else if(!dayEnded){ shown[upcoming] = 1; if(times[upcoming + 1]) shown[upcoming + 1] = 1; }
    times.forEach(function(t, i){
      var isBreak = !!t.brk;
      var isNow = (i === currentIdx) && !isWeekend;
      if(!isBreak) pIdx++;

      var title = isBreak ? (t.label || 'فرصة') : ('الحصة ' + (ORD[pIdx] || (pIdx+1)));
      /* «انتهت» بانقضاء وقتها فعلاً — لا بوجود حصة جارية (فبعد نهاية الدوام كلّها منتهية) */
      var isPastRow = !isWeekend && m >= toMin(t.to);
      /* مطوياً: لا يُفتح إلّا الجاري. ومفروداً: تُفتح التالية بتفاصيلها كاملةً
         (طلب المستخدم 2026-09-05)، وتبقى الماضية سطراً واحداً تُفتح بالضغط. */
      var isOpen    = isNow || (expandAll && !isPastRow);
      if(!expandAll && !shown[i]) return;           /* وما عداه لا يُرسَم أصلاً */
      /* الحالة تُحجز لها خانة ثابتة حتى في الصفوف القادمة، فتستوي الأعمدة (قرار المستخدم) */
      /* عمود واحد للحالة: «باقي mm:ss» أثناء الحصة ← «انتهت» بعد انتهائها (قرار المستخدم 2026-09-01) */
      var stateTxt = isNow ? leftIn(t) : isPastRow ? 'انتهت' : '';
      var state = '<span class="state' + (stateTxt ? '' : ' is-empty') + '">' + stateTxt + '</span>';
      var head  = '<div class="top"><span class="ttl">' + title + '</span>'
                + '<span class="tm"><span class="hh">' + t.from + '</span>' + (isNow ? '<em>الآن</em>' : '') + '</span>' + state
                ;

      /* صفّ الفرصة: يحمل تنبيه المراقبة إن كان اليوم على الشعبة مراقبة (قرار المستخدم 2026-09-01) */
      if(isBreak){
        var duty = (t.duty && d.duty && d.duty[todayName]) || null;   // التنبيه في الفرص فقط لا في لقاء الصباح
        var dutyHtml = duty
          ? '<div class="duty"><span>مراقبة الشعبة اليوم</span>'
            + '<a id="dutyLink">جدول المراقبة ›</a></div>'
          : '';
        html += '<div class="per brk' + (isNow ? ' now' : '') + (isPastRow ? ' past' : '')
             + (isOpen ? '' : ' fold') + '">' + head + '</div>' + dutyHtml + '</div>';
        return;
      }

      var slotIdx = (t.n || (pIdx+1)) - 1;              // الفهرس بحسب رقم الحصة لا ترتيب الصف (الفرصة تُزيحه)
      var busy = busyAt(slotIdx), free = teachers.length - busy.length;
      html += '<div class="per' + (isNow ? ' now' : '') + (isPastRow ? ' past' : '')
            + (isOpen ? '' : ' fold') + '">'
            + head + '<span class="cnt">' + busy.length + ' يدرّسون</span></div>'
            + '<div class="pairs">';
      busy.forEach(function(name){
        var s = splitSlot(slotOf(name, slotIdx));
        html += '<span class="ch' + toneOf(name) + '"><span class="nm">' + lastName(name) + '</span>'
              + '<span class="l2"><span class="sub">' + s.subject + '</span>'
              + '<span class="cl">' + s.cls + '</span></span></span>';
      });
      if(free) html += '<span class="freechip">' + Shouba.count(free,{one:'متفرّغ',two:'متفرّغان',few:'متفرّغون',many:'متفرّغاً'}) + '</span>';
      html += '</div></div>';
    });
    if(dayEnded && !expandAll)
      html = '<div class="empty">انتهى دوام اليوم — افرد الجدول لمراجعته.</div>';
    html += '<button class="tblmore" id="tblMore">'
          + (expandAll ? 'اطوِ الجدول' : 'افرد الجدول كاملاً') + '</button>';
    tbl.innerHTML = html;
    document.getElementById('tblMore').addEventListener('click', function(e){
      e.stopPropagation(); expandAll = !expandAll; paintTable();
    });
  }
  paintTable();

  /* الحصة الماضية تُفتح بالضغط عليها */
  tbl.addEventListener('click', function(e){
    var row = e.target.closest && e.target.closest('.per.fold');
    if(row) row.classList.toggle('open');
  });
  /* العدّاد يتجدّد كل ثانية ما دامت هناك حصة جارية */
  if(currentIdx > -1 && !isWeekend && hasSchedules){
    setInterval(function(){
      var el = tbl.querySelector('.per.now .state');
      if(el) el.textContent = leftIn(times[currentIdx]);
    }, 1000);
  }

  /* ===== ② البطاقة الكحلية ===== */
  var events = d.events || [], card = document.getElementById('nowCard');
  function remain(){
    var n=new Date(), sec = toMin(times[currentIdx].to)*60 - (n.getHours()*3600 + n.getMinutes()*60 + n.getSeconds());
    if(sec<0) sec=0;
    var mm=Math.floor(sec/60), ss=sec%60;
    return 'باقي ' + mm + ':' + (ss<10?'0':'') + ss;
  }
  function paintCard(){
    var kicker, left='', ttl, sub;
    var todayEvents = events.filter(function(e){ return e.day===todayName; });
    if(currentIdx>-1 && hasSchedules){
      /* ⚠ الفهرس بحسب **رقم الحصة** لا ترتيب الصفّ — الفرص تُزيح الترتيب،
         فكانت البطاقة تقول «الحصة ٦» والجدول «الرابعة»، وتقرأ خانات حصة أخرى
         فيختلف عدد المدرّسين بينهما (رُصد 2026-09-05). */
      var cur = times[currentIdx], curNo = cur.n || null;
      var curSlot = curNo ? curNo - 1 : currentIdx;
      var busy = curNo ? busyAt(curSlot) : [], free = teachers.length - busy.length;
      kicker = curNo ? 'الآن · الحصة ' + (ORD[curNo-1] || curNo) : 'الآن · ' + (cur.label || 'فرصة');
      left = remain();
      ttl = busy.length ? Shouba.count(busy.length,{one:'معلّم',two:'معلّمان',few:'معلّمين',many:'معلّماً'}) + ' يدرّسون الآن'
                        : 'لا أحد يدرّس الآن';
      sub = busy.length ? busy.slice(0,2).map(function(t){ return 'أ. '+firstName(t)+' · '+slotOf(t,curSlot); }).join('   ')
                          + (busy.length>2 ? '  +'+(busy.length-2) : '') + (free ? '  ·  ' + Shouba.count(free,{one:'متفرّغ',two:'متفرّغان',few:'متفرّغون',many:'متفرّغاً'}) : '')
                        : (curNo ? 'كل معلّميك متفرّغون في هذه الحصة.' : 'وقت راحة — لا حصص الآن.');
    } else if(todayEvents.length){
      kicker='اليوم'; ttl=todayEvents[0].title; sub=todayEvents[0].type + ' · ' + todayName;
    } else if(!hasSchedules){
      kicker='ابدأ من هنا'; ttl='أدخِل جداول معلّميك'; sub='ابدأ بيومٍ واحد لكل معلّميك — تضيء لوحتك في دقائق، وأكمل بقيّة الأيام على مهلك.';
    } else if(isWeekend){
      kicker='التالي'; ttl='عطلة نهاية الأسبوع'; sub='يبدأ الدوام الأحد · أوّل حصة ' + times[0].from;
    } else if(nextIdx>-1){
      var nx = times[nextIdx];
      kicker='التالي';
      ttl = (nx.n ? 'الحصة ' + (ORD[nx.n-1] || nx.n) : (nx.label || 'فرصة')) + ' تبدأ ' + nx.from;
      sub='لم تبدأ الحصص بعد.';
    } else {
      kicker='انتهى اليوم'; ttl='انتهى دوام اليوم';
      var up = events.filter(function(e){ return R.days.indexOf(e.day) > dayIdx; })[0];
      sub = up ? 'التالي: ' + up.title + ' · ' + up.day : 'لا مواعيد متبقّية هذا الأسبوع.';
    }
    card.innerHTML = '<div class="top"><div class="kicker"><span class="pulse"></span>' + kicker + '</div>'
      + '<div class="left">' + left + '</div></div>'
      + '<div><div class="ttl">' + ttl + '</div><div class="sub">' + sub + '</div></div>'
      + '<div class="acts"><button class="cta" id="cardCta">الجدول الكامل</button>'
      + '<button class="ghost2" id="cardGhost">معلّموك</button></div>';
    document.getElementById('cardCta').addEventListener('click', function(){ location.href='/schedule.html'; });
    document.getElementById('cardGhost').addEventListener('click', function(){ location.href='/teachers.html'; });
  }
  paintCard();
  if(currentIdx>-1 && hasSchedules) setInterval(function(){ var l=card.querySelector('.left'); if(l) l.textContent=remain(); }, 1000);

  /* ===== ③ مصفوفة الأسبوع: عمود لكل يوم — وهي بابُ إدخال المواعيد =====
     ⚠ في العطلة تتقدّم المصفوفة إلى الأسبوع القادم كما يتقدّم عنوان الجدول،
       وإلّا عرضت اللوحةُ أحدَين مختلفين في شاشة واحدة (رُصد 2026-09-06). */
  var sunday=new Date(now);
  sunday.setDate(now.getDate() + (isWeekend ? (7 - dayIdx) : -dayIdx));
  var viewWeek = Shouba.weekNo(sunday);          // رقم الأسبوع المعروض لا أسبوع اليوم
  var weekEl=document.getElementById('week');
  var DAY_DATE={};

  function paintWeek(){
    weekEl.innerHTML='';
    R.days.forEach(function(day,i){
      var dt=new Date(sunday); dt.setDate(sunday.getDate()+i);
      DAY_DATE[day]=dt;
      var list=Shouba.eventsOfDay(day, viewWeek);
      var col=document.createElement('div');
      col.className='wcol' + (day===todayName && !isWeekend ? ' today' : '');
      var inner='<div class="wh">' + SHORT[i] + '<b>' + dt.getDate() + '</b></div>';
      if(list.length){
        list.forEach(function(e){ inner += '<div class="wi ' + (TYPE_CLASS[e.type]||'') + '">' + e.title + '</div>'; });
      } else inner += '<div class="wq">+</div>';
      col.innerHTML=inner;
      col.addEventListener('click', function(){ daySheet(day); });
      weekEl.appendChild(col);
    });
  }

  /* ===== مواعيد الأسبوع: الإدخال من الرزنامة نفسها (2026-09-06) =====
     الضغط على عمود اليوم يفتح مواعيده، والإضافة خطوتان في لوحة واحدة:
     النوع ثم العنوان. والحذف بضغطة على الموعد. */
  var EV_TYPES = ['اختبار','اجتماع','فعالية'];

  function dayLabel(day){
    var dt = DAY_DATE[day];
    return day + (dt ? ' · ' + dt.getDate() + '/' + (dt.getMonth()+1) : '');
  }

  function daySheet(day){
    var n = document.createElement('div');
    n.className = 'vlist'; n.style.padding = '0';

    var list = Shouba.eventsOfDay(day, viewWeek);
    if(!list.length){
      var e0 = document.createElement('div');
      e0.className = 'soon-note';
      e0.textContent = 'لا مواعيد في هذا اليوم بعد.';
      n.appendChild(e0);
    }
    list.forEach(function(ev){
      var r = document.createElement('div');
      r.className = 'evrow ' + (TYPE_CLASS[ev.type] || '');
      r.innerHTML = '<b>' + ev.title + '</b><span class="ty">' + ev.type + '</span>';
      var x = document.createElement('button');
      x.className = 'del'; x.setAttribute('aria-label','حذف'); x.textContent = '×';
      x.addEventListener('click', function(){
        Shouba.removeEvent(ev.id); paintWeek(); paintCard(); daySheet(day);
      });
      r.appendChild(x);
      n.appendChild(r);
    });

    var add = document.createElement('button');
    add.className = 'cta'; add.textContent = 'أضِف موعداً';
    add.addEventListener('click', function(){ addSheet(day); });
    n.appendChild(add);

    Shouba.sheet.open('مواعيد ' + dayLabel(day), n);
  }

  function addSheet(day){
    var n = document.createElement('div');
    var chosen = EV_TYPES[0];
    n.innerHTML = '<div class="field" style="padding-bottom:4px"><label>نوع الموعد</label>'
      + '<div class="segs" id="evsegs"></div></div>'
      + '<div class="field" style="padding-bottom:6px"><label for="evt">العنوان</label>'
      + '<div class="paper"><input id="evt" type="text" maxlength="60" placeholder="مثال: اختبار قصير — الفلسفة" /></div>'
      + '<div class="hint">يظهر في رزنامة ' + dayLabel(day) + '.</div></div>';
    var segs = n.querySelector('#evsegs');
    EV_TYPES.forEach(function(t, i){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'seg' + (i === 0 ? ' on' : ''); b.textContent = t;
      b.addEventListener('click', function(){
        chosen = t;
        [].forEach.call(segs.children, function(x){ x.classList.toggle('on', x === b); });
      });
      segs.appendChild(b);
    });
    var save = document.createElement('button');
    save.className = 'cta'; save.textContent = 'أضِف';
    n.appendChild(save);
    Shouba.sheet.open('موعد جديد · ' + dayLabel(day), n);
    var inp = n.querySelector('#evt');
    setTimeout(function(){ inp.focus(); }, 80);
    function submit(){
      var v = inp.value.trim();
      if(v.length < 2) return;
      Shouba.addEvent({ week: viewWeek, day: day, type: chosen, title: v });
      paintWeek(); paintCard(); daySheet(day);
    }
    save.addEventListener('click', submit);
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
  }

  /* «الرزنامة الكاملة ›» — كان رابطاً ميّتاً، فصار رزنامة الأسبوع كلّها */
  function weekSheet(){
    var n = document.createElement('div');
    n.className = 'vlist'; n.style.padding = '0';
    R.days.forEach(function(day){
      var list = Shouba.eventsOfDay(day, viewWeek);
      var b = document.createElement('button');
      b.className = 'titem';
      b.innerHTML = '<div class="tx"><b>' + dayLabel(day) + '</b><small>'
        + (list.length ? list.map(function(e){ return e.title; }).join(' · ') : 'لا مواعيد')
        + '</small></div><span class="chev">‹</span>';
      b.addEventListener('click', function(){ daySheet(day); });
      n.appendChild(b);
    });
    Shouba.sheet.open('رزنامة ' + (Shouba.weekLabel() || 'الأسبوع'), n);
  }
  document.getElementById('toWeek').addEventListener('click', weekSheet);
  paintWeek();

  /* ===== ④ إنجاز المنهج ===== */
  var subjectNames=Shouba.planSubjects();
  var slicesEl=document.getElementById('slices');
  if(!subjectNames.length){
    document.getElementById('planPct').textContent='';
    slicesEl.style.display='none';
    document.getElementById('planLine').textContent='رفع توزيع المنهج قيد الإعداد — يصل في تحديث قادم، ولا يلزمك شيء الآن.';
  } else {
    var pr=Shouba.planProgress(), total=pr.total, done=pr.done, cells=pr.cells;
    cells.slice(0,40).forEach(function(c){
      var i=document.createElement('i');
      if(c.done) i.className='done'; else if(c.now) i.className='now';
      slicesEl.appendChild(i);
    });
    document.getElementById('planPct').textContent = pr.pct + '%';
    document.getElementById('planLine').innerHTML =
      Shouba.count(done,{one:'درس',two:'درسان',few:'دروس',many:'درساً'}) + ' من <b>' + total + '</b> · ' + (Shouba.weekLabel() || '') + (weekNo ? ' جارٍ' : '');
  }

  /* ===== ⑤ بحاجة إلى إجراء ===== */
  var todoEl=document.getElementById('todo'), items=[];
  Shouba.withoutSchedule().forEach(function(t){ items.push({name:t,badge:'تذكير',text:'لم يُدخل جدوله بعد'}); });
  /* ⚠ حُذف بند «دروس سابقة لم تُؤشَّر» (2026-09-05): اتّهامٌ بلا دليل — لا باب تأشير
     أصلاً، فكان كلّ معلّم متأخّراً بحكم البناء. يعود يوم يصير للإنجاز مصدرٌ حقيقي
     (تأشير المعلّم بنفسه). والدالّة Shouba.behindPlan باقية في طبقة الاشتقاق تنتظره. */
  document.getElementById('todoCount').textContent = items.length ? items.length : 'لا شيء';
  if(!items.length){
    todoEl.closest('section').classList.add('calm');
    todoEl.innerHTML='<div class="invite">لا شيء ينتظر إجراءً الآن — شعبتك منضبطة.</div>';
  } else {
    items.slice(0,2).forEach(function(it){
      var el=document.createElement('div'); el.className='titem';
      el.innerHTML='<span class="ini">'+it.name.charAt(0)+'</span>'
        + '<div class="tx"><b>أ. '+it.name+'</b><small>'+it.text+'</small></div>'
        + '<span class="chip">'+it.badge+'</span>';
      todoEl.appendChild(el);
    });
    if(items.length>2) document.getElementById('todoMore').textContent =
      'و' + Shouba.count(items.length-2,{one:'طلب',two:'طلبان',few:'طلبات',many:'طلباً'}) + ' في الانتظار';
  }

  /* ===== التنقّل ===== */
  /* ⚠ `.tab[data-go]` لا `.tab` المطلقة: تبويب «قيد الإعداد» بلا وجهة، فكان ينتقل
     إلى undefined فيرتدّ المستخدم إلى شاشة الدخول (رُصد بالفحص 2026-09-05). */
  [].forEach.call(document.querySelectorAll('.tab[data-go]'), function(b){
    b.addEventListener('click', function(){ if(!b.classList.contains('on')) location.href=b.dataset.go; });
  });
  document.getElementById('toSchedule').addEventListener('click', function(){ location.href='/schedule.html'; });
  document.getElementById('settings').addEventListener('click', function(){ Shouba.settings(); });
</script>
</body>
