<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<!-- الصفحة تخدم على /face/<الرمز>: الاصول من جذر المنصة لا من /face/ -->
<base href="../" />
<title>واجهة الشعبة</title>
<meta name="theme-color" content="#C8862A" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="identity/tokens.css?v=94" />
<link rel="stylesheet" href="shell.css?v=94" />
<link rel="stylesheet" href="components.css?v=94" />
<link rel="stylesheet" href="frame.css?v=94" />
<link rel="stylesheet" href="face.css?v=94" />
<!-- ===========================================================================
     واجهة الشعبة — صفحة الزائر (2026-10-20، نطاق اعتمده المستخدم)
     للعرض وحده بلا حساب: المدير والموجه الفني والمدراء المساعدون برابط.
     ثلاثة تبويبات: الشعبة (خانة الاسبوع · الحصة الجارية · من يعمل الآن · الحصيلة) · الجدول · الفعاليات (قادمة · تمّت).
     لا خطة ولا علامات ولا تعليق. والجدول الحي يحسب بساعة الزائر (face.js: المنشور بيانات لا صورة).
     ⚠ بلا components.js: لا عامل خدمة ولا جلسة ولا مزامنة — صفحة تقرأ نسخة منشورة فحسب. واللوحة السفلية هنا.
     ⚠ وعامل الخدمة يتركها (sw.js) فلا تقدم من مخزن جهاز نسخة قديمة.
     =========================================================================== -->
</head>
<body class="framed face-pub">
 <div class="device"><div class="viewport">

  <div class="topbar">
    <div class="tbcrest" id="crest"></div>
    <div class="tt"><b id="dept">واجهة الشعبة</b><span id="sub"></span></div>
  </div>

  <div class="screen has-topbar has-tabbar">

    <!-- ① الشعبة -->
    <div class="pane board" id="p1">
      <div class="card-navy" id="weekCard" hidden>
        <div class="top"><span class="kicker"><i class="pulse"></i><span id="wkKind"></span></span></div>
        <div class="ttl" id="wkTtl"></div>
        <div class="sub" id="wkSub" hidden></div>
      </div>

      <div class="card-soft" id="nowCard">
        <div class="top"><span class="kicker" id="nowKick"></span><span class="left" id="nowLeft"></span></div>
        <div class="ttl" id="nowLine" hidden></div>
      </div>

      <section id="nowSec" hidden>
        <div class="sect"><span class="h">من يعمل الآن</span></div>
        <div class="tbl" id="nowList"></div>
      </section>

      <section id="statSec" hidden>
        <div class="sect"><span class="h">حصيلة الشعبة هذا العام</span></div>
        <div class="nums" id="stats"></div>
      </section>
    </div>

    <!-- ② الجدول -->
    <div class="pane board" id="p2">
      <div class="days" id="days"></div>
      <div class="tbl" id="dayGrid"></div>
      <div class="fnote">لمسة على اسم المعلم تعرض جدول أسبوعه.</div>
    </div>

    <!-- ③ الفعاليات -->
    <div class="pane board" id="p3">
      <section id="soonSec" hidden>
        <div class="sect"><span class="h">قادمة</span></div>
        <div class="tbl" id="soonList"></div>
      </section>
      <section id="doneSec" hidden>
        <div class="sect"><span class="h">تمّت</span></div>
        <div class="tbl" id="doneList"></div>
      </section>
      <div class="tbl" id="noEv" hidden><div class="empty">لا فعاليات منشورة بعد.</div></div>
    </div>

    <div class="gone" id="gone" hidden>
      <img src="identity/assets/logo-vec-color.svg" alt="شعبة" />
      <b>لا واجهة على هذا الرابط</b>
      <span>لم تنشر بعد، أو سحب صاحبها نشرها.</span>
    </div>
  </div>

  <div class="tabbar" id="tabs" hidden>
    <button type="button" class="tab on" data-pane="p1">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 8.4 10 3l7 5.4V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>الشعبة</button>
    <button type="button" class="tab" data-pane="p2">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="3.5" y="4.5" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 8.5h13M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>الجدول</button>
    <button type="button" class="tab" data-pane="p3">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4 6.5h12M4 10h12M4 13.5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="16" cy="13.5" r="1.4" fill="currentColor"/></svg>الفعاليات</button>
  </div>

  <div class="sheet-backdrop" id="bd"></div>
  <div class="sheet" id="sh">
    <div class="grab"></div>
    <div class="sheet-title" id="shTitle"></div>
    <div class="sheet-list" id="shBody"></div>
    <div class="sheet-foot"><button type="button" class="sh-done" id="shDone">تم</button></div>
  </div>

 </div></div>

<script src="icons.js?v=94"></script>
<script src="face-data.js?v=94"></script>
<script>
(function () {
  var F = window.ShoubaFace, SNAP = null, FILES = 'api/pub/file/', curDay = null;
  var ORD = ['', 'الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة', 'الثامنة', 'التاسعة'];
  var WORDS = ['', '', '', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة'];

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function num(n) { return '<span dir="ltr" class="num">' + esc(n) + '</span>'; }
  function today() { return F.iso(new Date()); }
  function dateHtml(iso) {
    var p = F.dateParts(iso);
    return p ? esc(p.wd) + ' ' + num(p.day) + ' ' + esc(p.month) : '';
  }
  function title(name) { return 'أ. ' + name; }

  /* ── اللوحة السفلية (بلا components.js) ── */
  function openSheet(t, html) {
    $('shTitle').textContent = t; $('shBody').innerHTML = html;
    $('bd').classList.add('open'); void $('sh').offsetWidth; $('sh').classList.add('open');
  }
  function closeSheet() { $('sh').classList.remove('open'); $('bd').classList.remove('open'); }
  $('bd').addEventListener('click', closeSheet);
  $('shDone').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  /* ── الرأس ── */
  function paintHead() {
    var s = SNAP;
    $('dept').textContent = s.dept || 'واجهة الشعبة';
    $('sub').textContent = [s.school, s.head ? 'رئيس الشعبة: ' + title(s.head) : ''].filter(Boolean).join(' · ');
    document.title = (s.dept || 'واجهة الشعبة') + (s.school ? ' · ' + s.school : '');
    var c = s.crest || {}, el = $('crest');
    if (c.img && /^data:image\//.test(c.img)) { var im = new Image(); im.alt = 'شعار المدرسة'; im.src = c.img; el.appendChild(im); }
    else if (c.icon && window.SHOUBA_ICONS) el.innerHTML = SHOUBA_ICONS.svg(c.icon, 22);
    else el.innerHTML = '<img src="identity/assets/logo-vec-dark.svg" alt="شعبة" style="object-fit:contain;padding:6px" />';
  }

  /* ── ① الشعبة ── */
  function paintWeek() {
    var w = F.visible(SNAP, today()).week, card = $('weekCard');
    card.hidden = !w;
    if (!w) return;
    $('wkKind').textContent = F.kindLabel(w.kind);
    if (w.kind === 'teacher') {
      $('wkTtl').textContent = title(w.who);
      $('wkSub').textContent = w.text || ''; $('wkSub').hidden = !w.text;
    } else { $('wkTtl').textContent = w.text; $('wkSub').hidden = true; }
  }
  function busyNow(st) {
    if (st.state !== 'period') return [];
    return (SNAP.people || []).filter(function (p) { return ((p.wk || {})[st.day] || [])[st.n - 1]; });
  }
  function countLine(n) {
    if (!n) return 'لا أحد من معلمي الشعبة في فصله الآن';
    if (n === 1) return 'معلم واحد من الشعبة في فصله الآن';
    if (n === 2) return 'معلمان من معلمي الشعبة في فصولهما الآن';
    return (WORDS[n] ? esc(WORDS[n]) : num(n)) + ' من معلمي الشعبة في فصولهم الآن';
  }
  function paintNow() {
    var st = F.now(SNAP.times, SNAP.days, new Date()), kick = '', left = '', line = '', busy = busyNow(st);
    if (st.state === 'period') {
      kick = '<i class="pulse"></i> الحصة ' + esc(ORD[st.n] || st.n) + ' جارية';
      left = 'بقي ' + num(st.left) + ' د';
      line = countLine(busy.length);
    } else if (st.state === 'break') {
      kick = esc(st.label || 'الفرصة'); left = 'بقي ' + num(st.left) + ' د';
      if (st.next) line = 'تليها الحصة ' + esc(ORD[st.next] || st.next);
    } else if (st.state === 'gap') {
      kick = 'بين حصتين'; if (st.next) line = 'تليها الحصة ' + esc(ORD[st.next] || st.next);
    } else if (st.state === 'before') {
      kick = 'قبل بدء الدوام'; if (st.from) line = 'يبدأ الدوام ' + num(st.from);
    } else if (st.state === 'after') kick = 'انتهى دوام اليوم';
    else kick = 'لا دوام اليوم';
    $('nowKick').innerHTML = kick; $('nowLeft').innerHTML = left;
    $('nowLine').innerHTML = line; $('nowLine').hidden = !line;
    $('nowSec').hidden = !busy.length;
    if (busy.length) {
      $('nowList').innerHTML = '<div class="tr hd"><span class="c3">المعلم والمادة</span><span class="c4">الفصل</span></div>'
        + busy.map(function (p) {
          var s = F.slot(p.wk[st.day][st.n - 1]);
          return '<div class="tr now"><span class="c3">' + esc(title(p.name)) + (s.subject ? ' · ' + esc(s.subject) : '') + '</span>'
            + '<span class="c4" dir="ltr">' + esc(s.cls) + '</span></div>';
        }).join('');
    }
  }
  function paintStats() {
    var m = +((SNAP.stats || {}).meetings) || 0, e = F.visible(SNAP, today()).done.length, out = '';
    function unit(n, f) { return n === 1 ? f[0] : n === 2 ? f[1] : (n >= 3 && n <= 10) ? f[2] : f[3]; }
    if (m) out += '<div class="n"><b dir="ltr">' + m + '</b><span>' + unit(m, ['اجتماع عقد', 'اجتماعان عقدا', 'اجتماعات عقدت', 'اجتماعا عقد']) + '</span></div>';
    if (e) out += '<div class="n"><b dir="ltr">' + e + '</b><span>' + unit(e, ['فعالية أقيمت', 'فعاليتان أقيمتا', 'فعاليات أقيمت', 'فعالية أقيمت']) + '</span></div>';
    $('stats').innerHTML = out; $('statSec').hidden = !out;
  }

  /* ── ② الجدول: يوم يختاره الزائر، واليوم الجاري افتراضا ── */
  function periods() { return (SNAP.times || []).filter(function (t) { return !t.brk; }); }
  function paintDays() {
    $('days').innerHTML = (SNAP.days || []).map(function (d) {
      return '<button type="button" class="day' + (d === curDay ? ' on' : '') + '" data-d="' + esc(d) + '">' + esc(d) + '</button>';
    }).join('');
  }
  function paintDay() {
    var st = F.now(SNAP.times, SNAP.days, new Date()), out = '';
    periods().forEach(function (t, i) {
      var lines = '';
      (SNAP.people || []).forEach(function (p, k) {
        var v = ((p.wk || {})[curDay] || [])[i];
        if (!v) return;
        var s = F.slot(v);
        lines += '<button type="button" class="tline" data-k="' + k + '"><b>' + esc(title(p.name)) + '</b>'
          + (s.subject ? '<small>' + esc(s.subject) + '</small>' : '') + (s.cls ? '<span class="cl" dir="ltr">' + esc(s.cls) + '</span>' : '') + '</button>';
      });
      var now = st.state === 'period' && st.day === curDay && st.n === t.n;
      out += '<div class="prow' + (now ? ' now' : '') + '"><div class="pn"><b dir="ltr">' + esc(t.n) + '</b><span>الحصة</span></div>'
        + '<div class="pl">' + (lines || '<span class="none">لا حصص للشعبة</span>') + '</div></div>';
    });
    $('dayGrid').innerHTML = out;
  }
  $('days').addEventListener('click', function (e) {
    var b = e.target.closest('.day'); if (!b) return;
    curDay = b.getAttribute('data-d'); paintDays(); paintDay();
  });
  $('dayGrid').addEventListener('click', function (e) {
    var b = e.target.closest('.tline'); if (!b) return;
    var p = SNAP.people[+b.getAttribute('data-k')], ps = periods();
    if (!p) return;
    var g = '<div class="wk" style="--np:' + ps.length + '"><div class="h"></div>';
    ps.forEach(function (t) { g += '<div class="h" dir="ltr">' + esc(t.n) + '</div>'; });
    (SNAP.days || []).forEach(function (d) {
      g += '<div class="d">' + esc(d) + '</div>';
      ps.forEach(function (t, i) {
        var s = F.slot(((p.wk || {})[d] || [])[i]);
        g += s.cls ? '<div class="c" dir="ltr">' + esc(s.cls) + '</div>' : '<div class="f">·</div>';
      });
    });
    openSheet(title(p.name) + (p.subj ? ' · ' + p.subj : ''), g + '</div>');
  });

  /* ── ③ الفعاليات: قادمة بالاقرب · تمّت بالاحدث — والتي مضى يومها بلا تأكيد لا تظهر ── */
  var EV = [];
  function evRow(e) {
    var k = EV.push(e) - 1, more = !!(e.about || (e.photos || []).length), ph = (e.photos || [])[0];
    return '<' + (more ? 'button type="button"' : 'div') + ' class="ev" data-e="' + k + '">'
      + (ph ? '<img class="th" loading="lazy" alt="" src="' + FILES + encodeURIComponent(ph) + '" />' : '')
      + '<div class="tx"><b>' + esc(e.title) + '</b><div class="mt"><em>' + dateHtml(e.date) + '</em>'
      + ((e.who || []).length ? '<span>' + esc(e.who.join('، ')) + '</span>' : '') + '</div></div>'
      + '</' + (more ? 'button' : 'div') + '>';
  }
  function paintEvents() {
    var v = F.visible(SNAP, today());
    EV = [];
    $('soonList').innerHTML = v.soon.map(evRow).join(''); $('soonSec').hidden = !v.soon.length;
    $('doneList').innerHTML = v.done.map(evRow).join(''); $('doneSec').hidden = !v.done.length;
    $('noEv').hidden = !!(v.soon.length || v.done.length);
  }
  $('p3').addEventListener('click', function (e) {
    var b = e.target.closest('button.ev'); if (!b) return;
    var ev = EV[+b.getAttribute('data-e')]; if (!ev) return;
    var h = '<div class="evd"><div class="mt"><em>' + dateHtml(ev.date) + '</em>'
      + ((ev.who || []).length ? ' · ' + esc(ev.who.join('، ')) : '') + '</div>'
      + (ev.about ? '<p>' + esc(ev.about) + '</p>' : '')
      + ((ev.photos || []).length ? '<div class="shots">' + ev.photos.map(function (id) {
          return '<img loading="lazy" alt="" src="' + FILES + encodeURIComponent(id) + '" />';
        }).join('') + '</div>' : '') + '</div>';
    openSheet(ev.title, h);
  });

  /* ── التنقل ── */
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (!b) return;
    [].forEach.call(document.querySelectorAll('.tab'), function (t) { t.classList.toggle('on', t === b); });
    [].forEach.call(document.querySelectorAll('.pane'), function (p) { p.classList.toggle('on', p.id === b.getAttribute('data-pane')); });
    document.querySelector('.screen').scrollTop = 0; window.scrollTo(0, 0);
  });

  function paintAll() {
    paintWeek(); paintNow(); paintStats(); paintDay(); paintEvents();
  }
  function start(snap) {
    SNAP = snap || {};
    var g = new Date().getDay();
    curDay = (SNAP.days || [])[g <= 4 ? g : 0] || (SNAP.days || [])[0];
    paintHead(); paintDays(); paintAll();
    $('p1').classList.add('on'); $('tabs').hidden = false;
    /* الحصة الجارية تتبدل وهو ينظر — والخانة والفعاليات بتبدل اليوم */
    setInterval(function () { paintNow(); paintDay(); }, 30000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) paintAll(); });
  }
  function gone() { $('gone').hidden = false; }

  /* المعاينة من شاشة الادارة: النسخة من الصفحة الام قبل نشرها، وصورها من خزانة صاحبها بجلسته */
  var prev = /[?&]preview\b/.test(location.search) && window.parent !== window;
  if (prev) {
    var snap = null;
    try { snap = window.parent.FACE_PREVIEW; } catch (e) {}
    FILES = 'api/files/';
    if (snap) start(JSON.parse(JSON.stringify(snap))); else gone();
    return;
  }
  var m = location.pathname.match(/\/face\/([0-9a-f]{10})\/?$/);
  if (!m) { gone(); return; }
  fetch('api/face/' + m[1], { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { if (j && j.data) start(j.data); else gone(); })
    .catch(gone);
})();
</script>
</body>
</html>
