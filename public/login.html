<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · تسجيل الدخول</title>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#16456E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="/identity/assets/app-icon-approved.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/identity/tokens.css" />
<link rel="stylesheet" href="/shell.css" />
<link rel="stylesheet" href="/components.css" />
<link rel="stylesheet" href="/frame.css" />
<style>
  /* أنماط خاصّة بشاشة الدخول فقط — الهيكل من shell.css -->*/
  .brand{display:flex;flex-direction:column;align-items:center;gap:13px;padding:0 30px}
  .lockup{display:flex;align-items:center;gap:16px}
  .lockup .mark{width:132px;height:auto;flex:none}
  .lockup .divider{width:2px;height:56px;border-radius:2px;background:rgba(120,98,66,.35);flex:none}
  .lockup .word{width:150px;height:auto;position:relative;top:-6px}
  .brand .sub{font-size:13px;color:var(--shouba-label);text-align:center;line-height:1.7}

  .body{padding:30px 26px 0;display:flex;flex-direction:column;gap:16px}
  .title{font-size:22px;font-weight:700}
  .lead{font-size:14px;color:var(--shouba-text-muted);line-height:1.8}
  .card{background:linear-gradient(180deg,var(--shouba-paper) 0%,#F4EDE0 100%);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:12px;
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 -1.5px 0 rgba(154,130,94,.18), 0 3px 0 rgba(190,172,140,.5), 0 8px 16px rgba(120,98,66,.2)}
  .card .row{display:flex;align-items:center;gap:12px;background:var(--shouba-canvas);border-radius:var(--r-input);padding:13px 15px;box-shadow:var(--shadow-inset)}
  .card .row .ic{width:36px;height:36px;border-radius:11px;background:rgba(22,69,110,.09);display:grid;place-items:center;flex:none}
  .card .row .tx{display:flex;flex-direction:column;gap:2px}
  .card .row .tx b{font-size:14px;font-weight:700}
  .card .row .tx small{font-size:11.5px;color:var(--shouba-hint)}

  /* زرّ جوجل يرث .cta (ومعه صدى الهوية) — هنا تخطيطه الداخلي فقط */
  .gbtn{display:flex;align-items:center;justify-content:center;gap:11px}
  .gbtn .gchip{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.15);position:relative;z-index:1}
  .gchip svg{width:15px;height:15px}
  .links{display:flex;align-items:center;justify-content:center;gap:16px}
  .links a{font-size:12.5px;font-weight:600;color:var(--shouba-label);text-decoration:none;cursor:pointer}
  .links .sep{width:1px;height:14px;background:rgba(120,98,66,.3)}

  .hide{display:none !important}
</style>
</head>
<body class="framed">
 <div class="device"><div class="viewport">
  <div class="screen">
    <!-- الوحدة كاملة (شعار + محتوى) تتوسّط رأسياً ككتلة واحدة -->
    <div class="content center">
    <div class="brand">
      <div class="lockup">
        <img class="mark" src="/identity/assets/logo-vec-color.svg" alt="شعبة" />
        <span class="divider"></span>
        <img class="word" src="/identity/assets/lockup-word-mansa-color.svg" alt="منصّة شعبة" />
      </div>
      <div class="sub">إدارة شُعب المدارس · وزارة التربية</div>
    </div>

    <!-- المتن: خطوتان -->
    <div class="body">
      <!-- خطوة ١: الدخول -->
      <div id="stepLogin">
        <div class="title">تسجيل الدخول</div>
        <div class="card" style="margin-top:16px">
          <div class="lead">ادخل بحساب جوجل للبدء. سيُربط لاحقاً بحسابك في نظام الوزارة.</div>
          <div class="row">
            <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2.6" stroke="#16456E" stroke-width="1.8"/><path d="M8.5 10 V7.5 C8.5 5.6 10 4 12 4 C14 4 15.5 5.6 15.5 7.5 V10" stroke="#16456E" stroke-width="1.8" stroke-linecap="round"/></svg></span>
            <div class="tx"><b>دخول آمن</b><small>بياناتك محمية، ولا نصل إلى كلمة مرورك</small></div>
          </div>
        </div>
      </div>

      <!-- خطوة ٢: أكمل اسمك -->
      <div id="stepName" class="hide">
        <div class="title">أكمل بياناتك</div>
        <div class="lead" style="margin:8px 0 20px">اكتب اسمك الرباعي كما يظهر في النماذج الرسمية — يظهر في ترويسة سجلاتك.</div>
        <div class="field">
          <label for="uname">الاسم الكامل</label>
          <div class="paper"><input id="uname" type="text" placeholder="مثال: محمد عبدالله سالم البراك" maxlength="60" autocomplete="name" /></div>
        </div>
      </div>
    </div>

    <!-- أزرار الإجراء: تتبدّل مع الخطوة (تتدفّق أسفل البطاقة مباشرة) -->
    <div class="actions">
      <div id="footLogin">
        <button class="cta gbtn" id="google">
          <span class="gchip"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c11 0 20-8 20-21 0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16 4 9.1 8.6 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 34.9 26.7 36 24 36c-5.3 0-9.7-2.6-11.3-6.8l-6.5 5C9.1 39.4 16 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C40.9 36.9 44 31.3 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg></span>
          المتابعة بحساب جوجل
        </button>
        <div class="links" style="margin-top:18px">
          <a id="ministry">الدخول بحساب الوزارة</a>
          <span class="sep"></span>
          <a>المساعدة</a>
        </div>
      </div>

      <div id="footName" class="hide">
        <button class="cta" id="continue" disabled>متابعة</button>
        <div class="links" style="margin-top:18px"><a id="backLogin">الدخول بحساب آخر</a></div>
      </div>
    </div>
    </div><!-- /content -->
  </div>
 </div></div>

<script>
  var KEY = 'shouba.user';
  var stepLogin = document.getElementById('stepLogin');
  var stepName  = document.getElementById('stepName');
  var footLogin = document.getElementById('footLogin');
  var footName  = document.getElementById('footName');
  var uname     = document.getElementById('uname');
  var cont      = document.getElementById('continue');

  // لو سبق الدخول، عبّئ الاسم
  try{ var u = JSON.parse(localStorage.getItem(KEY)||'{}'); if(u.name) uname.value = u.name; }catch(e){}

  function toName(){
    stepLogin.classList.add('hide'); footLogin.classList.add('hide');
    stepName.classList.remove('hide'); footName.classList.remove('hide');
    setTimeout(function(){ uname.focus(); }, 60);
    validate();
  }
  function toLogin(){
    stepName.classList.add('hide'); footName.classList.add('hide');
    stepLogin.classList.remove('hide'); footLogin.classList.remove('hide');
  }
  function validate(){ cont.disabled = uname.value.trim().length < 3; }

  document.getElementById('google').addEventListener('click', toName);
  document.getElementById('backLogin').addEventListener('click', toLogin);
  document.getElementById('ministry').addEventListener('click', function(){
    // ربط الوزارة (مايكروسوفت) مؤجّل — انتقل لنفس مسار الاسم مؤقتاً
    toName();
  });
  uname.addEventListener('input', validate);
  cont.addEventListener('click', function(){
    if(cont.disabled) return;
    localStorage.setItem(KEY, JSON.stringify({ name: uname.value.trim(), method: 'google' }));
    location.href = '/setup-wizard.html';
  });
</script>
</body>
</html>
