<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · عناصر النموذج</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1B5183" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="identity/assets/app-icon-approved.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="identity/tokens.css?v=86" />
<link rel="stylesheet" href="shell.css?v=86" />
<link rel="stylesheet" href="components.css?v=86" />
<link rel="stylesheet" href="frame.css?v=86" />
<style>
  /* عناصر النموذج (2026-09-12، قرار المستخدم) — رئيس الشعبة يختار من عناصر شبكة المتابعة ما يتابعه:
     «الاغلب لا يملأ النموذج كله». ⚠ غير مؤشرة ابتداء وهو يؤشر (قراره صراحة) — خلاف قائمة السجلات
     المؤشرة كلها في ش⑥، لان الاختيار هنا تضييق مقصود لا حزمة جاهزة.
     للشعبة كلها، ويسري على السجلات الجديدة (السجل يحفظ لقطة اختياره يوم انشائه). لا هيكل هنا */
  .items{display:flex;flex-direction:column;gap:22px;padding-top:16px}
  .lead{padding:0 var(--gap-side);font-size:13px;font-weight:600;color:var(--shouba-label);line-height:1.8}
  .grp{display:flex;flex-direction:column;gap:9px}
  .grp .stack{padding:0 var(--gap-side)}
  /* عناصر جدول التقييم (تقرير الزيارة 2026-09-14): المضاف بزر حذف، ونموذج الاضافة تحته */
  .del{width:32px;height:32px;border-radius:11px;flex:none;border:0;cursor:pointer;display:grid;place-items:center;
    background:linear-gradient(180deg,#FBF7EE 0%,#F3ECDE 100%);box-shadow:0 2px 0 rgba(190,172,140,.5)}
  .del:active{transform:translateY(1px)}
  .addf{display:flex;flex-direction:column;gap:12px;padding:0 var(--gap-side)}
  .hint.warn{color:var(--shouba-error)}
</style>
</head>
<body class="framed">
 <div class="device"><div class="viewport">
  <div class="topbar">
    <div class="tbcrest" id="tbCrest"></div>
    <div class="tt">
      <b id="ttl">عناصر النموذج</b>
      <span id="sub">—</span>
    </div>
    <div class="iconbtn" data-home title="اللوحة"></div>
  </div>

  <div class="screen has-topbar has-foot">
    <div class="content">
      <div class="items" id="items"></div>
    </div>
  </div>

  <div class="foot">
    <button class="cta" id="ok" disabled>اختر عنصرا واحدا على الأقل</button>
  </div>
 </div></div>

<script src="build.js?v=86"></script>
<script src="refdata.js?v=86"></script>
<script src="rec-templates.js?v=86"></script>
<script src="rec-engine.js?v=86"></script>
<script src="derive.js?v=86"></script>
<script src="icons.js?v=86"></script>
<script src="components.js?v=86"></script>
<script>
  var S = Shouba, d = S.data(), Q = new URLSearchParams(location.search), t = ShoubaRec.latest(Q.get('tpl') || '');

  (function paintTopCrest(){
    var el = document.getElementById('tbCrest'), c = d.crest;
    if (c && c.type === 'image') el.innerHTML = '<img src="' + c.data + '" alt="شعار المدرسة" />';
    else if (c && c.type === 'icon' && window.SHOUBA_ICONS) el.innerHTML = SHOUBA_ICONS.svg(c.id, 22);
    else el.innerHTML = '<img src="identity/assets/logo-vec-dark.svg" alt="شعبة" style="object-fit:contain;padding:5px" />';
  })();

  var CHK = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.4 L4.6 9 L10 3" stroke="#F4F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var tb = t && t.blocks.filter(function(b){ return b.type === 'table' && b.choose; })[0];
  var rb = t && t.blocks.filter(function(b){ return b.type === 'rating' && b.choose; })[0];
  var DEL = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M5 5 L15 15 M15 5 L5 15" stroke="#8A7F6E" stroke-width="2" stroke-linecap="round"/></svg>';

  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function groupLabel(id){ var g = (tb.groups || []).filter(function(x){ return x.id === id; })[0]; return g ? g.label : ''; }

  /* «تم»: الاختيار محفوظ مع كل لمسة، فالى الارشيف — رجوعا في التاريخ ان جاء منه (فلا يتكرر فيه)، وبدل هذه الصفحة في
     اول فتح (حوله الارشيف اليها &first=1)، ومعه معلمه ان جاء من ارشيف معلم (?who=) — قاعدة العودة 2026-09-14 */
  var WHO = Q.get('who') || '', ARC = 'archive.html?tpl=' + encodeURIComponent(t ? t.id : '') + (WHO ? '&who=' + encodeURIComponent(WHO) : '');
  function done(){
    if (Q.get('first')) location.replace(ARC);
    else if (/\/archive\.html/.test(document.referrer) && history.length > 1) history.back();
    else location.href = ARC;
  }

  if (rb) startRating();
  else if (!tb) location.replace('records.html');
  else start();

  /* ── عناصر جدول التقييم (rating.choose — تقرير زيارة رئيس الشعبة، 2026-09-14، طلب المستخدم: «تمكين المستخدم من
     التحكم بعناصر التقييم كالاضافة او الحذف»): الرسمية مؤشرة كلها ابتداء (نموذج التوجيه — خلاف الشبكتين) ولمسة تخرج
     عنصرا؛ ويضيف عناصر له باسمها وعباراتها (وبلا عبارات ملاحظة وحدها)، وحذف المضاف بتراجع. العبارات الرسمية لا تعدل
     (صياغة التوجيه). يحفظ مع كل لمسة { on, extra } لشعبته كلها ويسري على التقارير الجديدة — وكل تقرير يحفظ عناصره */
  function startRating(){
    var all = rb.items, cur = (S.pickOf(t.id) || {})[rb.id];
    var on = cur && Array.isArray(cur.on) ? cur.on.slice() : all.map(function(it){ return it.id; });
    var extra = cur && Array.isArray(cur.extra) ? cur.extra.slice() : [];
    var itemsEl = document.getElementById('items'), ok = document.getElementById('ok'), rows = {};
    document.getElementById('ttl').textContent = 'عناصر ' + (t.ready || t.title);
    document.title = 'شعبة · عناصر ' + (t.ready || t.title);
    itemsEl.appendChild(el('div', 'lead', 'عناصر التقويم في تقاريرك — المس عنصرا لتخرجه منها، وأضف ما تتابعه غيرها. يسري على تقاريرك الجديدة، وما كتب منها يبقى كما كتب.'));
    function isOn(id){ return on.indexOf(id) > -1; }
    /* الرسمية كلها ولا مضاف = الافتراض، فلا يحفظ شيء */
    function persist(){
      var map = {};
      map[rb.id] = { on: all.map(function(it){ return it.id; }).filter(isOn), extra: extra };
      S.setPick(t.id, on.length === all.length && !extra.length ? null : map);
    }
    function refresh(){
      Object.keys(rows).forEach(function(id){ rows[id].classList.toggle('on', isOn(id)); rows[id].setAttribute('aria-checked', isOn(id) ? 'true' : 'false'); });
      var n = on.length + extra.length;
      document.getElementById('sub').textContent = 'اخترت ' + on.length + ' من ' + all.length + (extra.length ? ' · أضفت ' + extra.length : '');
      ok.disabled = !n;
      ok.textContent = n ? 'تم' : 'اختر عنصرا واحدا على الأقل';
    }
    function pickRow(label, sub){
      var r = el('div', 'pick');
      r.innerHTML = '<span class="mark">' + CHK + '</span><div class="tx"><b></b><small></small></div>';
      r.querySelector('b').textContent = label; r.querySelector('small').textContent = sub;
      return r;
    }

    /* الرسمية: لمسة تخرج العنصر او تعيده */
    var sec = el('section', 'grp'), head = el('div', 'sect'), list = el('div', 'stack');
    head.appendChild(el('div', 'h', 'عناصر النموذج الرسمية'));
    all.forEach(function(it){
      var r = pickRow(it.label, (it.opts || []).join(' · '));
      r.setAttribute('role', 'checkbox'); r.tabIndex = 0;
      function tap(){ var i = on.indexOf(it.id); if (i > -1) on.splice(i, 1); else on.push(it.id); refresh(); persist(); }
      r.addEventListener('click', tap);
      r.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } });
      rows[it.id] = r;
      list.appendChild(r);
    });
    sec.appendChild(head); sec.appendChild(list);
    itemsEl.appendChild(sec);

    /* المضافة: بزر حذف (بتراجع)، ونموذج الاضافة تحتها */
    var xs = el('section', 'grp'), xh = el('div', 'sect'), xl = el('div', 'stack');
    xh.appendChild(el('div', 'h', 'عناصر أضفتها'));
    function paintX(){
      xl.textContent = '';
      if (!extra.length) xl.appendChild(el('div', 'hint', 'لا عناصر مضافة بعد — أضف أولها أدناه.'));
      extra.forEach(function(x, i){
        var r = pickRow(x.label, (x.opts || []).length ? x.opts.join(' · ') : 'ملاحظة بلا عبارات'), del = el('button', 'del');
        r.classList.add('on');
        del.type = 'button'; del.innerHTML = DEL; del.setAttribute('aria-label', 'احذف ' + x.label);
        del.addEventListener('click', function(e){
          e.stopPropagation();                        /* الحذف لا يفتح التعديل */
          if (editing === i) resetForm(); else if (editing > i) editing--;
          var gone = extra.splice(i, 1)[0];
          paintX(); refresh(); persist();
          S.toast('حذف «' + gone.label + '»', function(){ extra.splice(Math.min(i, extra.length), 0, gone); paintX(); refresh(); persist(); });
        });
        r.appendChild(del);
        /* لمسه يفتحه في النموذج ادناه لتعديل اسمه وعباراته (2026-09-14، طلب المستخدم) */
        r.setAttribute('role', 'button'); r.tabIndex = 0;
        r.addEventListener('click', function(){ edit(i); });
        r.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); edit(i); } });
        xl.appendChild(r);
      });
    }
    function field(label, req, ph){
      var f = el('div', 'field'), lb = el('label', null, label), p = el('div', 'paper'), i = el('input');
      lb.appendChild(el('span', 'need ' + (req ? 'req' : 'opt'), req ? 'مطلوب' : 'اختياري'));
      i.type = 'text'; i.placeholder = ph; i.maxLength = 160; i.setAttribute('aria-label', label);
      p.appendChild(i); f.appendChild(lb); f.appendChild(p);
      return { box: f, input: i };
    }
    /* العبارات عبارة عبارة كرقاقات (2026-09-14، رصد المستخدم: كتب عدة عبارات في الخانة الواحدة فصارت اختيارا واحدا —
       كانت تفصل بالفاصلة وحدها). تكتب العبارة ثم «+» او Enter فتصير رقاقة ويبقى الحقل مفتوحا للتالية، وما يلصق مفصولا
       بـ«/» او «،» او «,» او سطر جديد يتفرق. وحذف الرقاقة بلمسة. والعنصر المضاف يعدل بلمسه (editing) */
    var editing = -1, phr = [];
    var af = el('div', 'addf'), f1 = field('اسم العنصر', true, 'مثل: توظيف التعلم الإلكتروني'), f2 = field('عباراته', false, 'اكتب عبارة ثم «+»');
    var msg = el('div', 'hint', 'عبارة بعد عبارة — كل واحدة اختيار في التقرير. وبلا عبارات يكون العنصر ملاحظة وحدها.'), HINT = msg.textContent;
    var chipsEl = el('div', 'att'), pRow = el('div', 'rb-row'), pAdd = el('button', 'rb-btn add', '+');
    var addB = el('button', 'btn-ghost rb-add', '+ أضف العنصر'), cancel = el('button', 'btn-ghost', 'إلغاء التعديل');
    var paper = f2.box.querySelector('.paper');
    f2.box.removeChild(paper); pRow.appendChild(paper); pRow.appendChild(pAdd);
    f2.box.appendChild(pRow); f2.box.appendChild(chipsEl); f2.box.appendChild(msg);
    pAdd.type = addB.type = cancel.type = 'button'; pAdd.setAttribute('aria-label', 'أضف العبارة');
    cancel.hidden = true;
    function splitPh(s){ return String(s || '').split(/[\/،,\n]+/).map(function(x){ return x.trim(); }).filter(Boolean); }
    function paintPhr(){
      chipsEl.textContent = '';
      phr.forEach(function(x, i){
        var c = el('button', 'att-c guest', x), s = el('span', 'x');
        c.type = 'button'; c.setAttribute('aria-label', 'احذف ' + x);
        s.innerHTML = DEL; c.appendChild(s);
        c.addEventListener('click', function(){ phr.splice(i, 1); paintPhr(); });
        chipsEl.appendChild(c);
      });
    }
    function takePhr(){ splitPh(f2.input.value).forEach(function(x){ if (phr.indexOf(x) < 0) phr.push(x); }); f2.input.value = ''; paintPhr(); }
    pAdd.addEventListener('click', function(){ takePhr(); f2.input.focus(); });
    f2.input.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); takePhr(); } });
    f2.input.addEventListener('paste', function(){ setTimeout(function(){ if (splitPh(f2.input.value).length > 1) takePhr(); }, 0); });
    function resetForm(){
      editing = -1; phr = []; f1.input.value = ''; f2.input.value = ''; paintPhr();
      addB.textContent = '+ أضف العنصر'; cancel.hidden = true;
      msg.classList.remove('warn'); msg.textContent = HINT;
    }
    function edit(i){
      var x = extra[i];
      editing = i; f1.input.value = x.label; phr = (x.opts || []).slice(); f2.input.value = ''; paintPhr();
      addB.textContent = 'احفظ التعديل'; cancel.hidden = false;
      f1.input.focus(); af.scrollIntoView({ block: 'center' });
    }
    cancel.addEventListener('click', resetForm);
    function add(){
      var name = f1.input.value.trim();
      if (f2.input.value.trim()) takePhr();                /* عبارة كتبت ولم تضف بعد لا تضيع */
      msg.classList.remove('warn'); msg.textContent = HINT;
      if (!name) { msg.classList.add('warn'); msg.textContent = 'اكتب اسم العنصر أولا.'; f1.input.focus(); return; }
      if (all.concat(extra).some(function(x){ return x.label.trim() === name && !(editing > -1 && extra[editing] === x); })) {
        msg.classList.add('warn'); msg.textContent = '«' + name + '» في القائمة من قبل.'; return;
      }
      if (editing > -1) {
        extra[editing] = { id: extra[editing].id, label: name, opts: phr.slice() };
        S.toast('عدل «' + name + '» — يسري على تقاريرك الجديدة');
      } else {
        extra.push({ id: ShoubaRec.newId('x'), label: name, opts: phr.slice() });
        S.toast('أضيف «' + name + '» — يظهر في تقاريرك الجديدة');
      }
      resetForm(); f1.input.focus();
      paintX(); refresh(); persist();
    }
    addB.addEventListener('click', add);
    f1.input.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); f2.input.focus(); } });
    af.appendChild(f1.box); af.appendChild(f2.box); af.appendChild(addB); af.appendChild(cancel);
    xs.appendChild(xh); xs.appendChild(xl); xs.appendChild(af);
    itemsEl.appendChild(xs);
    paintX();

    ok.addEventListener('click', function(){ if (ok.disabled) return; persist(); done(); });
    refresh();
  }

  function start(){
    var checks = tb.columns.filter(function(c){ return c.kind === 'check'; });
    var fixed = tb.columns.filter(function(c){ return c.kind !== 'check'; }).map(function(c){ return c.label; });
    var cur = S.pickOf(t.id), sel = cur && cur[tb.id] ? cur[tb.id].slice() : [];
    var itemsEl = document.getElementById('items'), ok = document.getElementById('ok');
    var order = [], groups = {}, rows = {}, gAll = {};

    document.getElementById('ttl').textContent = 'عناصر ' + (t.ready || t.title);
    document.title = 'شعبة · عناصر ' + (t.ready || t.title);
    itemsEl.appendChild(el('div', 'lead', 'اختر من عناصر النموذج ما تتابعه في معلميك — يطبق على شعبتك كلها، وتعدله متى شئت فيسري على السجلات الجديدة. وتبقى معها دائما: ' + fixed.join(' · ') + '.'));

    function on(id){ return sel.indexOf(id) > -1; }
    function set(id, v){ var i = sel.indexOf(id); if (v && i < 0) sel.push(id); if (!v && i > -1) sel.splice(i, 1); }
    function refresh(){
      Object.keys(rows).forEach(function(id){
        rows[id].classList.toggle('on', on(id));
        rows[id].setAttribute('aria-checked', on(id) ? 'true' : 'false');
      });
      order.forEach(function(g){
        gAll[g].textContent = groups[g].every(function(c){ return on(c.id); }) ? 'ألغ المجموعة' : 'اختر المجموعة';
      });
      document.getElementById('sub').textContent = 'اخترت ' + sel.length + ' من ' + checks.length;
      ok.disabled = !sel.length;
      ok.textContent = sel.length ? 'تم' : 'اختر عنصرا واحدا على الأقل';
    }
    /* يحفظ الاختيار مع كل لمسة (قاعدة الادخال 2026-09-13) — كان لا يحفظ الا بالزر فيضيع بالخروج من المنزل.
       بترتيب النموذج لا بترتيب اللمس. وإلغاء الكل يمسح الاختيار (لا يبقى آخره خلف شاشة فارغة)، فتسأله الشاشة
       من جديد عند فتح السجل كأول مرة */
    function persist(){
      if (!sel.length) { S.setPick(t.id, null); return; }
      var map = {};
      map[tb.id] = checks.map(function(c){ return c.id; }).filter(on);
      S.setPick(t.id, map);
    }

    checks.forEach(function(c){ var g = c.group || ''; if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push(c); });
    order.forEach(function(g){
      var sec = el('section', 'grp'), head = el('div', 'sect'), all = el('div', 'a'), list = el('div', 'stack');
      head.appendChild(el('div', 'h', groupLabel(g) || 'عناصر أخرى'));
      all.setAttribute('role', 'button'); all.tabIndex = 0;
      function toggleGroup(){
        var every = groups[g].every(function(c){ return on(c.id); });
        groups[g].forEach(function(c){ set(c.id, !every); });
        refresh(); persist();
      }
      all.addEventListener('click', toggleGroup);
      all.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleGroup(); } });
      head.appendChild(all);
      gAll[g] = all;
      groups[g].forEach(function(c){
        var r = el('div', 'pick');
        r.setAttribute('role', 'checkbox'); r.tabIndex = 0;
        r.innerHTML = '<span class="mark">' + CHK + '</span><div class="tx"><b></b></div>';
        r.querySelector('b').textContent = c.label;
        function tap(){ set(c.id, !on(c.id)); refresh(); persist(); }
        r.addEventListener('click', tap);
        r.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } });
        rows[c.id] = r;
        list.appendChild(r);
      });
      sec.appendChild(head); sec.appendChild(list);
      itemsEl.appendChild(sec);
    });

    /* «تم»: الاختيار محفوظ، فالى ارشيف السجل (done اعلاه) */
    ok.addEventListener('click', function(){
      if (!sel.length) return;
      persist();
      done();
    });
    refresh();
  }
</script>
</body>
</html>
