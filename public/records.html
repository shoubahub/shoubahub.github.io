<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · سجلاتك</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1B5183" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="identity/assets/app-icon-approved.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="identity/tokens.css?v=48" />
<link rel="stylesheet" href="shell.css?v=48" />
<link rel="stylesheet" href="components.css?v=48" />
<link rel="stylesheet" href="frame.css?v=48" />
<style>
  .wrap{display:flex;flex-direction:column;gap:14px;padding-top:14px}
  .note{padding:0 var(--gap-side);font-size:12px;font-weight:600;color:var(--shouba-hint);line-height:1.8}
  .editrow{padding:0 var(--gap-side)}
  .editrow button{width:100%;border:0;cursor:pointer;font-family:var(--font-ar);font-size:13px;font-weight:700;
    color:var(--shouba-navy);background:rgba(22,69,110,.09);border-radius:14px;padding:13px}
</style>
</head>
<body class="framed">
 <div class="device"><div class="viewport">
    <div class="topbar">
      <div class="tbcrest" id="tbCrest"></div>
      <div class="tt">
        <b>سجلاتك</b>
        <span id="headLine">—</span>
      </div>
      <div class="iconbtn" id="toBoard" data-home title="اللوحة">

      </div>
    </div>

  <div class="screen has-topbar has-tabbar">
    <div class="content">
      <div class="wrap">
        <div class="vlist" id="list"></div>
        <div class="editrow"><button id="edit">عدل قائمة سجلاتك</button></div>
        <div class="note" id="note"></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab" data-go="board.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 8.4 10 3l7 5.4V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      اللوحة
    </button>
    <button class="tab" data-go="teachers.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M4 17c0-3 2.7-4.6 6-4.6S16 14 16 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      المعلمون
    </button>
    <button class="tab-add" id="add" aria-label="إضافة">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><path d="M10 4 V16 M4 10 H16" stroke="#241D06" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
    <button class="tab on" data-go="records.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 3h7l3 3v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 9h6M7 12.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      سجلاتك
    </button>
    <button class="tab" data-go="schedule.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="3.5" y="4.5" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 8.5h13M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      الجدول
    </button>
  </div>
 </div></div>

<script src="build.js?v=48"></script>
<script src="refdata.js?v=48"></script>
<script src="rec-templates.js?v=48"></script>
<script src="rec-engine.js?v=48"></script>
<script src="derive.js?v=48"></script>
<script src="icons.js?v=48"></script>
<script src="components.js?v=48"></script>
<script>
  var d = Shouba.data();

  (function paintTopCrest(){
    var el=document.getElementById('tbCrest'), c=d.crest;
    if(c && c.type==='image') el.innerHTML='<img src="'+c.data+'" alt="شعار المدرسة" />';
    else if(c && c.type==='icon' && window.SHOUBA_ICONS) el.innerHTML=SHOUBA_ICONS.svg(c.id,22);
    else el.innerHTML='<img src="identity/assets/logo-vec-dark.svg" alt="شعبة" style="object-fit:contain;padding:5px" />';
  })();

  /* السجلات التي اعتمدها رئيس الشعبة في ش⑥ — لا تخترع قائمة هنا: المصدر ما اختاره في الإعداد، وتعديلها من هناك.
     ما بني قالبه (ShoubaRec.byReady) يفتح ارشيفه (archive.html)، وفيه الجديد والمحفوظ (2026-09-12).
     وسائرها «قيد الإعداد» حتى تبنى قوالبها. */
  var listEl = document.getElementById('list');
  var records = (d.records || []).slice();
  var ready = records.filter(function(n){ return ShoubaRec.byReady(n); }).length;

  if(!records.length){
    listEl.innerHTML = '<div class="invite">لم تعتمد سجلات في الإعداد بعد —'
      + ' وهي قوالب رسمية جاهزة تختار منها ما يخص شعبتك.</div>';
  }
  records.forEach(function(name){
    var t = ShoubaRec.byReady(name), b = document.createElement('button');
    b.innerHTML = '<b></b><span class="val"></span><span class="chev">‹</span>';
    b.querySelector('b').textContent = name;
    if (t) {
      b.className = 'entry';
      b.querySelector('.val').textContent = Shouba.count(Shouba.recs(t.id).length, t.noun || {});
      b.addEventListener('click', function(){ location.href = 'archive.html?tpl=' + encodeURIComponent(t.id); });
    } else {
      b.className = 'entry soon';
      b.querySelector('.val').textContent = 'قالب فارغ';
      b.addEventListener('click', function(){
        var n = document.createElement('div');
        n.className = 'soon-note';
        n.textContent = 'سجل «' + name + '» قيد الإعداد — يصل في تحديث قادم بحقوله الرسمية،'
                      + ' وما تدخله اليوم في اللوحة والجداول يغذيه حين يجهز.';
        Shouba.sheet.open(name, n);
      });
    }
    listEl.appendChild(b);
  });

  /* قالب رسمي جاهز ليس في قائمتك (بني بعد اعدادك — كالخطة التشغيلية 2026-09-12): يعرض «جديد» ويضاف بلمسة
     ثم يفتح ارشيفه. القائمة تبقى قرارك — لا يضاف اليها شيء دون لمستك */
  ShoubaRec.list().filter(function(t){ return t.ready && records.indexOf(t.ready) < 0; }).forEach(function(t){
    var b = document.createElement('button');
    b.className = 'entry';
    b.innerHTML = '<b></b><span class="chip">جديد — أضفه</span>';
    b.querySelector('b').textContent = t.ready;
    b.addEventListener('click', function(){
      Shouba.save({ records: (Shouba.data().records || []).concat(t.ready) });
      location.href = 'archive.html?tpl=' + encodeURIComponent(t.id);
    });
    listEl.appendChild(b);
  });

  document.getElementById('headLine').textContent = records.length
    ? Shouba.count(records.length,{one:'سجل',two:'سجلان',few:'سجلات',many:'سجلا'})
      + (ready ? ' · جاهز منها ' + ready : ' · قوالب قيد الإعداد')
    : 'لم تعتمد سجلات بعد';
  document.getElementById('note').textContent = records.length
    ? 'هذه السجلات التي اعتمدتها في الإعداد — الجاهز منها يفتح بلمسة، وسائرها تبنى حقوله تباعا.' : '';

  document.getElementById('edit').addEventListener('click', function(){
    location.href = 'setup-wizard-6.html?ret=records';
  });
  [].forEach.call(document.querySelectorAll('.tab[data-go]'), function(b){
    b.addEventListener('click', function(){ if(!b.classList.contains('on')) location.href = b.dataset.go; });
  });
  /* المنزل يتولاه bindHome في الطبقة المشتركة — لا مستمع هنا */
  document.getElementById('add').addEventListener('click', Shouba.quickAdd);
</script>
</body>
</html>
