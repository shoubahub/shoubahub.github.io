<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · جداول المعلمين</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1B5183" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="identity/assets/app-icon-approved.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="identity/tokens.css?v=76" />
<link rel="stylesheet" href="shell.css?v=76" />
<link rel="stylesheet" href="components.css?v=76" />
<link rel="stylesheet" href="frame.css?v=76" />
<link rel="stylesheet" href="rec-print.css?v=76" />
<style>
  /* خاص بشاشة الجداول — الرأس والشريط السفلي واللوحة السفلية من components.css.
     الهامش الجانبي هنا أضيق من الموحد عمدا: المصفوفة تحتاج كل بكسل (الوظيفة قبل الشكل). */
  .wrap{display:flex;flex-direction:column;gap:12px;padding-top:12px}

  /* شريط المعلمين — شارة لكل معلم وتحتها مؤشر اكتمال جدوله */
  .tsel{display:flex;gap:7px;overflow-x:auto;padding:3px var(--gap-side);scrollbar-width:none}
  .tsel::-webkit-scrollbar{display:none}
  .tch{flex:none;border:0;cursor:pointer;font-family:var(--font-ar);text-align:center;
    background:linear-gradient(180deg,var(--shouba-paper) 0%,#F4EDE0 100%);border-radius:14px;padding:8px 12px;
    display:flex;flex-direction:column;gap:2px;color:var(--shouba-text-muted);
    box-shadow:inset 0 1.2px 0 rgba(255,255,255,.85), 0 2px 0 rgba(190,172,140,.45)}
  .tch b{font-size:13px;font-weight:700;color:var(--shouba-navy);white-space:nowrap}
  .tch small{font-size:10.5px;font-weight:700;color:var(--shouba-hint);font-family:var(--font-num)}
  .tch.on{box-shadow:inset 0 1.2px 0 rgba(255,255,255,.85), 0 2px 0 rgba(190,172,140,.45), 0 0 0 2px var(--shouba-navy)}
  .tch.none small{color:var(--shouba-amber-deep)}

  /* المصفوفة: أعمدة = الأيام · صفوف = الحصص */
  .grid{margin:0 12px;border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,var(--shouba-paper) 0%,#F4EDE0 100%);
    box-shadow:inset 0 1.2px 0 rgba(255,255,255,.85), 0 2px 0 rgba(190,172,140,.45), 0 8px 16px rgba(120,98,66,.14)}
  .grow{display:flex;align-items:stretch;gap:6px;padding:4px 6px}
  .grow.hd{background:rgba(120,98,66,.07);padding:6px}
  .grow.hd span{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--shouba-label);
    padding:2px 0;border-radius:8px}
  /* تمييز أعمدة الأيام: نطاق رأسي خفيف يوما بعد يوم، وإلا قرئت الخانات صفا واحدا متصلا
     (لاحظه المستخدم 2026-09-01). النطاق يبدأ من اسم اليوم فيمتد العمود كله. */
  .grow.hd span.alt{background:rgba(120,98,66,.09)}
  .cell.alt{background:rgba(120,98,66,.13)}
  .grow.hd .pl{flex:none;width:42px}
  .pl{flex:none;width:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
  .pl b{font-size:13px;font-weight:700;color:var(--shouba-navy);font-family:var(--font-num);line-height:1.1}
  .pl small{font-size:8.5px;font-weight:600;color:var(--shouba-hint)}
  .cell{flex:1;min-width:0;border:0;cursor:pointer;font-family:var(--font-ar);
    background:rgba(120,98,66,.025);border-radius:11px;padding:7px 3px;min-height:46px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .cell .cls{font-size:12.5px;font-weight:700;color:var(--shouba-navy);font-family:var(--font-num)}
  .cell .cls i{font-style:normal;font-family:var(--font-ar)}   /* رمز المسار: ع علمي · د ادبي */
  .cell .sub{font-size:9px;font-weight:600;color:var(--shouba-text-muted);
    max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell.free{color:var(--shouba-hint);font-size:15px;font-weight:700}
  .cell.clash{background:rgba(183,68,58,.10);box-shadow:inset 0 0 0 1.5px var(--shouba-error)}
  .cell.clash .cls{color:var(--shouba-error)}
  /* صف الفرصة — فاصل رفيع لا مربعات (لا تدخل فيه حصص) */
  .gbrk{display:flex;align-items:center;gap:8px;padding:3px 12px;background:rgba(232,163,61,.10)}
  .gbrk span{font-size:10px;font-weight:700;color:var(--shouba-amber-deep);white-space:nowrap}
  .gbrk i{flex:1;height:1px;background:rgba(169,112,27,.28)}

  /* الجدول الكامل — اول مربع في شريط المعلمين، على طريقة «الجدول العام للمعلمين» في المدرسة (2026-09-13، ورقة
     المستخدم «فلسفة 2» — «وهو كذلك عند كل الشعب»): صف لكل معلم، والاسبوع اعمدة مجمعة باليوم، والفرصتان عمودان رفيعان،
     والخانة الفصل بسطرين («11د» فوق «2»). يستوعب اي عدد: كل معلم صف. عمود الاسماء ثابت والايام تسحب يوما يوما
     (scroll-snap)، وشريط الايام فوقه ينقل ويتبع. ⚠ جرب قبله: الاسماء في خانات الجدول الاسبوعي — لا تستوعب شعبة كبيرة */
  .gdays{display:flex;gap:6px;padding:0 12px}
  .gday{flex:1;border:0;cursor:pointer;font-family:var(--font-ar);font-size:12px;font-weight:700;color:var(--shouba-text-muted);
    background:linear-gradient(180deg,var(--shouba-paper) 0%,#F4EDE0 100%);border-radius:12px;padding:8px 0;
    box-shadow:inset 0 1.2px 0 rgba(255,255,255,.85), 0 2px 0 rgba(190,172,140,.45)}
  .gday.on{color:var(--shouba-navy);box-shadow:inset 0 1.2px 0 rgba(255,255,255,.85), 0 2px 0 rgba(190,172,140,.45), 0 0 0 2px var(--shouba-navy)}
  .gwrap{margin:0 12px;border-radius:16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
    background:linear-gradient(180deg,var(--shouba-paper) 0%,#F4EDE0 100%);
    box-shadow:inset 0 1.2px 0 rgba(255,255,255,.85), 0 2px 0 rgba(190,172,140,.45), 0 8px 16px rgba(120,98,66,.14)}
  .gwrap::-webkit-scrollbar{display:none}
  .gt{display:grid;gap:3px;padding:5px;width:max-content}
  /* عمود الاسماء ثابت: خلفية مصمتة تحجب ما يمر تحته، وظل بعرض الفجوة يحجبها كذلك */
  .gt .nm{position:sticky;inset-inline-start:0;z-index:2;background:#F7F0E3;box-shadow:-3px 0 0 0 #F7F0E3;
    display:flex;flex-direction:column;justify-content:center;min-width:0;padding:0 2px}
  .gt .tn{cursor:pointer}
  .gt .tn b{font-size:12px;font-weight:700;color:var(--shouba-navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gt .tn small{font-size:9.5px;font-weight:600;color:var(--shouba-hint);white-space:nowrap}
  .gt .dh{scroll-snap-align:start;text-align:center;font-size:12.5px;font-weight:700;color:var(--shouba-navy);padding:6px 0;
    border-radius:9px;background:rgba(120,98,66,.06)}
  .gt .pn{text-align:center;font-size:10.5px;font-weight:700;color:var(--shouba-label);font-family:var(--font-num);padding:2px 0;border-radius:6px}
  .gt .gc{min-height:40px;border-radius:9px;background:rgba(120,98,66,.025);display:flex;flex-direction:column;align-items:center;
    justify-content:center;cursor:pointer;line-height:1.1}
  .gt .gc b{font-size:11.5px;font-weight:700;color:var(--shouba-navy);font-family:var(--font-ar)}
  .gt .gc span{font-size:11px;font-weight:700;color:var(--shouba-text-muted);font-family:var(--font-ar)}
  .gt .alt{background:rgba(120,98,66,.10)}             /* نطاق اليوم المتناوب — فيقرأ كل يوم عمودا واحدا */
  .gt .brk{background:rgba(232,163,61,.16);border-radius:4px}
  .gt .gc.clash{background:rgba(183,68,58,.12);box-shadow:inset 0 0 0 1.5px var(--shouba-error)}
  .gt .gc.clash b,.gt .gc.clash span{color:var(--shouba-error)}
  .gprint{margin:0 12px;width:auto}
  .gcls{margin:0 12px;width:auto;font-size:12.5px;line-height:1.6;white-space:normal}   /* فصول مدرستك — في العرضين */
  body:not(.gfull) .gdays, body:not(.gfull) .gwrap, body:not(.gfull) .gprint{display:none}
  body.gfull #grid{display:none}
  /* الجدول العام على الورق (A4 عرضي) — كورقة المدرسة: الايام فوق وحصصها تحتها، والفرصة عمود رفيع، واسم المعلم كاملا.
     الارقام لاتينية كورقة المدرسة لا هندية كسائر النماذج */
  .pp-gt table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt;line-height:1.2}
  .pp-gt th,.pp-gt td{border:1px solid #000;text-align:center;vertical-align:middle;padding:.6mm 0}
  .pp-gt thead .d{font-size:13pt;font-weight:700;padding:1.5mm 0;border-bottom-width:1px}
  .pp-gt thead .n{font-size:10pt;font-weight:700}
  .pp-gt .nm{width:30mm;font-size:10pt;font-weight:700;padding:1mm 1.5mm;text-align:right}
  .pp-gt .brk{width:3.2mm;background:#e6e6e6}
  .pp-gt tbody td{height:var(--rh,11mm);font-weight:700}
  /* شعبة كبيرة: الصف اقصر (printGT يحسب --rh) والخط اصغر قليلا فيتسع الاسم والفصل */
  .pp-gt.compact .nm{font-size:9pt;padding:.4mm 1.5mm}
  .pp-gt.compact tbody td{font-size:8.5pt;padding:.3mm 0}
  .pp-gt td b{display:block}
  .pp-gt .ds{border-right-width:2.2px}
  .pp-gsub{text-align:center;font-weight:700;font-size:12pt;margin:-3mm 0 4mm}

  /* تنبيه التعارض + سطر الإرشاد */
  .clashes{margin:0 12px;display:none;flex-direction:column;gap:5px;
    background:rgba(183,68,58,.08);border-radius:13px;padding:10px 12px}
  .clashes.show{display:flex}
  .clashes b{font-size:12.5px;font-weight:700;color:var(--shouba-error)}
  .clashes small{font-size:11.5px;font-weight:600;color:var(--shouba-text-muted);line-height:1.7}
  .hintline{padding:0 var(--gap-side);font-size:11.5px;font-weight:600;color:var(--shouba-hint);line-height:1.7}
  .empty{margin:0 var(--gap-side);font-size:12.5px;color:var(--shouba-text-muted);line-height:1.8;
    background:rgba(120,98,66,.06);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:10px}

  /* محتوى اللوحة السفلية: شارات الشعب + أزرار سريعة */
  .secs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:2px 0 4px}
  .secbtn{border:0;cursor:pointer;font-family:var(--font-num);font-size:16px;font-weight:700;
    width:52px;height:48px;border-radius:14px;color:var(--shouba-navy);
    background:linear-gradient(180deg,var(--shouba-paper) 0%,#F4EDE0 100%);
    box-shadow:inset 0 1.2px 0 rgba(255,255,255,.85), 0 2px 0 rgba(190,172,140,.45)}
  .quick{display:flex;gap:8px;padding-bottom:4px}
  .quick button{flex:1;border:0;cursor:pointer;font-family:var(--font-ar);font-size:13px;font-weight:700;
    border-radius:13px;padding:11px 10px;color:var(--shouba-navy);background:rgba(22,69,110,.09)}
  .quick button.amber{background:rgba(232,163,61,.18);color:var(--shouba-amber-deep)}
  /* اختيار الشعبة بمسارين (الاختيار الحر 2026-09-14): اسم المسار فوق ارقامه */
  .trk{font-size:12.5px;font-weight:700;color:var(--shouba-label);padding:6px 2px 0}
  /* فصول مدرستك (2026-09-14): سطر لكل صف ومسار بعداد − ن + */
  .counts{display:flex;flex-direction:column;gap:10px}
  .crow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px}
  .crow b{font-size:14.5px;font-weight:700;color:var(--shouba-navy)}
  .stp{display:flex;align-items:center;gap:10px}
  .stp button{border:0;cursor:pointer;font-family:var(--font-num);font-size:20px;font-weight:700;width:44px;height:42px;border-radius:13px;
    color:var(--shouba-navy);background:linear-gradient(180deg,var(--shouba-paper) 0%,#F4EDE0 100%);
    box-shadow:inset 0 1.2px 0 rgba(255,255,255,.85), 0 2px 0 rgba(190,172,140,.45)}
  .stp button[disabled]{color:#CDBFA6;cursor:default}
  .stp span{min-width:28px;text-align:center;font-family:var(--font-num);font-size:18px;font-weight:700;color:var(--shouba-navy)}
  /* حصص بلا مسار — تنبيه عنبري لا احمر: ليس خطأ بل ما ينتظر تحديدا */
  .untr{display:none;flex-direction:column;gap:4px;margin:0 var(--gap-side);background:rgba(232,163,61,.12);border-radius:13px;padding:10px 12px}
  .untr.show{display:flex}
  .untr b{font-size:12.5px;font-weight:700;color:var(--shouba-amber-deep);line-height:1.6}
  .untr small{font-size:11.5px;font-weight:600;color:var(--shouba-text-muted);line-height:1.7}
</style>
</head>

<script src="build.js?v=76"></script>
<script src="refdata.js?v=76"></script>
<script src="derive.js?v=76"></script>

<script src="components.js?v=76"></script>

<script>
  var R=window.SHOUBA_REF;
  var d = Shouba.data();          /* المصدر الواحد — القراءة والكتابة من طبقة الاشتقاق */

  var GRADE_NO = { 'الأول':1,'الثاني':2,'الثالث':3,'الرابع':4,'الخامس':5,
                   'السادس':6,'السابع':7,'الثامن':8,'التاسع':9,
                   'العاشر':10,'الحادي عشر':11,'الثاني عشر':12 };
  var ORD  = ['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة'];
  var SHORT= ['أحد','اثن','ثلا','أرب','خمي'];

  /* البنية والحقائق كلها من طبقة الاشتقاق — هذه الشاشة تعرض وتدخل، ولا تحسب */
  var days     = Shouba.days();
  var times    = Shouba.periods();
  var subjects = Shouba.subjects();
  var teachers = Shouba.roster();     /* رئيس الشعبة أولا ثم معلموه — يدرس هو أيضا */
  var SELF     = Shouba.self();

  var lastName    = Shouba.lastName;
  var slotsOf     = function(t, day){ return Shouba.daySlots(t, day); };
  var splitSlot   = Shouba.splitSlot;
  var filledCount = Shouba.loadOf;

  /* شعار المدرسة أو رمز الشعبة في الرأس (نفس منطق اللوحة) */
  (function paintTopCrest(){
    var el=document.getElementById('tbCrest'), c=d.crest;
    if(c && c.type==='image') el.innerHTML='<img src="'+c.data+'" alt="شعار المدرسة" />';
    else if(c && c.type==='icon' && window.SHOUBA_ICONS) el.innerHTML=SHOUBA_ICONS.svg(c.id,22);
    else el.innerHTML='<img src="identity/assets/logo-vec-dark.svg" alt="شعبة" style="object-fit:contain;padding:5px" />';
  })();

  /* ===== لا معلمين بعد: الشاشة تدل على مصدرها ولا تعرض مصفوفة فارغة ===== */
  if(!teachers.length){
    document.getElementById('wrap').innerHTML =
      '<div class="empty"><div>لم تضف معلمي شعبتك بعد — والجدول يبنى على أسمائهم.</div>'
      + '<button class="cta" id="toTeachers">أضف معلميك</button></div>';
    document.getElementById('headLine').textContent = 'بانتظار أسماء معلميك';
    /* الى إضافة المعلم مباشرة — كان يفتح خطوة التسجيل ⑤ فيدفع «التالي» الى ⑥ و⑦ (قاعدة الادخال 2026-09-13) */
    document.getElementById('toTeachers').addEventListener('click', function(){ location.href='teachers.html?add=1'; });
  } else {
    /* ?t=اسم ⟵ **وضع المعلم الواحد**: قادم من ملفه، فيفرد جدوله وحده
       بلا شريط المعلمين ولا تنقل بينهم (قرار المستخدم 2026-09-06). */
    /* الاسم من الرابط ينظف كالبيانات: رابط قديم مشكول يبقى يجد معلمه (2026-09-11) */
    var want = Shouba.plain(new URLSearchParams(location.search).get('t') || '') || null;
    var solo = !!(want && teachers.indexOf(want) > -1);
    var cur  = solo ? want : teachers[0];
    if(solo){
      document.body.classList.add('solo');
      document.querySelector('.topbar .tt b').textContent = 'جدول أ. ' + Shouba.shortName(cur);
    }
    var lastSlot = null;                       /* آخر إدخال — لزر التكرار السريع */
    /* الجدول الكامل (2026-09-13، بطلب المستخدم): يفتح عليه افتراضا — اول مربع في الشريط قبل رئيس الشعبة —
       ولمس اسم معلم يعرض جدوله للاطلاع او التعديل. والقادم من ملف المعلم (?t=) يبقى على معلمه.
       ⚠ جربت قبله شاشة يوم واحد بصف لكل معلم (بناء ٦٦) فردها: «ليس بهذا التنسيق وانما كما كان سابقا» */
    var full = !solo;

    /* ===== شريط المعلمين ===== */
    var tsel = document.getElementById('tsel');
    function paintTsel(){
      tsel.innerHTML='';
      var all = document.createElement('button');
      all.className = 'tch all' + (full ? ' on' : '');
      all.innerHTML = '<b>الجدول الكامل</b><small>كل المعلمين</small>';
      all.addEventListener('click', function(){ full = true; paintAll(); });
      tsel.appendChild(all);
      teachers.forEach(function(t){
        var n = filledCount(t);
        var b = document.createElement('button');
        var isMe = (t === SELF);
        b.className = 'tch' + (!full && t===cur ? ' on' : '') + (n ? '' : ' none') + (isMe ? ' me' : '');
        var load = n ? Shouba.count(n,{one:'حصة',two:'حصتان',few:'حصص',many:'حصة'}) : 'بلا جدول';
        b.innerHTML = '<b>'+lastName(t)+'</b><small>' + (isMe ? 'أنت · ' : '') + load + '</small>';
        b.addEventListener('click', function(){ cur=t; full=false; paintAll(); });
        tsel.appendChild(b);
      });
    }

    /* ===== المصفوفة ===== */
    var grid = document.getElementById('grid');
    /* التعارضات تحسب في طبقة الاشتقاق؛ هنا نحولها إلى خريطة سريعة لتلوين المربعات.
       المفتاح: «اليوم|رقم الحصة» ← اسم المعلم الآخر. */
    var clashMap = {};
    function buildClashMap(){
      clashMap = {};
      Shouba.clashes(cur).forEach(function(c){
        var other = c.teachers[0] === cur ? c.teachers[1] : c.teachers[0];
        clashMap[c.day + '|' + c.pIdx] = other;
      });
    }
    function clashAt(day, pIdx, cls){ return cls ? (clashMap[day + '|' + pIdx] || null) : null; }
    /* ===== الجدول الكامل على طريقة الجدول العام للمدرسة (2026-09-13، ورقة المستخدم) =====
       صف لكل معلم (رئيس الشعبة اولا) · الاسبوع اعمدة مجمعة باليوم · الفرصة عمود رفيع متى وقعت بين حصتين ·
       الخانة الفصل بسطرين «11د» فوق «2» · عمود الاسماء ثابت والايام تسحب يوما يوما، وشريط الايام ينقل ويتبع */
    var gdays = document.getElementById('gdays'), gwrap = document.getElementById('gwrap'), gt = document.getElementById('gt');
    var gDay = days[Shouba.schoolDay().next.getDay()] || days[0], gHdr = [];   /* يفتح على اليوم او اول يوم دوام قادم */
    var NAMEW = 62, BRKW = 8, GAP = 3, PAD = 5;
    function esc(x){ return String(x == null ? '' : x).replace(/[&<>"]/g, function(ch){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]; }); }
    /* اعمدة اليوم: الحصص، والفرصة عمود رفيع بين حصتين (لا لقاء الصباح قبل الاولى) */
    function dayCols(){
      var out = [], seen = false, brk = false;
      times.forEach(function(t){
        if(t.brk){ if(seen) brk = true; return; }
        if(brk){ out.push({ brk:true }); brk = false; }
        out.push({ n:t.n }); seen = true;
      });
      return out;
    }
    /* «11/2 د» ⟵ «11د» فوق «2» كورقة المدرسة (dir=ltr: الرقم ثم رمز المسار) */
    function clsParts(cls){
      var c = Shouba.splitClass(cls), p = c.base.split('/');
      return { top: p[0] + (c.mark || ''), sec: p[1] || '' };
    }
    function paintGT(){
      var cols = dayCols(), nP = cols.filter(function(c){ return !c.brk; }).length, nB = cols.length - nP;
      /* عرض الحصة يملأ الشاشة بيوم واحد (بين ٣٠ و٤٤) — فالسحبة يوم كامل */
      var vis = gwrap.clientWidth - NAMEW - PAD * 2 - GAP;
      var p = Math.max(30, Math.min(44, Math.floor((vis - nB * BRKW - cols.length * GAP) / nP)));
      var one = cols.map(function(c){ return (c.brk ? BRKW : p) + 'px'; }).join(' '), tcols = NAMEW + 'px';
      days.forEach(function(){ tcols += ' ' + one; });
      gt.style.gridTemplateColumns = tcols;
      gwrap.style.setProperty('scroll-padding-inline-start', (PAD + NAMEW + GAP) + 'px');

      var list = Shouba.clashes(), hot = {};
      list.forEach(function(c){ hot[c.day+'|'+c.pIdx+'|'+c.teachers[0]] = hot[c.day+'|'+c.pIdx+'|'+c.teachers[1]] = 1; });
      gt.innerHTML = ''; gHdr = [];
      function cell(cls, html){ var e = document.createElement('div'); e.className = cls; if(html) e.innerHTML = html; gt.appendChild(e); return e; }
      cell('nm');
      days.forEach(function(day, di){ var h = cell('dh' + (di%2===0 ? ' alt' : ''), esc(day)); h.style.gridColumn = 'span ' + cols.length; gHdr.push(h); });
      cell('nm');
      days.forEach(function(day, di){ cols.forEach(function(c){ cell(c.brk ? 'pn brk' : 'pn' + (di%2===0 ? ' alt' : ''), c.brk ? '' : String(c.n)); }); });
      teachers.forEach(function(t){
        var n = filledCount(t);
        var nm = cell('nm tn', '<b>' + esc(lastName(t)) + '</b><small>' + (t === SELF ? 'أنت'
          : n ? Shouba.count(n, { one:'حصة', two:'حصتان', few:'حصص', many:'حصة' }) : 'بلا جدول') + '</small>');
        nm.setAttribute('role', 'button');
        nm.addEventListener('click', function(){ cur = t; full = false; paintAll(); window.scrollTo(0, 0); });
        days.forEach(function(day, di){
          cols.forEach(function(c){
            if(c.brk){ cell('gc brk'); return; }
            var pIdx = c.n - 1, val = Shouba.slot(t, day, pIdx), s = splitSlot(val), k = val ? clsParts(s.cls) : null;
            var e = cell('gc' + (di%2===0 ? ' alt' : '') + (val ? '' : ' free') + (hot[day+'|'+pIdx+'|'+t] ? ' clash' : ''),
                         k ? '<b dir="ltr">' + esc(k.top) + '</b><span>' + esc(k.sec) + '</span>' : '');
            if(val) e.title = s.subject + ' — أ. ' + t;
            /* المربع يفتح جدول المعلم وحصته نفسها للتعديل */
            e.addEventListener('click', function(){ cur = t; full = false; paintAll(); window.scrollTo(0, 0); openCell(day, pIdx, c.n); });
          });
        });
      });

      gdays.innerHTML = '';
      days.forEach(function(day, i){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'gday'; b.textContent = day;
        b.addEventListener('click', function(){ goDay(i, true); });
        gdays.appendChild(b);
      });
      goDay(Math.max(0, days.indexOf(gDay)), false);

      var box = document.getElementById('clashes');
      if(!list.length){ box.className = 'clashes'; box.innerHTML = ''; return; }
      box.className = 'clashes show';
      box.innerHTML = '<b>تعارض في الإسناد (' + list.length + ')</b>'
        + list.slice(0, 3).map(function(c){
            return '<small>' + c.day + ' · الحصة ' + c.n + ' — الصف <b>' + esc(c.cls) + '</b> عند أ. ' + esc(lastName(c.teachers[0])) + ' وأ. ' + esc(lastName(c.teachers[1])) + '</small>';
          }).join('');
    }
    /* خط الاستقرار: بعد عمود الاسماء. التمرير بفرق الحافة لا بقيمة scrollLeft — فلا يلتبس اتجاهها في RTL بين المتصفحات */
    function snapLine(){ return gwrap.getBoundingClientRect().right - (PAD + NAMEW + GAP); }
    function markDay(i){ gDay = days[i]; [].forEach.call(gdays.children, function(b, k){ b.classList.toggle('on', k === i); }); }
    function goDay(i, smooth){
      var h = gHdr[i];
      if(!h) return;
      gwrap.scrollBy({ left: h.getBoundingClientRect().right - snapLine(), behavior: smooth ? 'smooth' : 'auto' });
      markDay(i);
      /* ان لم يجر الانزلاق (متصفح يوقفه في الخلفية او يقطعه لمس) يستقر على اليوم بلا حركة */
      if(smooth) setTimeout(function(){
        var off = h.getBoundingClientRect().right - snapLine();
        if(Math.abs(off) > 2 && gDay === days[i]) gwrap.scrollBy({ left: off });
      }, 650);
    }
    var gTick = 0;
    gwrap.addEventListener('scroll', function(){   /* شريط الايام يتبع السحب */
      if(gTick) return;
      gTick = setTimeout(function(){
        gTick = 0;
        var line = snapLine(), best = 0, bd = 1e9;
        gHdr.forEach(function(h, i){ var dd = Math.abs(h.getBoundingClientRect().right - line); if(dd < bd){ bd = dd; best = i; } });
        if(days[best] !== gDay) markDay(best);
      }, 60);
    });
    window.addEventListener('resize', function(){ if(full) paintGT(); });

    /* «اطبع الجدول العام»: ورقة A4 عرضية كجدول المدرسة — الترويسة المشتركة، والايام فوق وحصصها تحتها والفرصة عمود
       رفيع، وصف لكل معلم باسمه الكامل. واول طباعة تعتمد الترويسة في اعدادات المطبوعات ثم تعود هنا (كالسجلات) */
    function printGT(){
      var P = window.ShoubaPrint, d = Shouba.data(), cols = dayCols();
      if(!P) return;
      if(!d.printOk){ location.href = 'print-settings.html?ret=schedule.html'; return; }
      var s = P.sheet('landscape');
      s.classList.add('pp-gt');
      s.appendChild(P.header(P.headerData('الجدول العام للمعلمين')));
      var sub = [d.department ? 'شعبة ' + d.department : '', d.term || '', d.year ? 'العام الدراسي ' + d.year : ''].filter(Boolean).join(' · ');
      if(sub){ var sb = document.createElement('div'); sb.className = 'pp-gsub'; sb.textContent = sub; s.appendChild(sb); }
      var h = '<thead><tr><th class="nm" rowspan="2"></th>';
      days.forEach(function(day){ h += '<th class="d" colspan="' + cols.length + '">' + esc(day) + '</th>'; });
      h += '</tr><tr>';
      days.forEach(function(){ cols.forEach(function(c, ci){ h += c.brk ? '<th class="brk"></th>' : '<th class="n' + (ci === 0 ? ' ds' : '') + '">' + c.n + '</th>'; }); });
      h += '</tr></thead><tbody>';
      teachers.forEach(function(t){
        h += '<tr><th class="nm">' + esc(t) + '</th>';
        days.forEach(function(day){
          cols.forEach(function(c, ci){
            if(c.brk){ h += '<td class="brk"></td>'; return; }
            var v = Shouba.slot(t, day, c.n - 1), k = v ? clsParts(splitSlot(v).cls) : null;
            h += '<td' + (ci === 0 ? ' class="ds"' : '') + '>' + (k ? '<b dir="ltr">' + esc(k.top) + '</b>' + esc(k.sec) : '') + '</td>';
          });
        });
        h += '</tr>';
      });
      var tb = document.createElement('table');
      tb.innerHTML = h + '</tbody>';
      s.appendChild(tb);
      /* الشعبة في صفحة واحدة (مراجعة الطباعة 2026-09-14: كانت تتسع لـ١٢ معلما، والثالث عشر ينزلق الى صفحة ثانية):
         الصف يقصر بقدر ما زاد عن الورقة، ولا ينزل عن ٧ مم (اسم وفصل مقروءان) — فتتسع نحو ١٩ معلما. وما زاد بعدها
         يكمل في صفحة ثانية برأس الجدول. القياس والورقة في الصفحة خارج النظر */
      var MM = 96 / 25.4, probe = document.createElement('div');
      probe.style.cssText = 'position:absolute;left:-10000px;top:0';
      document.body.appendChild(probe); probe.appendChild(s);
      var extra = s.offsetHeight / MM - 210;
      if(extra > 0.5 && teachers.length){
        var rh = Math.max(7, 11 - extra / teachers.length - 0.3);
        s.style.setProperty('--rh', rh.toFixed(2) + 'mm');
        if(rh < 9.5) s.classList.add('compact');
      }
      probe.removeChild(s); document.body.removeChild(probe);
      var t0 = document.title, back = function(){ document.title = t0; };
      document.title = ['الجدول العام للمعلمين', d.department || '', d.year || ''].filter(Boolean).join(' - ').replace(/[\/\\:*?"<>|]+/g, ' ');
      window.addEventListener('afterprint', back, { once: true });
      setTimeout(back, 60000);
      P.print([s]);
    }
    document.getElementById('gprint').addEventListener('click', printGT);
    function paintGrid(){
      if(full){ paintGT(); return; }
      buildClashMap();
      grid.innerHTML='';
      var hd = document.createElement('div');
      hd.className='grow hd';
      hd.innerHTML = '<div class="pl"></div>'
        + SHORT.map(function(s,i){ return '<span'+(i%2===0?' class="alt"':'')+'>'+s+'</span>'; }).join('');
      grid.appendChild(hd);

      var clashes=[];
      times.forEach(function(t){
        if(t.brk){
          var br=document.createElement('div');
          br.className='gbrk';
          br.innerHTML='<i></i><span>'+t.label+'</span><i></i>';
          grid.appendChild(br);
          return;
        }
        var pIdx = t.n - 1;
        var row = document.createElement('div');
        row.className='grow';
        row.innerHTML = '<div class="pl"><b>'+t.n+'</b><small>الحصة</small></div>';
        days.forEach(function(day, di){
          var val = slotsOf(cur, day)[pIdx], s = splitSlot(val), cl = Shouba.splitClass(s.cls);
          var c = document.createElement('button');
          var who = clashAt(day, pIdx, s.cls);
          c.className = 'cell' + (di%2===0 ? ' alt' : '') + (val ? '' : ' free') + (who ? ' clash' : '');
          c.innerHTML = val
            ? '<span class="cls">'+cl.base+(cl.mark ? ' <i>'+cl.mark+'</i>' : '')+'</span><span class="sub">'+s.subject+'</span>'
            : '·';
          if(who) clashes.push({ day:day, n:t.n, cls:s.cls, who:who });
          c.addEventListener('click', function(){ openCell(day, pIdx, t.n); });
          row.appendChild(c);
        });
        grid.appendChild(row);
      });
      paintClashes(clashes);
    }

    function paintClashes(list){
      var box=document.getElementById('clashes');
      if(!list.length){ box.className='clashes'; box.innerHTML=''; return; }
      box.className='clashes show';
      box.innerHTML = '<b>تعارض في الإسناد ('+list.length+')</b>'
        + list.slice(0,3).map(function(c){
            return '<small>'+c.day+' · الحصة '+c.n+' — الصف <b>'+c.cls+'</b> مسند أيضا إلى أ. '+lastName(c.who)+'</small>';
          }).join('');
    }

    /* ===== اللوحة السفلية: المادة ← الشعبة ← حفظ فوري ← الحصة التالية ===== */
    function openCell(day, pIdx, pNo){
      /* حال الخانة **قبل** اللمس هو الذي يقرر: أهذه سلسلة إدخال أم تعديل مفرد؟
         يقرأ هنا مرة ويمرر إلى advance في كل مسارات الاعتماد. */
      var wasFilled = !!Shouba.slot(cur, day, pIdx);
      var node = document.createElement('div');

      var quick = document.createElement('div');
      quick.className='quick';
      var bFree = document.createElement('button');
      bFree.textContent = 'أفرغ الخانة';
      bFree.addEventListener('click', function(){ setSlot(day, pIdx, ''); advance(day, pIdx, wasFilled); });
      quick.appendChild(bFree);
      if(lastSlot){
        var bRep = document.createElement('button');
        bRep.className='amber';
        bRep.textContent = 'كرر: ' + lastSlot;
        bRep.addEventListener('click', function(){ setSlot(day, pIdx, lastSlot); advance(day, pIdx, wasFilled); });
        quick.appendChild(bRep);
      }
      node.appendChild(quick);

      if(!subjects.length){
        var warn=document.createElement('div');
        warn.className='sheet-note';
        warn.textContent='لا مواد لهذه الشعبة في المرجعية — تضاف من الإدارة.';
        node.appendChild(warn);
      }
      subjects.forEach(function(s){
        var g = GRADE_NO[s.grade] || s.grade;
        var b = document.createElement('button');
        b.className='sheet-opt';
        b.innerHTML='<span>'+s.name+' — '+s.grade+(s.track?' '+s.track:'')+'</span>';
        b.addEventListener('click', function(){ pickSection(day, pIdx, pNo, s.name, g, s.track, wasFilled, s.grade); });
        node.appendChild(b);
      });

      /* المخرج الصريح من الإدخال المتتابع صار «تم» اسفل كل لوحة (components.js، قاعدة الادخال 2026-09-13)
         — فحذف زر «إنهاء الإدخال» الذي كان هنا لئلا يتتابع زران بمعنى واحد */

      Shouba.sheet.open(day + ' · الحصة ' + ORD[pNo-1] + ' — أ. ' + lastName(cur), node);
    }

    /* الخطوة الثانية داخل اللوحة نفسها: رقم الشعبة — والفصل يحمل مسار المادة («11/2 ع»)،
       فلا يلتبس علمي بادبي في التعارض ولا في العرض.
       · الارقام بعدد فصول الصف ومساره (فصول مدرستك — Shouba.classCount، 2026-09-14): كانت ١–٦ ثابتة فلا يدخل الفصل ٧.
       · والمادة بلا مسار في صف ذي مسارين (الاختيار الحر: الصحة النفسية…) تعامل كسائر المواد (طلب المستخدم 2026-09-14):
         سطر للعلمي وسطر للادبي بلمسة واحدة، فتحفظ «12/3 د» — كانت «12/3» بلا رمز فعدها التعارض على المسارين */
    function pickSection(day, pIdx, pNo, subject, grade, track, wasFilled, gradeName){
      var node = document.createElement('div');
      var two = !Shouba.trackMark(track) && Shouba.twoTrackGrade(gradeName), tracks = two ? ['علمي', 'أدبي'] : [track];
      var note = document.createElement('div');
      note.className='sheet-note';
      note.textContent = subject + ' · الصف ' + grade + (Shouba.trackMark(track) ? ' ' + track : '') + (two ? ' — اختر المسار والشعبة' : ' — اختر الشعبة');
      node.appendChild(note);
      tracks.forEach(function(tr){
        if(two){ var h = document.createElement('div'); h.className = 'trk'; h.textContent = tr; node.appendChild(h); }
        var secs = document.createElement('div');
        secs.className='secs';
        for(var i=1;i<=Shouba.classCount(gradeName, tr);i++){
          (function(n){
            var b=document.createElement('button');
            b.className='secbtn'; b.textContent=n;
            b.addEventListener('click', function(){
              setSlot(day, pIdx, Shouba.joinSlot(Shouba.makeClass(grade, n, tr), subject));
              advance(day, pIdx, wasFilled);
            });
            secs.appendChild(b);
          })(i);
        }
        node.appendChild(secs);
      });
      /* لم يحدد عدد فصول هذا الصف: الارقام ١–٦ كما كانت، ومكان تحديدها */
      if(!tracks.every(function(tr){ return Shouba.classCountSet(gradeName, tr); })){
        var hn = document.createElement('div'); hn.className = 'sheet-note';
        hn.textContent = 'الأرقام ١ إلى ٦ — حدد عدد فصول مدرستك من «فصول مدرستك» أسفل الجدول.';
        node.appendChild(hn);
      }
      /* خطوة ثانية: «رجوع» في رأس اللوحة يعيد قائمة المواد (قاعدة الادخال 2026-09-13) */
      Shouba.sheet.open(day + ' · الحصة ' + ORD[pNo-1] + ' — أ. ' + lastName(cur), node, { step: true });
    }

    function setSlot(day, pIdx, val){
      var who = cur, was = Shouba.slot(who, day, pIdx);
      Shouba.setSlot(who, day, pIdx, val);     /* الكتابة والحفظ في مكان واحد */
      if(val) lastSlot = val;
      paintAll();
      /* لا حفظ صامت: الانتقال الى الحصة التالية كان يخفي ما حفظ (قاعدة الادخال 2026-09-13) */
      var where = day + ' · الحصة ' + (pIdx + 1);
      if(val) Shouba.toast('تم الحفظ: ' + val + ' — ' + where);
      else if(was) Shouba.toast('أفرغت الخانة: ' + where, function(){ Shouba.setSlot(who, day, pIdx, was); paintAll(); });
    }

    /* الإدخال المتتابع — **مشروطا بحال الخانة قبل اللمس** (قرار المستخدم 2026-09-08):
       · خانة **ممتلئة** ⟵ تعديل مفرد، فتغلق اللوحة فور الاعتماد.
       · خانة **فارغة**  ⟵ بداية سلسلة، فتفتح الحصة التالية بلا رجوع.
       فتقرأ النية من الخانة نفسها بلا سؤال ولا إعداد؛ وإدخال الجدول أول مرة
       يبقى متتابعا، والتعديل اللاحق لا يحبس المستخدم في اللوحة. */
    function advance(day, pIdx, wasFilled){
      if(wasFilled){ Shouba.sheet.close(); return; }
      var next = null;
      times.forEach(function(t){ if(!t.brk && t.n-1 > pIdx && next===null) next = t.n; });
      if(next === null){ Shouba.sheet.close(); return; }
      openCell(day, next-1, next);
    }

    /* ── فصول مدرستك (2026-09-14، طلب المستخدم): عدد فصول كل صف ومسار — يسأل عنه اول دخول للتبويب (مرة، ويقبل
       «تخط الآن» فتبقى ١–٦)، ويعدل متى شاء من سطره اسفل الجدول. العداد يحفظ مع كل لمسة، و«تم» يثبت المعروض */
    function openCounts(first){
      var rows = Shouba.classRows(), cnt = {}, node = document.createElement('div');
      if(!rows.length) return;
      Shouba.save({ classCountsAsked: true });
      rows.forEach(function(r){ cnt[Shouba.countKey(r.grade, r.track)] = Shouba.classCount(r.grade, r.track); });
      function keep(){
        var m = {}, o = Shouba.data().classCounts || {};
        Object.keys(o).forEach(function(k){ m[k] = o[k]; });
        Object.keys(cnt).forEach(function(k){ m[k] = cnt[k]; });
        Shouba.save({ classCounts: m });
        d = Shouba.data(); paintCounts();
      }
      node.className = 'counts';
      var lead = document.createElement('div'); lead.className = 'sheet-note';
      lead.textContent = (first ? 'قبل أن تبدأ: ' : '') + 'كم فصلا في كل صف في مدرستك؟ فتظهر لك أرقام الشعب بعددها عند الإدخال.';
      node.appendChild(lead);
      rows.forEach(function(r){
        var k = Shouba.countKey(r.grade, r.track), row = document.createElement('div'), lb = document.createElement('b');
        var stp = document.createElement('div'), minus = document.createElement('button'), val = document.createElement('span'), plus = document.createElement('button');
        row.className = 'crow'; stp.className = 'stp'; lb.textContent = r.label;
        minus.type = plus.type = 'button'; minus.textContent = '−'; plus.textContent = '+';
        minus.setAttribute('aria-label', 'أنقص فصول ' + r.label); plus.setAttribute('aria-label', 'زد فصول ' + r.label);
        function show(){ val.textContent = cnt[k]; minus.disabled = cnt[k] <= 1; plus.disabled = cnt[k] >= 20; }
        minus.addEventListener('click', function(){ if(cnt[k] > 1){ cnt[k]--; show(); keep(); } });
        plus.addEventListener('click', function(){ if(cnt[k] < 20){ cnt[k]++; show(); keep(); } });
        show();
        stp.appendChild(minus); stp.appendChild(val); stp.appendChild(plus);
        row.appendChild(lb); row.appendChild(stp);
        node.appendChild(row);
      });
      if(first){
        var skip = document.createElement('button');
        skip.type = 'button'; skip.className = 'btn-ghost';
        skip.textContent = 'تخط الآن — تبقى الأرقام ١ إلى ٦';
        skip.addEventListener('click', function(){ Shouba.sheet.close(); });
        node.appendChild(skip);
      }
      Shouba.sheet.open('فصول مدرستك', node, { onDone: function(){ keep(); Shouba.toast('تم الحفظ: فصول مدرستك'); return true; } });
    }
    function paintCounts(){
      var b = document.getElementById('gcls'), rows = Shouba.classRows();
      b.hidden = !rows.length;
      var any = rows.some(function(r){ return Shouba.classCountSet(r.grade, r.track); });
      b.textContent = 'فصول مدرستك — ' + (any
        ? rows.map(function(r){ return (GRADE_NO[r.grade] || r.grade) + (Shouba.trackMark(r.track) ? ' ' + Shouba.trackMark(r.track) : '') + ': ' + Shouba.classCount(r.grade, r.track); }).join(' · ')
        : 'لم تحددها بعد، والأرقام ١ إلى ٦');
    }
    document.getElementById('gcls').addEventListener('click', function(){ openCounts(false); });
    /* حصص بلا مسار (الاختيار الحر قبل 2026-09-14) — لا يخمن مسارها: تعرض ليعاد اختيار مادتها بمسارها */
    function paintUntracked(){
      var box = document.getElementById('untr'), list = Shouba.untracked().filter(function(u){ return full || u.who === cur; });
      box.className = 'untr' + (list.length ? ' show' : '');
      box.textContent = '';
      if(!list.length) return;
      var h = document.createElement('b');
      h.textContent = 'حصص بلا مسار (' + list.length + ') — المس الحصة وأعد اختيار مادتها لتحدد مسارها';
      box.appendChild(h);
      list.slice(0, 3).forEach(function(u){
        var s = document.createElement('small');
        s.textContent = 'أ. ' + lastName(u.who) + ' · ' + u.day + ' · الحصة ' + u.n + ' — ' + u.cls + ' · ' + u.subject;
        box.appendChild(s);
      });
      if(list.length > 3){ var m = document.createElement('small'); m.textContent = 'وغيرها ' + (list.length - 3); box.appendChild(m); }
    }

    function paintAll(){
      document.body.classList.toggle('gfull', full);   /* قبل الرسم: الجدول العام يقيس عرضه ظاهرا */
      paintTsel(); paintGrid(); paintCounts(); paintUntracked();
      /* العداد عن **معلميه** لا عن الشريط: رئيس الشعبة ليس من معلمي نفسه */
      var mine  = Shouba.teachers();
      var blank = mine.filter(function(t){ return filledCount(t)===0; }).length;
      if(solo){                                  /* رأس عن صاحب الجدول وحده */
        var sn = filledCount(cur);
        document.getElementById('headLine').textContent = sn
          ? Shouba.count(sn,{one:'حصة',two:'حصتان',few:'حصص',many:'حصة'}) + ' في الأسبوع'
          : 'لم يدخل جدوله بعد';
        document.getElementById('hintline').textContent =
          'اضغط أي مربع لإسناد حصة — والتغيير يحفظ فورا.';
        return;
      }
      document.getElementById('headLine').textContent =
        Shouba.count(mine.length,{one:'معلم',two:'معلمان',few:'معلمين',many:'معلما'})
        + ' · ' + (blank
            ? Shouba.count(blank,{one:'جدول',two:'جدولان',few:'جداول',many:'جدولا'}) + ' بلا إدخال'
            : 'كل الجداول مدخلة');
      /* إرشاد يتقاعد بنفسه: نصيحة البداية لمن لم يدخل شيئا، ثم طريقة العمل. */
      var anyLoad = teachers.some(function(t){ return filledCount(t) > 0; });
      document.getElementById('hintline').textContent = full
        ? 'اسحب بين الأيام أو المس اليوم فوقها · المس اسم المعلم أو حصته لعرض جدوله أو تعديله.'
        : anyLoad
        ? 'اضغط أي مربع لإسناد حصة · وبعد كل اعتماد تفتح الحصة التالية في اليوم نفسه.'
        : 'ابدأ بعمود يوم واحد لكل معلم — سبع ضغطات تكفي، وتضيء لوحتك في حينها. ثم أكمل بقية الأيام متى شئت.';
    }
    paintAll();
    /* اول دخول للتبويب: «فصول مدرستك» مرة واحدة قبل الادخال */
    if(!d.classCountsAsked && Shouba.classRows().length) setTimeout(function(){ openCounts(true); }, 350);
  }

  /* التنقل من الشريط السفلي */
  [].forEach.call(document.querySelectorAll('.tab[data-go]'), function(b){
    b.addEventListener('click', function(){ location.href = b.dataset.go; });
  });
  /* الرجوع يعود من حيث جئت: من ملف المعلم إليه، ومن التبويب إلى اللوحة.
     ⚠ مستمع واحد لا onclick فوقه — اجتماعهما ينفذ السلوكين فيغلب الأخير. */
  /* كان مشروطا: في وضع المفرد يرجع إلى ملف المعلم، وإلا إلى اللوحة.
     صار منزلا واحدا يعيد إلى اللوحة دائما — والشرط هو الذي أربك المستخدم:
     زر واحد بمقصدين. وتبويب «المعلمون» في الشريط السفلي يكفي للرجوع
     إلى القائمة. ويتولاه bindHome في الطبقة المشتركة. */
  document.getElementById('add').addEventListener('click', Shouba.quickAdd);
</script>
</body>
