<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · الإعداد · العام الدراسي</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#16456E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="/identity/assets/app-icon-approved.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/identity/tokens.css" />
<link rel="stylesheet" href="/shell.css" />
<link rel="stylesheet" href="/components.css" />
<link rel="stylesheet" href="/frame.css" />
<!-- كل التخطيط من الأساس (shell + components) — لا أنماط خاصّة لهذه الشاشة -->
</head>
<body class="framed">
 <div class="device"><div class="viewport">
  <div class="screen has-foot">
    <div class="navrow">
      <div class="brand">
        <img src="/identity/assets/logo-vec-color.svg" alt="شعبة" />
        <span class="vsep"></span>
        <div class="prog">
          <div class="lbl">إعداد الشعبة · <b>خطوة <span class="num">٣</span> من <span class="num">٤</span></b></div>
          <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
        </div>
      </div>
      <div class="back" onclick="history.back()">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M8 4 L14 10 L8 16" stroke="#5F5648" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div class="content center">
    <div class="head">
      <div class="h">عامك الدراسي</div>
      <div class="s">عليهما تُبنى سجلّاتك وأرشيفك — ويبدأ كل عام جديد بمعلّميك وسجلّاتك جاهزة.</div>
    </div>

    <form class="fields" autocomplete="off" onsubmit="return false">
      <!-- العام الدراسي -->
      <div class="field">
        <label>العام الدراسي</label>
        <div class="sdrop" data-label="العام الدراسي">
          <button type="button" class="trigger">
            <span class="val ph">اختر العام</span>
            <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M5 8 L10 13 L15 8" stroke="#8A7F6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <select id="year"><option value="" disabled selected hidden>اختر العام</option></select>
        </div>
      </div>

      <!-- الفصل الدراسي -->
      <div class="field">
        <label>الفصل الدراسي</label>
        <div class="segs" id="segs"></div>
      </div>
    </form>
    </div><!-- /content -->
  </div>

  <div class="foot">
    <button class="cta" id="next" disabled>التالي</button>
  </div>
 </div></div>

<script src="/refdata.js"></script>
<script src="/components.js"></script>
<script>
  var KEY = 'shouba.setup', R = window.SHOUBA_REF;
  var RET_REVIEW = new URLSearchParams(location.search).get('ret') === 'review';
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(patch){ var d = load(); Object.assign(d, patch); localStorage.setItem(KEY, JSON.stringify(d)); }

  var yearSel = document.getElementById('year');
  var segs    = document.getElementById('segs');
  var next    = document.getElementById('next');
  var state   = { term: '' };

  var TICK = '<span class="tick"><svg width="11" height="11" viewBox="0 0 12 12" fill="none">'
           + '<path d="M2 6.4 L4.6 9 L10 3" stroke="#F4F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

  // العام الدراسي — من البيانات المرجعية
  R.years.forEach(function(y){
    var op = document.createElement('option'); op.textContent = y; yearSel.appendChild(op);
  });

  // الفصل الدراسي — أزرار مقطعية من البيانات المرجعية
  R.terms.forEach(function(t){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'seg'; b.dataset.val = t;
    b.innerHTML = TICK + t;
    b.addEventListener('click', function(){
      state.term = t;
      [].forEach.call(segs.children, function(x){ x.classList.toggle('on', x === b); });
      validate();
    });
    segs.appendChild(b);
  });

  function validate(){
    var ok = !!(yearSel.value && state.term);
    next.disabled = !ok;
    return ok;
  }

  yearSel.addEventListener('change', validate);   // تُطلَق من اللوحة السفلية

  // استرجاع ما أُدخل سابقاً (components.js يعرض نصّ المنسدلة تلقائياً من selected)
  (function prefill(){
    var s = load();
    if(s.year){ yearSel.value = s.year; }
    if(s.term){
      state.term = s.term;
      [].forEach.call(segs.children, function(b){ b.classList.toggle('on', b.dataset.val === s.term); });
    }
    validate();
  })();

  next.addEventListener('click', function(){
    if(!validate()) return;
    save({ year: yearSel.value, term: state.term });
    // ret=review: قادم من شاشة المراجعة لتعديل سطر ⟵ يعود إليها بعد الحفظ
    location.href = RET_REVIEW ? '/setup-review.html' : '/setup-wizard-4.html';
  });
</script>
</body>
</html>
