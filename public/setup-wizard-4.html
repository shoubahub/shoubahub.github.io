<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · الإعداد · الإشراف</title>
<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#EFE6D6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="identity/assets/app-icon-approved.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="identity/tokens.css?v=13" />
<link rel="stylesheet" href="shell.css?v=13" />
<link rel="stylesheet" href="components.css?v=13" />
<link rel="stylesheet" href="frame.css?v=13" />
<!-- كل التخطيط من الأساس (shell + components) — لا أنماط خاصّة لهذه الشاشة -->
</head>
<body class="framed">
 <div class="device"><div class="viewport">
  <div class="screen has-foot">
    <div class="navrow">
      <div class="brand">
        <img src="identity/assets/logo-vec-color.svg" alt="شعبة" />
        <span class="vsep"></span>
        <div class="prog">
          <div class="lbl">إعداد الشعبة · <b>خطوة <span class="num">٤</span> من <span class="num">٤</span></b></div>
          <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
        </div>
      </div>
      <div class="back" onclick="history.back()">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M8 4 L14 10 L8 16" stroke="#5F5648" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <!-- العنوان خارج .content — موضعه ثابت في كل الشاشات (قاعدة LAYOUT) -->
    <div class="head">
      <div class="h">مَن يُشرف على شعبتك</div>
      <div class="s">اسمان يُطبعان في تذييل نماذجك الرسمية — لك تخطّيهما الآن وإكمالهما متى شئت من الإعدادات.</div>
    </div>

    <div class="content center">
    <form class="fields" autocomplete="off" onsubmit="return false">
      <!-- مدير المدرسة -->
      <div class="field">
        <label for="principal">مدير مدرستك</label>
        <div class="paper">
          <input id="principal" type="text" placeholder="اكتب الاسم" maxlength="60" />
        </div>
        <div class="hint"><b>اختياري</b> · كما يُكتب في توقيع النماذج الرسمية.</div>
      </div>

      <!-- الموجّه الفني -->
      <div class="field">
        <label for="supervisor">موجّهك الفنّي</label>
        <div class="paper">
          <input id="supervisor" type="text" placeholder="اكتب الاسم" maxlength="60" />
        </div>
        <div class="hint"><b>اختياري</b> · موجّه تخصّصك، لا موجّه المدرسة.</div>
      </div>
    </form>
    </div><!-- /content -->
  </div>

  <div class="foot">
    <button class="cta" id="next">تخطّي الآن</button>
  </div>
 </div></div>

<script src="components.js?v=13"></script>
<script>
  var KEY = 'shouba.setup';
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(patch){ var d = load(); Object.assign(d, patch); localStorage.setItem(KEY, JSON.stringify(d)); }

  var principal  = document.getElementById('principal');
  var supervisor = document.getElementById('supervisor');
  var next       = document.getElementById('next');

  // الحقلان اختياريان — الزرّ مفتوح دائماً، ونصّه يوضّح أثر تركهما فارغين
  function refresh(){
    var any = principal.value.trim() || supervisor.value.trim();
    next.textContent = any ? 'التالي' : 'تخطّي الآن';
  }

  // استرجاع ما أُدخل سابقاً
  (function prefill(){
    var s = load();
    if(s.principal)  principal.value  = s.principal;
    if(s.supervisor) supervisor.value = s.supervisor;
    refresh();
  })();

  principal.addEventListener('input', refresh);
  supervisor.addEventListener('input', refresh);

  next.addEventListener('click', function(){
    save({ principal: principal.value.trim(), supervisor: supervisor.value.trim() });
    // بعد ش④ تأتي مراجعة المنتصف — وإن كان التعديل قادماً من المراجعة النهائية عاد إليها
    location.href = Shouba.returnTo() || 'setup-review.html';
  });
</script>
</body>
</html>
