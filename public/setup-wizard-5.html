<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · الإعداد · معلّمو الشعبة</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#EFE6D6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="/identity/assets/app-icon-approved.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/identity/tokens.css" />
<link rel="stylesheet" href="/shell.css" />
<link rel="stylesheet" href="/components.css" />
<link rel="stylesheet" href="/frame.css" />
<style>
  /* خاص بهذه الشاشة فقط: صفّ الإضافة (حقل + زرّ) وحرفا المعلّم — لا هيكل ولا هوامش عامّة */
  .addrow{display:flex;gap:12px;align-items:stretch}
  .addrow .paper{flex:1}
  .addbtn{flex:none;width:54px;border:0;border-radius:var(--r-input);cursor:pointer;background:var(--shouba-navy);
    display:grid;place-items:center;box-shadow:0 3px 0 rgba(12,38,62,.55), 0 8px 16px rgba(20,50,80,.22)}
  .addbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(12,38,62,.55)}
  .addbtn[disabled]{background:#D9CCB2;box-shadow:0 2px 0 rgba(190,172,140,.6);cursor:not-allowed}
  .addbtn[disabled]:active{transform:none}
  .count{font-size:12px;font-weight:700;color:var(--shouba-label)}
  .ini{width:38px;height:38px;border-radius:999px;flex:none;display:grid;place-items:center;background:var(--shouba-navy);
    color:var(--shouba-cream);font-size:13px;font-weight:700}
  .del{width:34px;height:34px;border-radius:12px;flex:none;border:0;cursor:pointer;display:grid;place-items:center;
    background:linear-gradient(180deg,#FBF7EE 0%,#F3ECDE 100%);box-shadow:0 2px 0 rgba(190,172,140,.5)}
  .del:active{transform:translateY(1px)}
  .empty{font-size:12.5px;color:var(--shouba-hint);padding:2px}
  .warn{font-size:12px;font-weight:600;color:var(--shouba-error)}
  .hide{display:none !important}
</style>
</head>
<body class="framed">
 <div class="device"><div class="viewport">
  <div class="screen has-foot">
    <div class="navrow">
      <div class="brand">
        <img src="/identity/assets/logo-vec-color.svg" alt="شعبة" />
        <span class="vsep"></span>
        <div class="prog">
          <div class="lbl">محتوى الشعبة · <b>خطوة <span class="num">١</span> من <span class="num">٣</span></b></div>
          <div class="dots"><i class="on"></i><i></i><i></i></div>
        </div>
      </div>
      <div class="back" onclick="history.back()">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M8 4 L14 10 L8 16" stroke="#5F5648" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <!-- العنوان خارج .content — موضعه ثابت في كل الشاشات (قاعدة LAYOUT) -->
    <div class="head">
      <div class="h">معلّمو الشعبة</div>
      <div class="s">أضِف أسماءهم الآن فقط — وجداولهم وبياناتهم تُكمَّل لاحقاً من ملفّ كل معلّم.</div>
    </div>

    <div class="content">
      <div class="fields">
        <!-- صفّ الإضافة -->
        <div class="field">
          <label for="tname">اسم المعلّم</label>
          <div class="addrow">
            <div class="paper">
              <input id="tname" type="text" placeholder="اكتب الاسم ثم أضِف" maxlength="60" />
            </div>
            <button type="button" class="addbtn" id="add" disabled aria-label="أضِف المعلّم">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 4 V16 M4 10 H16" stroke="#F4F1EA" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="hint" id="msg">اكتب الاسم الرباعي إن أمكن — كما يُكتب في النماذج الرسمية.</div>
        </div>

        <!-- القائمة -->
        <div class="field">
          <label id="count" class="count">لم تُضِف معلّماً بعد</label>
          <div class="stack" id="list"></div>
          <div class="empty" id="empty">تظهر هنا أسماء معلّميك بمجرّد إضافتهم.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">
    <button class="cta" id="next">تخطّي الآن</button>
  </div>
 </div></div>

<script src="/components.js"></script>
<script>
  var KEY = 'shouba.setup';
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(patch){ var d = load(); Object.assign(d, patch); localStorage.setItem(KEY, JSON.stringify(d)); }

  var input = document.getElementById('tname');
  var addBtn= document.getElementById('add');
  var listEl= document.getElementById('list');
  var countEl=document.getElementById('count');
  var emptyEl=document.getElementById('empty');
  var msgEl = document.getElementById('msg');
  var next  = document.getElementById('next');
  var HINT  = msgEl.textContent;

  var teachers = (load().teachers || []).slice();

  /* اللقب لا يُخزَّن — يُنزع من المُدخَل ويُضاف عند العرض فلا يتكرّر «أ. أ.»
     ⚠ الحرف المفرد يُنزع **بشرط النقطة** («أ.» لقب · «أحمد» اسم)، واللقب التامّ بشرط مسافة بعده. */
  function stripTitle(n){
    return n.replace(/^\s*(?:[أاد]\s*\.\s*|(?:الأستاذ|أستاذ|الدكتور|دكتور)\s+)/, '').trim();
  }
  function clean(n){ return stripTitle(String(n||'').replace(/\s+/g,' ').trim()); }

  /* حرف واحد فقط — أوّل الاسم الأول (قرار المستخدم 2026-08-16):
     الحرفان قد يكوّنان كلمة ذات معنى سيّئ بالمصادفة؛ والحرف المفرد يمنع ذلك من أصله.
     والتمييز الحقيقي بالاسم المجاور — وظيفة الدائرة إيقاع بصري لا تعريف. */
  function initial(name){
    var first = name.split(' ').filter(Boolean)[0] || '';
    return first.charAt(0);
  }

  var DEL = '<svg width="15" height="15" viewBox="0 0 20 20" fill="none">'
          + '<path d="M5 5 L15 15 M15 5 L5 15" stroke="#8A7F6E" stroke-width="2" stroke-linecap="round"/></svg>';

  function render(){
    listEl.innerHTML = '';
    teachers.forEach(function(name, i){
      var row = document.createElement('div');
      row.className = 'pick';
      row.innerHTML = '<span class="ini"></span><div class="tx"><b></b></div>'
                    + '<button type="button" class="del" aria-label="احذف">' + DEL + '</button>';
      row.querySelector('.ini').textContent = initial(name);
      row.querySelector('b').textContent = 'أ. ' + name;
      row.querySelector('.del').addEventListener('click', function(){
        teachers.splice(i, 1); persist(); render();
      });
      listEl.appendChild(row);
    });

    var n = teachers.length;
    countEl.textContent = n === 0 ? 'لم تُضِف معلّماً بعد'
                        : Shouba.count(n, { one:'معلّم', two:'معلّمان', few:'معلّمين', many:'معلّماً' });
    emptyEl.classList.toggle('hide', n > 0);
    /* تُفتح هذه الشاشة من اللوحة أيضاً (ret=board) — فالزرّ يصرّح بوجهته لا يقول «التالي» */
    next.textContent = Shouba.returnTo() === '/board.html' ? 'عودة إلى اللوحة'
                     : n > 0 ? 'التالي' : 'تخطّي الآن';
  }

  function persist(){ save({ teachers: teachers }); }

  function addName(){
    var name = clean(input.value);
    if(!name) return;
    // حارس التكرار: الاسم الكامل المطابق لا يُضاف مرّتين
    if(teachers.some(function(t){ return t === name; })){
      msgEl.textContent = 'هذا الاسم مُضاف بالفعل.';
      msgEl.className = 'warn';
      return;
    }
    teachers.push(name);
    input.value = '';
    msgEl.textContent = HINT; msgEl.className = 'hint';
    persist(); render(); validate();
    input.focus();
  }

  function validate(){ addBtn.disabled = clean(input.value).length < 2; }

  input.addEventListener('input', function(){
    if(msgEl.className === 'warn'){ msgEl.textContent = HINT; msgEl.className = 'hint'; }
    validate();
  });
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); addName(); } });
  addBtn.addEventListener('click', addName);

  next.addEventListener('click', function(){
    persist();
    // ret=review: قادم من شاشة المراجعة لتعديل سطر ⟵ يعود إليها بعد الحفظ
    location.href = Shouba.returnTo() || '/setup-wizard-6.html';   // ش⑥ شكل السجلات — تُبنى تالياً
  });

  render(); validate();
</script>
</body>
</html>
