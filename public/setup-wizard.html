<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · معالج الإعداد</title>
<!-- PWA / إحساس التطبيق عند الإضافة للشاشة الرئيسية -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#EFE6D6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="identity/assets/app-icon-approved.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="identity/tokens.css?v=56" />
<link rel="stylesheet" href="shell.css?v=56" />
<link rel="stylesheet" href="components.css?v=56" />
<link rel="stylesheet" href="frame.css?v=56" />
<!-- كل التخطيط من الأساس (shell + components) — لا أنماط خاصة لهذه الشاشة -->
</head>
<body class="framed">
 <div class="device"><div class="viewport">
  <div class="screen has-foot">
    <div class="navrow">
      <div class="brand">
        <img src="identity/assets/logo-vec-color.svg" alt="شعبة" />
        <span class="vsep"></span>
        <div class="prog">
          <div class="lbl">إعداد الشعبة · <b>خطوة <span class="num">١</span> من <span class="num">٤</span></b></div>
          <div class="dots"><i class="on"></i><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="back" onclick="history.back()">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M8 4 L14 10 L8 16" stroke="#5F5648" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <!-- العنوان خارج .content — موضعه ثابت في كل الشاشات (قاعدة LAYOUT) -->
    <div class="head">
      <div class="h" data-hi>أنشئ شعبتك</div>
      <div class="s">لنبدأ بإنشاء شعبتك — مدرستك أولا، ثلاث معلومات فقط.</div>
    </div>

    <div class="content center">
    <form class="fields" id="f1" autocomplete="off" onsubmit="return false">
      <!-- المنطقة -->
      <div class="field">
        <label>المنطقة التعليمية</label>
        <div class="sdrop" data-label="المنطقة التعليمية">
          <button type="button" class="trigger">
            <span class="val ph">اختر المنطقة</span>
            <span class="chev"><svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M5 8 L10 13 L15 8" stroke="#8A7F6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <select id="region" required>
            <option value="" disabled selected hidden>اختر المنطقة</option>
            <option>العاصمة</option><option>حولي</option><option>الفروانية</option>
            <option>الأحمدي</option><option>الجهراء</option><option>مبارك الكبير</option>
            <option>التعليم الخاص</option><option>التعليم الديني</option><option>التربية الخاصة</option>
          </select>
        </div>
      </div>

      <!-- نوع المدرسة -->
      <div class="field">
        <label>نوع المدرسة</label>
        <div class="segs" id="segs">
          <button type="button" class="seg" data-val="بنين">
            <span class="tick"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6.4 L4.6 9 L10 3" stroke="#F4F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            بنين
          </button>
          <button type="button" class="seg" data-val="بنات">
            <span class="tick"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6.4 L4.6 9 L10 3" stroke="#F4F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            بنات
          </button>
        </div>
      </div>

      <!-- اسم المدرسة -->
      <div class="field">
        <label for="school">اسم المدرسة</label>
        <div class="paper">
          <input id="school" type="text" placeholder="اكتب اسم المدرسة" maxlength="60" />
        </div>
      </div>

      <!-- شعار المدرسة أو رمز الشعبة — بعد اسم المدرسة · اختياري · للواجهة فقط
           (ترويسات النماذج الرسمية لها إعداداتها الخاصة لاحقا — قرار المستخدم) -->
      <div class="field">
        <label>شعار مدرستك أو رمز شعبتك</label>
        <div class="crestpick">
          <button type="button" class="crest" id="crestBtn" aria-label="اختر شعارا"></button>
          <div class="cap"><b>اختياري</b> · اضغط للاختيار أو لرفع شعار مدرستك</div>
        </div>
      </div>
    </form>
      <!-- قابلية النقل (2026-09-10): من معه ملف شعبة لا يعيد الإعداد من أوله -->
      <div class="impentry"><span>عندك ملف شعبة محفوظ؟</span><button type="button" class="linkbtn" id="importFile">استورده</button></div>
    </div><!-- /content -->
  </div>

  <div class="foot">
    <button class="cta" id="next" disabled>التالي</button>
  </div>
 </div></div>

<script src="icons.js?v=56"></script>
<script src="build.js?v=56"></script>
<script src="refdata.js?v=56"></script>
<script src="derive.js?v=56"></script>
<script src="components.js?v=56"></script>
<script>
  var KEY = 'shouba.setup';
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(patch){ var d = load(); Object.assign(d, patch); localStorage.setItem(KEY, JSON.stringify(d)); }

  var region = document.getElementById('region');
  var school = document.getElementById('school');
  var segs   = document.getElementById('segs');
  var next   = document.getElementById('next');
  var state  = { schoolType: '' };

  // استرجاع ما أدخل سابقا (components.js يعرض نص المنسدلة تلقائيا من selected)
  var saved = load();
  if(saved.region){ region.value = saved.region; }
  if(saved.schoolName){ school.value = saved.schoolName; }
  if(saved.schoolType){
    state.schoolType = saved.schoolType;
    [].forEach.call(segs.children, function(b){ b.classList.toggle('on', b.dataset.val === saved.schoolType); });
  }

  function validate(){
    var ok = region.value && state.schoolType && school.value.trim().length > 0;
    next.disabled = !ok;
    return ok;
  }

  region.addEventListener('change', validate);   // تطلق من اللوحة السفلية
  school.addEventListener('input', validate);
  [].forEach.call(segs.children, function(b){
    b.addEventListener('click', function(){
      state.schoolType = b.dataset.val;
      [].forEach.call(segs.children, function(x){ x.classList.toggle('on', x === b); });
      validate();
    });
  });

  next.addEventListener('click', function(){
    if(!validate()) return;
    save({ region: region.value, schoolType: state.schoolType, schoolName: school.value.trim() });
    // ret=review: قادم من شاشة المراجعة لتعديل سطر ⟵ يعود إليها بعد الحفظ
    location.href = Shouba.returnTo() || 'setup-wizard-2.html';
  });

  validate();

  /* ===== شعار المدرسة أو رمز الشعبة — اختياري، للواجهة فقط =====
     (ترويسات النماذج الرسمية لها إعداداتها الخاصة لاحقا — قرار المستخدم 2026-08-20) */
  var crestBtn = document.getElementById('crestBtn');
  var DEFAULT_CREST = 'identity/assets/school-crest-default.svg';

  function paintCrest(){
    var c = load().crest;
    if(c && c.type === 'image'){ crestBtn.innerHTML = '<img src="' + c.data + '" alt="شعار المدرسة" />'; }
    else if(c && c.type === 'icon'){ crestBtn.innerHTML = SHOUBA_ICONS.svg(c.id, 38); }
    else { crestBtn.innerHTML = '<img src="' + DEFAULT_CREST + '" alt="شعار افتراضي" style="width:46px;height:46px;object-fit:contain" />'; }
  }

  /* يصغر الصورة المرفوعة إلى ٢٥٦px — مخزن المتصفح محدود، والتصغير شرط ألا ينكسر الحفظ.
     ⚠ عيبان أصلحا (2026-09-06، رصدهما المستخدم على شعار مدرسته):
     ① كانت اللوحة **شفافة**، وأكثر الشعارات PNG بخلفية شفافة — فيظهر الكحلي
        من خلفها في الرأس فتبدو باهتة كأن خلفيتها سحبت. الآن **تملأ بالأبيض**
        كما صمم الشعار أصلا على الورق.
     ② وكانت تقتص مربعا من الوسط، والشعارات نادرا ما تكون مربعة — فتقص
        أطرافها. الآن **تحتوى كاملة** داخل المربع بلا قص. */
  /* نقلت الى components.js (Shouba.shrinkImage) ليستعملها شعار المطبوعات كذلك — مصدر واحد للقاعدة */
  function shrink(file, cb){ Shouba.shrinkImage(file, 256, cb); }

  crestBtn.addEventListener('click', function(){
    var cur = load().crest || {};
    var wrap = document.createElement('div');
    wrap.className = 'stack';

    /* ① خيار الرفع — صف كامل العرض في الأعلى، متميز عن الرموز لا واحدا منها */
    var up = document.createElement('button');
    up.type = 'button'; up.className = 'btn-ghost wupload';
    up.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24">'
      + '<path fill="#16456E" d="M12 3.4 17 8.6h-3.4v6.2h-3.2V8.6H7z"/>'
      + '<path fill="#E8A33D" d="M4.4 17.2h15.2v3.2H4.4z"/></svg>'
      + 'ارفع شعار مدرستك من جهازك';
    up.addEventListener('click', function(){
      var f = document.createElement('input');
      f.type = 'file'; f.accept = 'image/*';
      f.addEventListener('change', function(){
        if(!f.files || !f.files[0]) return;
        shrink(f.files[0], function(dataUrl){
          save({ crest: { type:'image', data: dataUrl } });
          paintCrest(); Shouba.sheet.close();
        });
      });
      f.click();
    });
    wrap.appendChild(up);

    /* ② فاصل ثم شبكة الرموز */
    var note = document.createElement('div');
    note.className = 'sheet-note';
    note.textContent = 'أو اختر رمزا لشعبتك';
    wrap.appendChild(note);

    var grid = document.createElement('div');
    grid.className = 'icongrid';
    SHOUBA_ICONS.list.forEach(function(it){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'icell' + (cur.type === 'icon' && cur.id === it.id ? ' on' : '');
      b.innerHTML = SHOUBA_ICONS.svg(it.id, 26) + '<span>' + it.label + '</span>';
      b.addEventListener('click', function(){
        save({ crest: { type:'icon', id: it.id } });
        paintCrest(); Shouba.sheet.close();
      });
      grid.appendChild(b);
    });
    wrap.appendChild(grid);

    /* ③ الإزالة — صف كامل العرض في الأسفل */
    var clr = document.createElement('button');
    clr.type = 'button'; clr.className = 'btn-ghost';
    clr.textContent = 'بلا شعار — أعد الافتراضي';
    clr.addEventListener('click', function(){
      var d2 = load(); delete d2.crest; localStorage.setItem(KEY, JSON.stringify(d2));
      paintCrest(); Shouba.sheet.close();
    });
    wrap.appendChild(clr);

    Shouba.sheet.open('شعار مدرستك أو رمز شعبتك', wrap);
  });

  paintCrest();
</script>
<script>
  /* الاستيراد من أول شاشة: الملف يحمل setupDone فيذهب الموجه إلى اللوحة */
  document.getElementById('importFile').addEventListener('click', function(){
    Shouba.importData(function(){ location.href = 'index.html'; });
  });
</script>
</body>
</html>
