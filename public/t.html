<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<!-- الصفحة على /t/<الرمز>: الأصول من جذر المنصة، وأداة الختم تبصمها بلا «/» أولى كسائر الشاشات -->
<base href="/" />
<title>شعبة · إشعاراتي</title>
<meta name="theme-color" content="#1B5183" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="identity/assets/app-icon-approved.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="identity/tokens.css?v=133" />
<link rel="stylesheet" href="shell.css?v=133" />
<link rel="stylesheet" href="components.css?v=133" />
<link rel="stylesheet" href="frame.css?v=133" />
<style>
  /* صفحة المعلم (2026-11-06، طلب المستخدم: «رابط لمعلمي الشعبة يتيح من خلاله اشعارات الجدول») — tpush.js.
     يفتحها المعلم برابطه الخاص بلا حساب: لا تقرأ وثيقة الشعبة ولا مخزن الجهاز، وكل ما فيها من api/t/<الرمز>.
     وعناصرها عناصر «حسابك» نفسها (عنوان .part · نص .lead2 · زر .btn-ghost · رسالة .msg · بطاقات .pick) */
  .wrap{display:flex;flex-direction:column;gap:22px;padding:16px var(--gap-side) 0}
  .part{font-size:14px;font-weight:700;color:var(--shouba-navy);margin-bottom:-8px}
  .msg{font-size:12.5px;font-weight:600;min-height:18px;color:var(--shouba-error);line-height:1.7}
  .msg.ok{color:var(--shouba-navy)}
  .msg:empty{display:none}
  .lead2{font-size:13px;font-weight:500;color:var(--shouba-text-muted);line-height:1.8;margin:0}
  .lead2 b{color:var(--shouba-navy);font-weight:700}
  .num{font-family:var(--font-num)}
  [hidden]{display:none !important}
</style>
</head>
<body class="framed">
 <div class="device"><div class="viewport">
  <div class="topbar">
    <div class="tbcrest"><img src="identity/assets/logo-vec-dark.svg" alt="شعبة" style="object-fit:contain;padding:5px" /></div>
    <div class="tt">
      <b id="tName">إشعاراتي</b>
      <span id="tLine">شعبة</span>
    </div>
  </div>

  <div class="screen has-topbar">
    <div class="content">
      <div class="wrap" id="wrap">
        <div class="msg" id="loadMsg">جار التحميل…</div>
      </div>
    </div>
  </div>
 </div></div>

<script src="t-notify.js?v=133"></script>
<script>
(function(){
  var T = window.TNotify, el = T.el;
  var wrap = document.getElementById('wrap'), loadMsg = document.getElementById('loadMsg');
  function say(m, t){ m.textContent = t || ''; }

  T.load().then(function(r){
    /* الرابط الباطل او المبطل ليس خطأ من المعلم — فلا لون خطأ: عنوان ونص بعناصر الصفحة (المطوّر البصري 2026-11-06) */
    if (r.status === 404) {
      loadMsg.remove();
      wrap.appendChild(el('div', 'part', 'هذا الرابط لم يعد يعمل'));
      wrap.appendChild(el('p', 'lead2', 'اطلب من رئيس الشعبة رابطاً جديداً.'));
      return;
    }
    if (!r.ok) { say(loadMsg, 'تعذر الوصول إلى الخادم — أعد فتح الصفحة بعد قليل.'); return; }
    var P = r.j; loadMsg.remove();
    document.getElementById('tName').textContent = 'أ. ' + P.name;
    document.getElementById('tLine').textContent = P.department ? 'شعبة ' + P.department : 'شعبة';
    document.title = 'شعبة · إشعارات أ. ' + P.name;
    T.mount(wrap, P);
  }).catch(function(){ say(loadMsg, 'لا اتصال — افتح الصفحة حين تتصل بالإنترنت.'); });
})();
</script>
</body>
</html>
