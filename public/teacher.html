<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · ملف المعلم</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1B5183" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="identity/assets/app-icon-approved.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="identity/tokens.css?v=146" />
<link rel="stylesheet" href="shell.css?v=146" />
<link rel="stylesheet" href="components.css?v=146" />
<link rel="stylesheet" href="frame.css?v=146" />
<style>
  .wrap{display:flex;flex-direction:column;gap:14px;padding-top:14px}
  .rm{padding:0 var(--gap-side)}
  /* و«ألغِ جهازه المقبول» في لوحة الرابط بالأسلوب نفسه (المطوّر البصري 2026-11-08) */
  .rm button, .rmdev{width:100%;border:0;cursor:pointer;font-family:var(--font-ar);font-size:13px;font-weight:700;
    color:var(--shouba-error);background:rgba(183,68,58,.08);border-radius:14px;padding:13px}
</style>
</head>
<body class="framed">
 <div class="device"><div class="viewport">
    <div class="topbar">
      <div class="tbcrest" id="tbCrest"></div>
      <div class="tt">
        <b id="tName">—</b>
        <span id="tLine">—</span>
      </div>
      <div class="iconbtn" id="back" data-home title="اللوحة">
        
      </div>
    </div>

  <div class="screen has-topbar has-tabbar">
    <div class="content">
      <div class="wrap">
        <div class="vlist" id="entries"></div>
        <div class="rm"><button id="remove">إزالة المعلم من شعبتك</button></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab" data-go="board.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 8.4 10 3l7 5.4V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      اللوحة
    </button>
    <button class="tab on" data-go="teachers.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M4 17c0-3 2.7-4.6 6-4.6S16 14 16 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      المعلمون
    </button>
    <button class="tab-add" id="add" aria-label="إضافة">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><path d="M10 4 V16 M4 10 H16" stroke="#241D06" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
    <button class="tab" data-go="records.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 3h7l3 3v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 9h6M7 12.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      سجلاتك
    </button>
    <button class="tab" data-go="schedule.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="3.5" y="4.5" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 8.5h13M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      الجدول
    </button>
  </div>
 </div></div>

<script src="build.js?v=146"></script>
<script src="refdata.js?v=146"></script>
<script src="rec-templates.js?v=146"></script>
<script src="rec-engine.js?v=146"></script>
<script src="derive.js?v=146"></script>
<script src="icons.js?v=146"></script>
<script src="components.js?v=146"></script>
<script>
  var d = Shouba.data();
  /* الاسم من الرابط ينظف كالبيانات: رابط قديم مشكول يبقى يجد معلمه (2026-09-11) */
  var T = Shouba.plain(new URLSearchParams(location.search).get('t') || '');

  (function paintTopCrest(){
    var el=document.getElementById('tbCrest'), c=d.crest;
    if(c && c.type==='image') el.innerHTML='<img src="'+c.data+'" alt="شعار المدرسة" />';
    else if(c && c.type==='icon' && window.SHOUBA_ICONS) el.innerHTML=SHOUBA_ICONS.svg(c.id,22);
    else el.innerHTML='<img src="identity/assets/logo-vec-dark.svg" alt="شعبة" style="object-fit:contain;padding:5px" />';
  })();

  /* اسم غير موجود ⟵ لا نعرض ملفا فارغا بل نعيده إلى القائمة */
  if(!T || Shouba.teachers().indexOf(T) === -1){ location.replace('teachers.html'); }

  var load = Shouba.loadOf(T), subs = Shouba.subjectsOfTeacher(T);
  document.getElementById('tName').textContent = 'أ. ' + Shouba.shortName(T);
  document.getElementById('tLine').textContent =
    (load ? Shouba.count(load,{one:'حصة',two:'حصتان',few:'حصص',many:'حصة'}) : 'بلا جدول')
    + ' · ' + (d.department || 'شعبتك');

  var entries = document.getElementById('entries');
  function entry(title, val, soon, onClick){
    var b = document.createElement('button');
    b.className = 'entry' + (soon ? ' soon' : '');
    b.innerHTML = '<b>' + title + '</b><span class="val">' + val + '</span><span class="chev">‹</span>';
    b.addEventListener('click', onClick);
    entries.appendChild(b);
  }

  /* ① المواد — مشتقة من جدوله، بلا إدخال */
  entry('المواد التي يدرسها',
        subs.length ? Shouba.count(subs.length,{one:'مادة',two:'مادتان',few:'مواد',many:'مادة'}) : 'لا شيء',
        false, function(){
    var n = document.createElement('div');
    n.className = 'vlist'; n.style.padding = '0';
    if(!subs.length){
      var e = document.createElement('div'); e.className = 'soon-note';
      e.textContent = 'تظهر مواده تلقائيا بمجرد إدخال جدوله — لا تحتاج إدخالا منفصلا.';
      n.appendChild(e);
    }
    subs.forEach(function(s){
      var r = document.createElement('div'); r.className = 'subrow';
      r.innerHTML = '<b>' + s.name + '</b><span class="cls">' + s.classes.join(' · ') + '</span>'
                  + '<span class="pc">' + Shouba.count(s.periods,{one:'حصة',two:'حصتان',few:'حصص',many:'حصة'}) + '</span>';
      n.appendChild(r);
    });
    Shouba.sheet.open('مواد أ. ' + Shouba.shortName(T), n);
  });

  /* ② جدوله — يفتح شاشة الجداول عليه مباشرة */
  entry('جدوله الدراسي',
        load ? Shouba.count(load,{one:'حصة',two:'حصتان',few:'حصص',many:'حصة'}) : 'لم يدخل',
        false, function(){ location.href = 'schedule.html?t=' + encodeURIComponent(T); });

  /* ②ب رابط إشعاراته (2026-11-06، طلب المستخدم: «رابط لمعلمي الشعبة يتيح من خلاله اشعارات الجدول») — tpush.js.
     رابط خاص به بلا حساب: يفعّل منه على هاتفه تنبيهات حصصه ورسائلك. والبوابة سؤال الخادم نفسه
     (/api/tpush/links: ٢٠٠ مفعلة · ٤٠٤ لا) — فمن خارج التجربة لا يرى البند اصلا.
     ⚠ يوضع البند في مكانه بعد «جدوله» ولو وصل جواب الخادم متاخرا */
  var linkSlot = document.createElement('div'); linkSlot.style.display = 'contents';
  entries.appendChild(linkSlot);
  (function teacherLink(){
    var L = null;
    function tapi(method, url, body){
      return fetch(url, { method: method, credentials: 'same-origin', cache: 'no-store',
        headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok: r.ok, status: r.status, j: j }; }); });
    }
    function urlOf(){ return location.origin + '/t/' + L.token; }
    /* الحال (2026-11-08، القبول): طلب ينتظرك · الجهاز المقبول · لم يفتح بعد */
    function valText(){
      if (!L) return 'لم ينشأ';
      if (L.pending && L.pending.length) return 'طلب ينتظرك';
      if (L.device) return (L.devices ? 'مفعّل على ' : 'مقبول: ') + L.device.label;
      return 'لم يفتحه بعد';
    }
    function paintEntry(){
      linkSlot.innerHTML = '';
      var keep = entries; entries = linkSlot;
      entry('رابط إشعاراته', valText(), false, openSheet);
      entries = keep;
    }
    tapi('GET', 'api/tpush/links').then(function(r){
      if (!r.ok) return;
      L = (r.j.links || []).filter(function(x){ return x.name === T; })[0] || null;
      paintEntry();
      /* ?link=1 ⟵ قادم من إشعار «طلب فتح رابط»: يفتح لوحة الرابط وفيها الطلب */
      if (new URLSearchParams(location.search).get('link')) openSheet();
    }).catch(function(){});

    function openSheet(){
      var n = document.createElement('div'); n.className = 'stack';
      var note = document.createElement('div'); note.className = 'soon-note';
      n.appendChild(note);
      if (!L) {
        note.textContent = 'رابط خاص بأ. ' + Shouba.shortName(T) + '، يفتحه على هاتفه ويفعّل منه إشعارات حصصه ورسائلك، بلا حساب.';
        var mk = document.createElement('button'); mk.type = 'button'; mk.className = 'cta'; mk.textContent = 'أنشئ رابطه';
        mk.addEventListener('click', function(){ make(false, mk); });
        n.appendChild(mk);
        Shouba.sheet.open('رابط إشعارات أ. ' + Shouba.shortName(T), n);
        return;
      }
      note.textContent = L.device
        ? 'قبلتَ جهاز أ. ' + Shouba.shortName(T) + ' (' + L.device.label + ')' + (L.devices ? ' وفعّل منه الإشعارات.' : '، ولم يفعّل منه الإشعارات بعد.')
        : 'أرسل الرابط إلى أ. ' + Shouba.shortName(T) + '. حين يفتحه يصلك طلب تقبله، فلا يرى أحد شيئاً قبل قبولك. والرابط يعمل على جهاز واحد.';
      /* الطلبات المعلقة: كل طلب سطر يفتح «اقبله» و«ارفضه» (Shouba.tdevAsk) */
      (L.pending || []).forEach(function(q){
        var b = document.createElement('button'); b.type = 'button'; b.className = 'entry';
        b.innerHTML = '<b></b><span class="val"></span><span class="chev">‹</span>';
        b.querySelector('b').textContent = 'طلب من ' + q.label;
        b.querySelector('.val').textContent = Shouba.tdevWhen(q.at);
        b.addEventListener('click', function(){ Shouba.tdevAsk(Object.assign({ name: T }, q), refresh); });
        n.appendChild(b);
      });
      var box = document.createElement('div'); box.className = 'paper';
      var inp = document.createElement('input'); inp.readOnly = true; inp.value = urlOf(); inp.dir = 'ltr';
      inp.style.fontFamily = 'var(--font-num)'; inp.style.fontSize = '13.5px';
      box.appendChild(inp); n.appendChild(box);
      var cp = document.createElement('button'); cp.type = 'button'; cp.className = 'cta'; cp.textContent = 'انسخ الرابط';
      cp.addEventListener('click', function(){
        var done = function(){ Shouba.toast('نسخ رابط أ. ' + Shouba.shortName(T)); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(urlOf()).then(done, function(){ inp.select(); });
        else { inp.select(); try { document.execCommand('copy'); done(); } catch (e) {} }
      });
      n.appendChild(cp);
      if (navigator.share) {
        var sh = document.createElement('button'); sh.type = 'button'; sh.className = 'btn-ghost'; sh.textContent = 'أرسله';
        sh.addEventListener('click', function(){ navigator.share({ title: 'إشعارات شعبة', url: urlOf() }).catch(function(){}); });
        n.appendChild(sh);
      }
      if (L.device) {
        var dr = document.createElement('button'); dr.type = 'button'; dr.className = 'rmdev'; dr.textContent = 'ألغِ جهازه المقبول';
        dr.addEventListener('click', function(){
          Shouba.ask('إلغاء الجهاز', 'يتوقف الرابط على ' + L.device.label + ' أ. ' + Shouba.shortName(T) + '، وتتوقف إشعاراته عليه. ولا يعود إلا برابط جديد تصدره له.',   /* قرار المستخدم 2026-11-08: «٢» */
            'ألغه', function(){
              tapi('POST', 'api/tpush/drop', { name: T }).then(function(r){
                if (!r.ok) { Shouba.toast(r.j.error || 'تعذر الإلغاء'); return; }
                Shouba.toast('أُلغي جهاز أ. ' + Shouba.shortName(T)); refresh();
              }).catch(function(){ Shouba.toast('لا اتصال — لم يُلغَ الجهاز'); });
            });
        });
        n.appendChild(dr);
      }
      var rn = document.createElement('button'); rn.type = 'button'; rn.className = 'btn-ghost'; rn.textContent = 'أبطل الرابط وأصدر غيره';
      rn.addEventListener('click', function(){
        Shouba.ask('إبطال الرابط', 'يتوقف الرابط الحالي، وتتوقف الإشعارات على كل جهاز فعّلها منه، ويصدر رابط جديد ترسله إليه.',
          'أبطله وأصدر غيره', function(){ make(true); });
      });
      n.appendChild(rn);
      Shouba.sheet.open('رابط إشعارات أ. ' + Shouba.shortName(T), n);
    }
    /* بعد الحسم او الإلغاء: الحال من الخادم، ثم اللوحة من جديد */
    function refresh(){
      tapi('GET', 'api/tpush/links').then(function(r){
        if (!r.ok) return;
        L = (r.j.links || []).filter(function(x){ return x.name === T; })[0] || null;
        paintEntry(); Shouba.sheet.close(); openSheet();
      }).catch(function(){});
    }
    /* الخادم يعرف المعلم من وثيقة الشعبة عنده — فما لم يصله بعد يرسل اولا */
    function make(renew, btn){
      if (btn) btn.disabled = true;
      Promise.resolve(Shouba.pending() ? Shouba.flush() : 'ok').then(function(){
        return tapi('POST', 'api/tpush/link', { name: T, renew: !!renew });
      }).then(function(r){
        if (btn) btn.disabled = false;
        if (!r.ok) { Shouba.toast(r.j.error || 'تعذر إنشاء الرابط'); return; }
        L = r.j; paintEntry(); openSheet();
        if (renew) Shouba.toast('أصدر رابط جديد، والقديم لا يعمل');
      }).catch(function(){ if (btn) btn.disabled = false; Shouba.toast('لا اتصال — لم ينشأ الرابط'); });
    }
  })();

  /* ②ج مواعيد التسليم (2026-11-06، قرار المستخدم 17:32: «تظهر مواعيد كل معلم في ملفه») — للعرض، والتأشير
     في «المعلمون» ⟵ «مواعيد التسليم» (قرار 17:37). يظهر البند ما دام له موعد */
  (function(){
    var mine = Shouba.deadlines ? Shouba.deadlines().filter(function(x){ return (x.to || []).indexOf(T) > -1; }) : [];
    if (!mine.length) return;
    var open = mine.filter(function(x){ return (x.done || []).indexOf(T) === -1; }).length;
    entry('مواعيد التسليم', open ? 'لم يسلّم ' + open + ' من ' + mine.length : 'سلّمها كلها', false, function(){
      var n = document.createElement('div'); n.className = 'vlist'; n.style.padding = '0';
      mine.forEach(function(x){
        var on = (x.done || []).indexOf(T) > -1;
        var r = document.createElement('div'); r.className = 'subrow';
        r.innerHTML = '<b></b><span class="cls"></span><span class="pc"></span>';
        r.querySelector('b').textContent = x.title;
        r.querySelector('.cls').textContent = Shouba.dayMonth(x.date);
        r.querySelector('.pc').textContent = on ? 'سلّم' : 'لم يسلّم';
        if (on) r.querySelector('.pc').style.color = 'var(--shouba-success)';
        n.appendChild(r);
      });
      Shouba.sheet.open('مواعيد أ. ' + Shouba.shortName(T), n);
    });
  })();

  /* ③ سجلاته في ملفه (المجموعة أ، 2026-09-14): بطاقة متابعته · ملاحظاته التربوية · إنجازاته — تفتح سجله في فصله او
     عامه، وجديدا باسمه ان لم يكن. و«اطبع ملفه» يجمعها وسائر سجلاته بغلاف «سجل متابعة معلم» (نماذج التوجيه ص٤) */
  function recEntry(tplId, title){
    var t = window.ShoubaRec && ShoubaRec.latest(tplId);
    if(!t || SHOUBA_REF.offRecord(t.ready)) return;   /* الموقوف مؤقتا (refdata.pausedRecords) لا مدخل له */
    var mine = Shouba.recs(tplId).filter(function(r){
      return r.who === T && (r.year || '') === (d.year || '') && (t.scope === 'year' || (r.term || '') === (d.term || ''));
    })[0];
    entry(title, mine ? (t.scope === 'year' ? 'هذا العام' : 'هذا الفصل') : 'لم يبدأ', false, function(){
      location.href = mine ? 'record.html?id=' + encodeURIComponent(mine.id)
                           : 'record.html?tpl=' + encodeURIComponent(tplId) + '&who=' + encodeURIComponent(T);
    });
  }
  recEntry('tcard', 'بطاقة متابعته');
  recEntry('tnotes', 'ملاحظاته التربوية');
  recEntry('tach', 'إنجازاته وأنشطته');
  /* ④ سجلاته الكثيرة (many): تقارير زياراته (المجموعة ب 2026-09-14) وخطط متعلميه الفائقين والمتعثرين (المجموعة ج
     2026-09-15) — تفتح ارشيف القالب مقصورا عليه (archive.html?tpl=&who=)، و«جديد» فيه ينشئ له مباشرة */
  function manyEntry(tplId, title, none){
    var t = window.ShoubaRec && ShoubaRec.latest(tplId);
    if(!t || SHOUBA_REF.offRecord(t.ready)) return;
    var n = Shouba.recs(tplId).filter(function(r){
      return r.who === T && (r.year || '') === (d.year || '') && (t.scope === 'year' || (r.term || '') === (d.term || ''));
    }).length;
    entry(title, n ? Shouba.count(n, t.noun) + (t.scope === 'year' ? ' هذا العام' : ' هذا الفصل') : none, false, function(){
      location.href = 'archive.html?tpl=' + encodeURIComponent(tplId) + '&who=' + encodeURIComponent(T);
    });
  }
  manyEntry('hvisit', 'تقارير زياراته', 'لم يزر بعد');
  manyEntry('superior', 'خطط متعلميه الفائقين', 'لا خطط بعد');
  manyEntry('struggling', 'خطط متعلميه المتعثرين', 'لا خطط بعد');
  entry('اطبع ملفه', 'غلافه ثم سجلاته', false, function(){ location.href = 'bundle.html?who=' + encodeURIComponent(T); });

  /* الإزالة بتأكيد صريح — تمس جدوله أيضا */
  document.getElementById('remove').addEventListener('click', function(){
    var n = document.createElement('div');
    var note = document.createElement('div');
    note.className = 'soon-note';
    note.textContent = 'سيزال أ. ' + Shouba.shortName(T) + ' من شعبتك'
      + (load ? '، ومعه جدوله (' + load + ' حصة).' : '.') + ' لا يمكن التراجع.';
    n.appendChild(note);
    var yes = document.createElement('button');
    yes.className = 'cta'; yes.textContent = 'نعم، أزله';
    yes.addEventListener('click', function(){
      var list = Shouba.teachers().filter(function(x){ return x !== T; });
      var dd = Shouba.data();
      if(dd.schedules) delete dd.schedules[T];
      Shouba.save({ teachers: list });
      location.replace('teachers.html');
    });
    n.appendChild(yes);
    Shouba.sheet.open('تأكيد الإزالة', n);
  });

  [].forEach.call(document.querySelectorAll('.tab[data-go]'), function(b){
    b.addEventListener('click', function(){ location.href = b.dataset.go; });
  });
  /* صار منزلا يعيد إلى اللوحة (لا إلى المعلمين) — وتبويب «المعلمون» في الشريط السفلي
     يكفي للعودة إلى القائمة. والسلوك موحد في كل الشاشات. */
  document.getElementById('add').addEventListener('click', Shouba.quickAdd);
</script>
</body>
</html>
