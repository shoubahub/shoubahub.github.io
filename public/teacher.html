<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>شعبة · ملفّ المعلّم</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1B5183" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="شعبة" />
<link rel="apple-touch-icon" href="identity/assets/app-icon-approved.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="identity/tokens.css?v=28" />
<link rel="stylesheet" href="shell.css?v=28" />
<link rel="stylesheet" href="components.css?v=28" />
<link rel="stylesheet" href="frame.css?v=28" />
<style>
  .wrap{display:flex;flex-direction:column;gap:14px;padding-top:14px}
  .rm{padding:0 var(--gap-side)}
  .rm button{width:100%;border:0;cursor:pointer;font-family:var(--font-ar);font-size:13px;font-weight:700;
    color:var(--shouba-error);background:rgba(183,68,58,.08);border-radius:14px;padding:13px}
</style>
</head>
<body class="framed">
 <div class="device"><div class="viewport">
    <div class="topbar">
      <div class="tbcrest" id="tbCrest"></div>
      <div class="tt">
        <b id="tName">—</b>
        <span id="tLine">—</span>
      </div>
      <div class="iconbtn" id="back" title="المعلّمون">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M8 4 L14 10 L8 16" stroke="#5F5648" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

  <div class="screen has-topbar has-tabbar">
    <div class="content">
      <div class="wrap">
        <div class="vlist" id="entries"></div>
        <div class="rm"><button id="remove">إزالة المعلّم من شعبتك</button></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab" data-go="board.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 8.4 10 3l7 5.4V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      اللوحة
    </button>
    <button class="tab on" data-go="teachers.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M4 17c0-3 2.7-4.6 6-4.6S16 14 16 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      المعلّمون
    </button>
    <button class="tab-add" id="add" aria-label="إضافة">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><path d="M10 4 V16 M4 10 H16" stroke="#241D06" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
    <button class="tab" data-go="records.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 3h7l3 3v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 9h6M7 12.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      سجلّاتك
    </button>
    <button class="tab" data-go="schedule.html">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="3.5" y="4.5" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 8.5h13M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      الجدول
    </button>
  </div>
 </div></div>

<script src="build.js?v=28"></script>
<script src="refdata.js?v=28"></script>
<script src="derive.js?v=28"></script>
<script src="icons.js?v=28"></script>
<script src="components.js?v=28"></script>
<script>
  var d = Shouba.data();
  var T = new URLSearchParams(location.search).get('t') || '';

  (function paintTopCrest(){
    var el=document.getElementById('tbCrest'), c=d.crest;
    if(c && c.type==='image') el.innerHTML='<img src="'+c.data+'" alt="شعار المدرسة" />';
    else if(c && c.type==='icon' && window.SHOUBA_ICONS) el.innerHTML=SHOUBA_ICONS.svg(c.id,22);
    else el.innerHTML='<img src="identity/assets/logo-vec-dark.svg" alt="شعبة" style="object-fit:contain;padding:5px" />';
  })();

  /* اسمٌ غير موجود ⟵ لا نعرض ملفّاً فارغاً بل نعيده إلى القائمة */
  if(!T || Shouba.teachers().indexOf(T) === -1){ location.replace('teachers.html'); }

  var load = Shouba.loadOf(T), subs = Shouba.subjectsOfTeacher(T);
  document.getElementById('tName').textContent = 'أ. ' + Shouba.shortName(T);
  document.getElementById('tLine').textContent =
    (load ? Shouba.count(load,{one:'حصة',two:'حصتان',few:'حصص',many:'حصة'}) : 'بلا جدول')
    + ' · ' + (d.department || 'شعبتك');

  var entries = document.getElementById('entries');
  function entry(title, val, soon, onClick){
    var b = document.createElement('button');
    b.className = 'entry' + (soon ? ' soon' : '');
    b.innerHTML = '<b>' + title + '</b><span class="val">' + val + '</span><span class="chev">‹</span>';
    b.addEventListener('click', onClick);
    entries.appendChild(b);
  }

  /* ① المواد — مشتقّة من جدوله، بلا إدخال */
  entry('المواد التي يدرّسها',
        subs.length ? Shouba.count(subs.length,{one:'مادة',two:'مادّتان',few:'مواد',many:'مادة'}) : 'لا شيء',
        false, function(){
    var n = document.createElement('div');
    n.className = 'vlist'; n.style.padding = '0';
    if(!subs.length){
      var e = document.createElement('div'); e.className = 'soon-note';
      e.textContent = 'تظهر مواده تلقائياً بمجرّد إدخال جدوله — لا تحتاج إدخالاً منفصلاً.';
      n.appendChild(e);
    }
    subs.forEach(function(s){
      var r = document.createElement('div'); r.className = 'subrow';
      r.innerHTML = '<b>' + s.name + '</b><span class="cls">' + s.classes.join(' · ') + '</span>'
                  + '<span class="pc">' + Shouba.count(s.periods,{one:'حصة',two:'حصتان',few:'حصص',many:'حصة'}) + '</span>';
      n.appendChild(r);
    });
    Shouba.sheet.open('مواد أ. ' + Shouba.shortName(T), n);
  });

  /* ② جدوله — يفتح شاشة الجداول عليه مباشرةً */
  entry('جدوله الدراسي',
        load ? Shouba.count(load,{one:'حصة',two:'حصتان',few:'حصص',many:'حصة'}) : 'لم يُدخل',
        false, function(){ location.href = 'schedule.html?t=' + encodeURIComponent(T); });

  /* ③④ قيد الإعداد — يظهران ليُعرف شكل الملفّ، ويصرّحان بحالهما */
  function soonEntry(title){
    entry(title, 'قيد الإعداد', true, function(){
      var n = document.createElement('div');
      n.className = 'soon-note';
      n.textContent = '«' + title + '» قيد الإعداد، ويصل في تحديث قادم ضمن سجلّاتك.';
      Shouba.sheet.open('قيد الإعداد', n);
    });
  }
  soonEntry('تقاريره');
  soonEntry('إنجازاته');

  /* الإزالة بتأكيد صريح — تمسّ جدوله أيضاً */
  document.getElementById('remove').addEventListener('click', function(){
    var n = document.createElement('div');
    var note = document.createElement('div');
    note.className = 'soon-note';
    note.textContent = 'سيُزال أ. ' + Shouba.shortName(T) + ' من شعبتك'
      + (load ? '، ومعه جدوله (' + load + ' حصة).' : '.') + ' لا يمكن التراجع.';
    n.appendChild(note);
    var yes = document.createElement('button');
    yes.className = 'cta'; yes.textContent = 'نعم، أزِله';
    yes.addEventListener('click', function(){
      var list = Shouba.teachers().filter(function(x){ return x !== T; });
      var dd = Shouba.data();
      if(dd.schedules) delete dd.schedules[T];
      Shouba.save({ teachers: list });
      location.replace('teachers.html');
    });
    n.appendChild(yes);
    Shouba.sheet.open('تأكيد الإزالة', n);
  });

  [].forEach.call(document.querySelectorAll('.tab[data-go]'), function(b){
    b.addEventListener('click', function(){ location.href = b.dataset.go; });
  });
  document.getElementById('back').addEventListener('click', function(){ location.href='teachers.html'; });
  document.getElementById('add').addEventListener('click', Shouba.quickAdd);
</script>
</body>
</html>
