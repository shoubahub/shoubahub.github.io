<style>
  /* خاص بهذه الشاشة — القائمة والسطور من components.css */
  .wrap{display:flex;flex-direction:column;gap:14px;padding-top:14px}
  .addrow{padding:0 var(--gap-side)}
  .addrow .cta{width:100%}
  .note{padding:0 var(--gap-side);font-size:12px;font-weight:600;color:var(--shouba-hint);line-height:1.8}
  /* لوحة «أرسل إشعاراً» (2026-11-06): الحقول بمسافة 30 المعتمدة، و«أرسل» ثابت أسفلها — الفعل الوحيد، بلا «تم» (المطوّر البصري) */
  .sendform{display:flex;flex-direction:column;gap:30px}
  .sendfoot{position:sticky;bottom:-6px;margin:-18px -3px -6px;padding:12px 3px 6px;display:flex;flex-direction:column;gap:8px;
    background:var(--shouba-paper)}
  .msg{font-size:12.5px;font-weight:600;color:var(--shouba-error);line-height:1.7;text-align:center}
  .msg.ok{color:var(--shouba-navy)}
  .msg:empty{display:none}
  .pick .tx small.on{color:var(--shouba-success);font-weight:700}
  /* «احذف الموعد»: زر الخطر بأسلوب «إزالة المعلم من شعبتك» (teacher.html) — المطوّر البصري 2026-11-06 */
  .dlrm{width:100%;border:0;cursor:pointer;font-family:var(--font-ar);font-size:13px;font-weight:700;
    color:var(--shouba-error);background:rgba(183,68,58,.08);border-radius:14px;padding:13px}
</style>

<script src="build.js?v=142"></script>

<script>
  var d = Shouba.data();

  (function paintTopCrest(){
    var el=document.getElementById('tbCrest'), c=d.crest;
    if(c && c.type==='image') el.innerHTML='<img src="'+c.data+'" alt="شعار المدرسة" />';
    else if(c && c.type==='icon' && window.SHOUBA_ICONS) el.innerHTML=SHOUBA_ICONS.svg(c.id,22);
    else el.innerHTML='<img src="identity/assets/logo-vec-dark.svg" alt="شعبة" style="object-fit:contain;padding:5px" />';
  })();

  var listEl = document.getElementById('list');

  function paint(){
    var teachers = Shouba.teachers();
    listEl.innerHTML = '';

    if(!teachers.length){
      listEl.innerHTML = '<div class="invite">لم تضف معلمي شعبتك بعد — وعليهم تبنى الجداول والسجلات.</div>';
    }
    teachers.forEach(function(t){
      var load = Shouba.loadOf(t), subs = Shouba.subjectsOfTeacher(t);
      var b = document.createElement('button');
      b.className = 'titem' + (load ? '' : ' none');
      b.innerHTML = '<span class="ini">' + t.charAt(0) + '</span>'
        + '<div class="tx"><b>أ. ' + t + '</b><small>'
        + (load ? Shouba.count(load,{one:'حصة',two:'حصتان',few:'حصص',many:'حصة'})
                  + ' · ' + Shouba.count(subs.length,{one:'مادة',two:'مادتان',few:'مواد',many:'مادة'})
                : 'لم يدخل جدوله بعد')
        + '</small></div><span class="chev">‹</span>';
      b.addEventListener('click', function(){ location.href = 'teacher.html?t=' + encodeURIComponent(t); });
      listEl.appendChild(b);
    });

    var blank = teachers.filter(function(t){ return !Shouba.hasSchedule(t); }).length;
    document.getElementById('headLine').textContent = teachers.length
      ? Shouba.count(teachers.length,{one:'معلم',two:'معلمان',few:'معلمين',many:'معلما'})
        + ' · ' + (blank ? Shouba.count(blank,{one:'جدول',two:'جدولان',few:'جداول',many:'جدولا'}) + ' بلا إدخال'
                         : 'كل الجداول مدخلة')
      : 'بانتظار أسمائهم';
    document.getElementById('note').textContent = teachers.length
      ? 'اضغط اسم المعلم لفتح ملفه: مواده وجدوله وتقاريره وإنجازاته.' : '';
  }

  /* الإضافة في لوحة سفلية — لا التفاف إلى شاشة المعالج */
  function addSheet(){
    var n = document.createElement('div');
    n.innerHTML = '<div class="field" data-need="req" style="padding-bottom:6px">'
      + '<label for="nm">اسم المعلم</label>'
      + '<div class="paper"><input id="nm" type="text" maxlength="60" placeholder="اكتب اسم المعلم" /></div>'
      + '<div class="hint" id="warn">اكتبه كما يظهر في النماذج الرسمية.</div></div>';
    var btn = document.createElement('button');
    btn.className = 'cta'; btn.textContent = 'أضف';
    n.appendChild(btn);
    /* «تم» اسفل اللوحة يضيف ما كتب — لا يضيع (قاعدة الادخال 2026-09-13) */
    Shouba.sheet.open('معلم جديد', n, { onDone: function(){ return inp.value.trim() ? submit() : true; } });
    var inp = n.querySelector('#nm'), warn = n.querySelector('#warn');
    setTimeout(function(){ inp.focus(); }, 80);
    function submit(){
      var v = inp.value.trim().replace(/\s+/g,' ');
      /* لا اهمال صامت ولا حفظ صامت (قاعدة الادخال 2026-09-13) */
      if(v.length < 3){ warn.textContent = 'الاسم قصير — اكتبه كما في النماذج الرسمية.'; inp.focus(); return false; }
      if(Shouba.teachers().indexOf(v) > -1){ warn.textContent = 'هذا الاسم مضاف سلفا.'; return false; }
      var list = Shouba.teachers(); list.push(v);
      Shouba.save({ teachers: list });
      Shouba.sheet.close(); paint();
      Shouba.toast('أضيف أ. ' + v + ' إلى معلميك');
      return true;
    }
    btn.addEventListener('click', submit);
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
  }

  /* أرسل إشعاراً (2026-11-06، طلب المستخدم: «او ان ارسل لهم انا ما اشاء كبداية فعالية او تذكير بتسليم او تهنئة») — tpush.js.
     رسالة حرة للكل او لمن تختار، تصل من فعّل الاشعارات برابطه (ملف المعلم ⟵ رابط إشعاراته)، ولا يطفئها المعلم.
     والبوابة سؤال الخادم نفسه (/api/tpush/links: ٢٠٠ مفعلة · ٤٠٤ لا) — فمن خارج التجربة لا يرى الزر */
  var CHK = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.4 L4.6 9 L10 3" stroke="#F4F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function tapi(method, url, body){
    return fetch(url, { method: method, credentials: 'same-origin', cache: 'no-store',
      headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok: r.ok, status: r.status, j: j }; }); });
  }
  tapi('GET', 'api/tpush/links').then(function(r){
    if (!r.ok) return;
    document.getElementById('sendRow').hidden = false;
    document.getElementById('dlRow').hidden = false;
  }).catch(function(){});
  /* بطاقة اختيار (.pick) — للوحة الإرسال ولمواعيد التسليم */
  function pickRow(title, small, on){
    var row = document.createElement('div'); row.className = 'pick';
    row.setAttribute('role', 'checkbox'); row.tabIndex = 0;
    row.innerHTML = '<span class="mark">' + CHK + '</span><div class="tx"><b></b><small></small></div>';
    row.querySelector('b').textContent = title;
    var sm = row.querySelector('small'); sm.textContent = small; if (on) sm.className = 'on';
    return row;
  }
  function set(row, on){ row.classList.toggle('on', on); row.setAttribute('aria-checked', on ? 'true' : 'false'); }
  function bind(row, tap){
    row.addEventListener('click', tap);
    row.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } });
  }

  function sendSheet(){
    tapi('GET', 'api/tpush/links').then(function(r){
      if (!r.ok) { Shouba.toast('تعذر الوصول إلى الخادم'); return; }
      var dev = {};
      (r.j.links || []).forEach(function(l){ dev[l.name] = l.devices; });
      var teachers = Shouba.teachers(), ready = teachers.filter(function(t){ return dev[t] > 0; });

      var n = document.createElement('div'); n.className = 'sendform';
      n.innerHTML = '<div class="field" data-need="opt"><label for="mt">العنوان</label>'
        + '<div class="paper"><input id="mt" type="text" maxlength="60" placeholder="رسالة من رئيس الشعبة" /></div></div>'
        + '<div class="field" data-need="req"><label for="mb">نص الرسالة</label>'
        + '<div class="paper"><textarea id="mb" rows="3" maxlength="300" placeholder="اكتب ما تريد إرساله"></textarea></div>'
        + '</div>'
        + '<div class="field"><label>إلى</label><div class="stack" id="to"></div></div>';
      var foot = document.createElement('div'); foot.className = 'sendfoot';
      var mw = document.createElement('div'); mw.className = 'msg';
      var go = document.createElement('button'); go.type = 'button'; go.className = 'cta'; go.textContent = 'أرسل'; go.disabled = true;
      foot.appendChild(mw); foot.appendChild(go); n.appendChild(foot);
      /* «أرسل» الفعل الوحيد: لا «تم» تحته، وتغلق اللوحة بلسانها او بالسحب */
      Shouba.sheet.open('أرسل إشعاراً', n, { noDone: true });

      var mb = n.querySelector('#mb'), mt = n.querySelector('#mt'), to = n.querySelector('#to');
      mb.addEventListener('input', function(){ go.disabled = !mb.value.trim(); if (mb.value.trim()) mw.textContent = ''; });
      var all = true, chosen = {};
      function say(t, good){ mw.textContent = t || ''; mw.classList.toggle('ok', !!good); }
      var rows = [];
      var allRow = pickRow('كل المعلمين', ready.length
        ? 'فعّلها منهم ' + Shouba.count(ready.length,{one:'معلم',two:'معلمان',few:'معلمين',many:'معلما'})
        : 'لم يفعّلها أحد منهم بعد');
      to.appendChild(allRow);
      teachers.forEach(function(t){
        var row = pickRow('أ. ' + Shouba.shortName(t), dev[t] > 0 ? 'الإشعارات مفعّلة' : 'لم يفعّلها بعد', dev[t] > 0);
        row.dataset.t = t; rows.push(row); to.appendChild(row);
      });
      function paintTo(){
        set(allRow, all);
        rows.forEach(function(row){ set(row, !all && !!chosen[row.dataset.t]); });
      }
      bind(allRow, function(){ all = true; chosen = {}; paintTo(); });
      rows.forEach(function(row){ bind(row, function(){
        var t = row.dataset.t;
        if (all) { all = false; chosen = {}; }
        chosen[t] = !chosen[t];
        if (!Object.keys(chosen).some(function(k){ return chosen[k]; })) all = true;
        paintTo();
      }); });
      paintTo();

      function send(){
        var body = mb.value.trim();
        if (!body) { mb.focus(); return; }
        var list = all ? 'all' : Object.keys(chosen).filter(function(k){ return chosen[k]; });
        go.disabled = true;
        Promise.resolve(Shouba.pending() ? Shouba.flush() : 'ok').then(function(){
          return tapi('POST', 'api/tpush/send', { to: list, title: mt.value.trim(), body: body });
        }).then(function(x){
          go.disabled = false;
          if (!x.ok) { say(x.j.error || 'تعذر الإرسال.'); return; }
          if (!x.j.teachers) { say(x.j.subscribed ? 'تعذر الوصول إلى أجهزتهم — أعد المحاولة بعد قليل.'
                                                 : 'لم يفعّلها أحد ممن اخترت بعد، فلم تصل الرسالة إلى أحد.'); return; }
          /* تم الإرسال: النص يفرغ فيتعطل الزر — فلا ترسل الرسالة نفسها مرتين بضغطة ثانية */
          mb.value = ''; mt.value = ''; go.disabled = true;
          say('أُرسل إلى ' + Shouba.count(x.j.teachers,{one:'معلم',two:'معلمين',few:'معلمين',many:'معلما'})
            + (x.j.teachers < x.j.chosen ? ' من ' + x.j.chosen : '') + '.', true);
        }).catch(function(){ go.disabled = false; say('لا اتصال — لم ترسل الرسالة.'); });
      }
      go.addEventListener('click', send);
    }).catch(function(){ Shouba.toast('لا اتصال — الإرسال يحتاج الإنترنت'); });
  }
  document.getElementById('send').addEventListener('click', sendSheet);

  /* مواعيد التسليم (2026-11-06، طلب المستخدم: «ان اضيف له موعد بحيث استلم منه مشروع فينبهه تلقائيا بقرب الموعد او
     وصول الموعد») — derive.js يحفظها في الوثيقة، وtpush.js ينبه منها المعلم 7:00 في آخر يوم دراسي قبل الموعد ويومه.
     القائمة هنا (قرار المستخدم 17:37): كل موعد يفتح بأسماء معلميه، وأمام كل اسم «سُلّم» — ومن أشّر له لا يصله ما بقي */
  var WEEK = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  function whenText(iso){
    var t = Shouba.todayIso(), p = iso.split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]);
    var tm = new Date(); tm.setDate(tm.getDate() + 1);
    if (iso === t) return 'اليوم';
    if (iso === Shouba.todayIso(tm)) return 'غداً';
    return WEEK[dt.getDay()] + ' ' + Shouba.dayMonth(iso);
  }
  function tally(dl){
    var all = Shouba.deadlineTeachers(dl).length, got = all - Shouba.deadlinePending(dl).length;
    return got === all ? 'سلّم الجميع' : 'سلّم ' + got + ' من ' + all;
  }

  /* سطور القائمة المفتوحة: «رجوع» من الموعد يعيدها كما تركت، فيتجدد عدّ من سلّم فيها مع كل تأشير */
  var listRows = [];
  function repaintList(){
    listRows.forEach(function(x){ var dl = Shouba.deadline(x.id); if (dl) x.small.textContent = whenText(dl.date) + ' · ' + tally(dl); });
  }
  function dlList(){
    listRows = [];
    var n = document.createElement('div'); n.className = 'sendform';
    var list = Shouba.deadlines(), box = document.createElement('div'); box.className = 'vlist'; box.style.padding = '0';
    if (!list.length) {
      var e = document.createElement('div'); e.className = 'soon-note';
      e.textContent = 'أضف موعداً ينتظر فيه تسليماً من معلميك، فيُنبَّه كلٌّ منهم صباح اليوم السابق له وصباح يومه، حتى تؤشّر أنه سلّم.';
      n.appendChild(e);
    }
    list.forEach(function(dl){
      var b = document.createElement('button'); b.className = 'titem';
      b.innerHTML = '<span class="ini"></span><div class="tx"><b></b><small></small></div><span class="chev">‹</span>';
      b.querySelector('.ini').textContent = (+dl.date.split('-')[2]);
      b.querySelector('b').textContent = dl.title;
      b.querySelector('small').textContent = whenText(dl.date) + ' · ' + tally(dl);
      listRows.push({ id: dl.id, small: b.querySelector('small') });
      b.addEventListener('click', function(){ dlSheet(dl.id, true); });
      box.appendChild(b);
    });
    if (list.length) n.appendChild(box);
    var add = document.createElement('button'); add.type = 'button'; add.className = 'cta'; add.textContent = 'أضف موعد تسليم';
    add.addEventListener('click', function(){ dlForm(null); });
    n.appendChild(add);
    Shouba.sheet.open('مواعيد التسليم', n);
  }

  /* الموعد: من سلّم ومن لم يسلّم — والضغطة على الاسم تؤشّر «سُلّم» او ترفعه */
  function dlSheet(id, step){
    var dl = Shouba.deadline(id);
    if (!dl) { Shouba.toast('هذا الموعد محذوف'); return; }
    var n = document.createElement('div'); n.className = 'sendform';
    var head = document.createElement('div'); head.className = 'soon-note';
    function paintHead(){ head.textContent = 'موعده ' + whenText(dl.date) + ' · ' + tally(Shouba.deadline(id) || dl); }
    paintHead(); n.appendChild(head);
    var st = document.createElement('div'); st.className = 'field';
    st.innerHTML = '<label>من سلّم</label>';
    var stack = document.createElement('div'); stack.className = 'stack'; st.appendChild(stack); n.appendChild(st);
    Shouba.deadlineTeachers(dl).forEach(function(t){
      var row = pickRow('أ. ' + Shouba.shortName(t), '', false), sm = row.querySelector('small');
      function paint(){
        var on = (Shouba.deadline(id).done || []).indexOf(t) > -1;
        set(row, on); sm.textContent = on ? 'سلّم' : 'لم يسلّم'; sm.className = on ? 'on' : '';
      }
      bind(row, function(){
        var on = (Shouba.deadline(id).done || []).indexOf(t) === -1;
        Shouba.setDelivered(id, t, on); paint(); paintHead(); repaintList();
      });
      paint(); stack.appendChild(row);
    });
    var ed = document.createElement('button'); ed.type = 'button'; ed.className = 'btn-ghost'; ed.textContent = 'عدّل الموعد';
    ed.addEventListener('click', function(){ dlForm(Shouba.deadline(id)); });
    var rm = document.createElement('button'); rm.type = 'button'; rm.className = 'dlrm'; rm.textContent = 'احذف الموعد';
    /* الحذف يغلق، و«تراجع» في الإشعار يعيده بحقوله (قاعدة الادخال 2026-09-13) */
    rm.addEventListener('click', function(){
      var copy = JSON.parse(JSON.stringify(Shouba.deadline(id)));
      Shouba.removeDeadline(id); Shouba.sheet.close();
      Shouba.toast('حذف الموعد: ' + copy.title, function(){ Shouba.data().deadlines.push(copy); Shouba.save(); });
    });
    var acts = document.createElement('div'); acts.className = 'stack';
    acts.appendChild(ed); acts.appendChild(rm); n.appendChild(acts);
    Shouba.sheet.open(dl.title, n, { step: !!step });
  }

  /* إضافة موعد او تعديله: عنوان وتاريخ ومن يسلّمه (قرار المستخدم 17:38: عنوان وتاريخ فقط) */
  function dlForm(dl){
    var teachers = Shouba.teachers();
    var n = document.createElement('div'); n.className = 'sendform';
    n.innerHTML = '<div class="field" data-need="req"><label for="dt">العنوان</label>'
      + '<div class="paper"><input id="dt" type="text" maxlength="60" placeholder="ما الذي يسلّمه؟" /></div></div>'
      + '<div class="field" data-need="req"><label for="dd">تاريخ التسليم</label>'
      + '<div class="paper"><input id="dd" type="date" /></div>'
      + '<div class="hint" id="ddh">من الأحد إلى الخميس.</div></div>'
      + '<div class="field"><label>من يسلّمه</label><div class="stack" id="to"></div></div>';
    /* «تم» هو الفعل نفسه: «أضف الموعد» او «احفظ التعديل» بالعنبري، معطلا حتى يكتمل العنوان والتاريخ ومن يسلّمه
       (المطوّر البصري 2026-11-06) — و«رجوع» بجانبه محايد */
    Shouba.sheet.open(dl ? 'تعديل الموعد' : 'موعد تسليم جديد', n,
      { step: true, doneLabel: dl ? 'احفظ التعديل' : 'أضف الموعد', onDone: function(){ return submit(); } });
    var inp = n.querySelector('#dt'), dd = n.querySelector('#dd'), to = n.querySelector('#to');
    dd.min = Shouba.todayIso();
    if (dl) { inp.value = dl.title; dd.value = dl.date; }
    var all = !dl || teachers.every(function(t){ return dl.to.indexOf(t) > -1; }), chosen = {};
    if (!all) dl.to.forEach(function(t){ chosen[t] = true; });
    var allRow = pickRow('كل المعلمين', Shouba.count(teachers.length,{one:'معلم',two:'معلمان',few:'معلمين',many:'معلما'})), rows = [];
    to.appendChild(allRow);
    teachers.forEach(function(t){
      var row = pickRow('أ. ' + Shouba.shortName(t), Shouba.subjectsOfTeacher(t).map(function(s){ return s.name; }).join(' · '));
      row.dataset.t = t; rows.push(row); to.appendChild(row);
    });
    /* لا تسليم في العطلة (قرار المستخدم 2026-11-08): الجمعة والسبت لا يقبلان — ومنتقي التاريخ لا يحجب أياما،
       فيرد هنا بتنبيه تحت الحقل و«أضف الموعد» معطل */
    var ddh = n.querySelector('#ddh');
    function weekend(){ if (!dd.value) return false; var p = dd.value.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getDay() > 4; }
    function ready(){
      var off = weekend();
      ddh.textContent = off ? 'هذا اليوم عطلة. اختر يوماً من الأحد إلى الخميس.' : 'من الأحد إلى الخميس.';
      ddh.style.color = off ? 'var(--shouba-error)' : '';
      Shouba.sheet.doneOff(inp.value.trim().length < 2 || !dd.value || off || !teachers.length
        || (!all && !Object.keys(chosen).some(function(k){ return chosen[k]; })));
    }
    function paintTo(){ set(allRow, all); rows.forEach(function(row){ set(row, !all && !!chosen[row.dataset.t]); }); ready(); }
    inp.addEventListener('input', ready); dd.addEventListener('input', ready); dd.addEventListener('change', ready);
    bind(allRow, function(){ all = true; chosen = {}; paintTo(); });
    rows.forEach(function(row){ bind(row, function(){
      var t = row.dataset.t;
      if (all) { all = false; chosen = {}; }
      chosen[t] = !chosen[t];
      if (!Object.keys(chosen).some(function(k){ return chosen[k]; })) all = true;
      paintTo();
    }); });
    paintTo();
    if (!dl) setTimeout(function(){ inp.focus(); }, 80);

    function submit(){
      var v = inp.value.trim().replace(/\s+/g, ' ');
      /* لا اهمال صامت ولا حفظ صامت (قاعدة الادخال 2026-09-13) */
      if (v.length < 2) { Shouba.toast('اكتب عنوان الموعد — حرفان على الأقل.'); inp.focus(); return false; }
      if (!dd.value) { Shouba.toast('اختر تاريخ التسليم.'); return false; }
      if (weekend()) { Shouba.toast('هذا اليوم عطلة. اختر يوماً من الأحد إلى الخميس.'); return false; }
      if (!teachers.length) { Shouba.toast('أضف معلمي شعبتك أولاً.'); return false; }
      var list = all ? teachers.slice() : teachers.filter(function(t){ return chosen[t]; });
      var x = dl ? JSON.parse(JSON.stringify(dl)) : { done: [] };
      x.title = v; x.date = dd.value; x.to = list;
      x = Shouba.saveDeadline(x);
      Shouba.sheet.close();
      Shouba.toast((dl ? 'حُفظ الموعد: ' : 'أضيف موعد التسليم: ') + v + ' — ' + whenText(x.date));
      if (dl) dlSheet(x.id); else dlList();
      return true;
    }
  }
  document.getElementById('dlBtn').addEventListener('click', dlList);
  /* ?dl=<المعرف> ⟵ قادم من «بحاجة إلى إجراء» في اللوحة: يفتح الموعد مباشرة */
  var dlq = new URLSearchParams(location.search).get('dl');
  if (dlq) dlSheet(dlq);

  document.getElementById('add2').addEventListener('click', addSheet);
  document.getElementById('add').addEventListener('click', Shouba.quickAdd);
  [].forEach.call(document.querySelectorAll('.tab[data-go]'), function(b){
    b.addEventListener('click', function(){ if(!b.classList.contains('on')) location.href = b.dataset.go; });
  });
  /* المنزل يتولاه bindHome في الطبقة المشتركة — لا مستمع هنا */

  paint();
  /* ?add=1 ⟵ قادم من الإضافة السريعة: تفتح لوحة إضافة المعلم مباشرة */
  if(new URLSearchParams(location.search).get('add')) addSheet();
</script>
</body>
</html>
